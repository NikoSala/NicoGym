<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa de las mejoras de progresión de NicoGym</title>
  <desc id="desc">Mockup con datos de ejemplo de las tarjetas de progresión, el entrenamiento, el gráfico individual y la limpieza segura del historial.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#15161b"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#202127"/><stop offset="1" stop-color="#15161a"/></linearGradient>
    <linearGradient id="burgundy"><stop stop-color="#9b1f3c"/><stop offset="1" stop-color="#671327"/></linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f3efe9; }
      .card { fill: url(#surface); stroke: #34343a; stroke-width: 1.4; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #c89d70; }
      .title { font-size: 30px; font-weight: 800; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .muted { fill: #b7b1aa; }
      .dim { fill: #827d77; }
      .gold { fill: #d6a94a; }
      .rule { stroke: #393940; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="1120" fill="url(#background)"/>
  <circle cx="1320" cy="20" r="230" fill="#7d1028" opacity=".11"/>
  <rect width="1440" height="64" fill="#17181c"/><rect y="62" width="1440" height="3" fill="#87182f"/>
  <rect x="38" y="13" width="38" height="38" rx="11" fill="url(#burgundy)"/>
  <text x="57" y="39" text-anchor="middle" font-size="20" font-weight="800">N</text>
  <text x="88" y="31" font-size="15" font-weight="800">NICOGYM</text>
  <text x="88" y="48" class="small muted">VISTA PREVIA · DATOS DE EJEMPLO</text>
  <text x="1400" y="38" text-anchor="end" class="small muted">CAMBIOS DE PROGRESIÓN Y SEGUIMIENTO</text>
  <text x="42" y="108" class="label">NUEVO EN NICOGYM</text>
  <text x="42" y="145" class="title">Progreso claro, ejercicio por ejercicio.</text>
  <text x="42" y="170" class="body muted">Mockup ilustrativo; los nombres, fechas y cargas son ficticios.</text>

  <!-- Rutina: resumen e indicadores -->
  <rect class="card" x="42" y="194" width="650" height="350" rx="18"/>
  <rect x="42" y="194" width="6" height="350" rx="3" fill="#a51d3a"/>
  <text x="66" y="228" class="label">RUTINAS · LUNES</text>
  <text x="66" y="260" class="heading">Press de pecho en máquina</text>
  <text x="66" y="283" class="small muted">Pecho · 3 series efectivas × 8–12 reps</text>
  <line x1="66" y1="299" x2="668" y2="299" class="rule"/>
  <text x="66" y="324" class="small muted">ÚLTIMA SESIÓN · 31/10/2026</text>
  <text x="66" y="359" font-size="27" font-weight="800">27 <tspan class="small muted">kg</tspan></text>
  <text x="66" y="383" class="body">S1: 12 reps · S2: 12 reps · S3: 12 reps</text>
  <rect x="66" y="399" width="83" height="27" rx="13" fill="#245338" stroke="#70a786"/>
  <text x="108" y="417" text-anchor="middle" class="small" font-weight="800" fill="#8cc29e">SUBIR</text>
  <text x="161" y="410" class="small">3 × 12 con técnica correcta en dos sesiones.</text>
  <text x="161" y="427" class="small muted">Probar un escalón disponible; la app no cambia el peso.</text>
  <line x1="66" y1="444" x2="668" y2="444" class="rule"/>
  <text x="66" y="466" class="small dim">ESTADOS DEL INDICADOR</text>
  <rect x="66" y="480" width="86" height="25" rx="12" fill="#245338" stroke="#70a786"/><text x="109" y="497" text-anchor="middle" class="small" font-weight="800" fill="#8cc29e">SUBIR</text>
  <rect x="160" y="480" width="108" height="25" rx="12" fill="#293541" stroke="#aab3bd"/><text x="214" y="497" text-anchor="middle" class="small" font-weight="800" fill="#c5d0d8">MANTENER</text>
  <rect x="276" y="480" width="78" height="25" rx="12" fill="#493a20" stroke="#d6a550"/><text x="315" y="497" text-anchor="middle" class="small" font-weight="800" fill="#e4bd71">BAJAR</text>
  <rect x="362" y="480" width="99" height="25" rx="12" fill="#303136" stroke="#858991"/><text x="411" y="497" text-anchor="middle" class="small" font-weight="800" fill="#b4b5b9">SIN DATOS</text>
  <text x="472" y="497" class="small dim">Cálculo independiente</text>

  <!-- Entrenamiento -->
  <rect class="card" x="712" y="194" width="686" height="350" rx="18"/>
  <text x="738" y="228" class="label">PANTALLA DE ENTRENAMIENTO</text>
  <text x="738" y="260" class="heading">Progresión de este ejercicio</text>
  <rect x="738" y="274" width="106" height="27" rx="13" fill="#293541" stroke="#aab3bd"/>
  <text x="791" y="292" text-anchor="middle" class="small" font-weight="800" fill="#c5d0d8">MANTENER</text>
  <text x="856" y="291" class="small">Motivo: falta consolidar el máximo con buena técnica.</text>
  <text x="738" y="324" class="small dim">ÚLTIMA SESIÓN · 10/11/2026</text>
  <g>
    <rect x="738" y="337" width="196" height="74" rx="11" fill="#111216" stroke="#393940"/>
    <text x="754" y="359" class="small muted">SERIE 1</text><text x="754" y="393" font-size="22" font-weight="800">12 reps</text><text x="916" y="393" text-anchor="end" class="small gold">27 kg</text>
    <rect x="946" y="337" width="196" height="74" rx="11" fill="#111216" stroke="#393940"/>
    <text x="962" y="359" class="small muted">SERIE 2</text><text x="962" y="393" font-size="22" font-weight="800">11 reps</text><text x="1124" y="393" text-anchor="end" class="small gold">30 kg</text>
    <rect x="1154" y="337" width="218" height="74" rx="11" fill="#111216" stroke="#393940"/>
    <text x="1170" y="359" class="small muted">SERIE 3</text><text x="1170" y="393" font-size="22" font-weight="800">10 reps</text><text x="1354" y="393" text-anchor="end" class="small gold">30 kg</text>
  </g>
  <rect x="738" y="430" width="16" height="16" rx="3" fill="#17181c" stroke="#70a786"/>
  <path d="M742 438l4 4 7-9" fill="none" stroke="#70a786" stroke-width="2"/>
  <text x="764" y="443" class="small muted">Técnica correcta en todas las series</text>
  <text x="738" y="478" class="body muted">Se conserva el peso de cada serie, aunque sea distinto.</text>
  <text x="738" y="501" class="body muted">El estado se recalcula al guardar el entrenamiento.</text>
  <text x="738" y="525" class="small dim">Sin pesos sugeridos ni cambios automáticos.</text>

  <!-- Gráfico dinámico -->
  <rect class="card" x="42" y="568" width="930" height="480" rx="18"/>
  <text x="66" y="601" class="label">PESTAÑA PROGRESO · GRÁFICA DINÁMICA ÚNICA</text>
  <text x="66" y="631" class="heading">Progresión por ejercicio</text>
  <rect x="66" y="644" width="350" height="40" rx="8" fill="#111216" stroke="#45434a"/>
  <text x="80" y="660" class="tiny dim">EJERCICIO</text><text x="80" y="677" class="small">Press de pecho en máquina  ▾</text>
  <rect x="426" y="644" width="220" height="40" rx="8" fill="#111216" stroke="#45434a"/>
  <text x="440" y="660" class="tiny dim">MÉTRICA</text><text x="440" y="677" class="small">Peso utilizado (kg)  ▾</text>
  <line x1="670" y1="665" x2="695" y2="665" stroke="#c33251" stroke-width="3"/><text x="702" y="669" class="small muted">Serie 1</text>
  <line x1="766" y1="665" x2="791" y2="665" stroke="#d6a94a" stroke-width="3"/><text x="798" y="669" class="small muted">Serie 2</text>
  <line x1="862" y1="665" x2="887" y2="665" stroke="#aab3bd" stroke-width="3"/><text x="894" y="669" class="small muted">Serie 3</text>
  <g>
    <line x1="122" y1="719" x2="944" y2="719" class="rule"/><line x1="122" y1="769" x2="944" y2="769" class="rule"/><line x1="122" y1="819" x2="944" y2="819" class="rule"/><line x1="122" y1="869" x2="944" y2="869" class="rule"/>
    <text x="108" y="723" text-anchor="end" class="small muted">32</text><text x="108" y="773" text-anchor="end" class="small muted">29</text><text x="108" y="823" text-anchor="end" class="small muted">26</text><text x="108" y="873" text-anchor="end" class="small muted">23</text><text x="68" y="730" class="small gold">kg</text>
    <polyline points="140,850 300,850 460,800 620,800 780,750 930,750" fill="none" stroke="#c33251" stroke-width="3"/><polyline points="140,800 300,800 460,750 620,750 780,750 930,750" fill="none" stroke="#d6a94a" stroke-width="3"/><polyline points="140,800 300,750 460,750 620,750 780,750 930,750" fill="none" stroke="#aab3bd" stroke-width="3"/>
    <g fill="#c33251"><circle cx="140" cy="850" r="4"/><circle cx="300" cy="850" r="4"/><circle cx="460" cy="800" r="4"/><circle cx="620" cy="800" r="4"/><circle cx="780" cy="750" r="4"/><circle cx="930" cy="750" r="4"/></g><g fill="#d6a94a"><circle cx="140" cy="800" r="4"/><circle cx="300" cy="800" r="4"/><circle cx="460" cy="750" r="4"/><circle cx="620" cy="750" r="4"/><circle cx="780" cy="750" r="4"/><circle cx="930" cy="750" r="4"/></g><g fill="#aab3bd"><circle cx="140" cy="800" r="4"/><circle cx="300" cy="750" r="4"/><circle cx="460" cy="750" r="4"/><circle cx="620" cy="750" r="4"/><circle cx="780" cy="750" r="4"/><circle cx="930" cy="750" r="4"/></g>
    <text x="140" y="899" text-anchor="middle" class="small muted">03/10</text><text x="300" y="899" text-anchor="middle" class="small muted">10/10</text><text x="460" y="899" text-anchor="middle" class="small muted">17/10</text><text x="620" y="899" text-anchor="middle" class="small muted">24/10</text><text x="780" y="899" text-anchor="middle" class="small muted">31/10</text><text x="930" y="899" text-anchor="middle" class="small muted">07/11</text>
  </g>
  <text x="66" y="933" class="small dim">HISTORIAL POR SESIÓN</text>
  <text x="66" y="959" class="small muted">31/10/2026</text><text x="168" y="959" class="small muted">Pesos: S1 27 kg · S2 30 kg · S3 30 kg</text><text x="566" y="959" class="small muted">Reps: 12 · 12 · 12</text><text x="864" y="959" class="small muted">3 series</text>
  <line x1="66" y1="973" x2="946" y2="973" class="rule"/>
  <text x="66" y="997" class="small muted">24/10/2026</text><text x="168" y="997" class="small muted">Pesos: S1 24 kg · S2 27 kg · S3 27 kg</text><text x="566" y="997" class="small muted">Reps: 12 · 11 · 10</text><text x="864" y="997" class="small muted">3 series</text>
  <text x="66" y="1028" class="small dim">El selector solo ofrece ejercicios que siguen en las rutinas actuales.</text>

  <!-- Limpieza y respaldo -->
  <rect class="card" x="992" y="568" width="406" height="480" rx="18"/>
  <text x="1016" y="601" class="label">LIMPIEZA SELECTIVA</text><text x="1016" y="631" class="heading">Corte: 1 oct 2026</text>
  <rect x="1016" y="648" width="358" height="76" rx="10" fill="#111216" stroke="#393940"/><text x="1032" y="674" class="small" fill="#e4a5b2">RESPALDA Y RETIRA</text><text x="1032" y="701" class="body muted">Sesiones anteriores al 1 de octubre</text>
  <rect x="1016" y="736" width="358" height="89" rx="10" fill="#111216" stroke="#393940"/><text x="1032" y="762" class="small" fill="#8cc29e">CONSERVA</text><text x="1032" y="788" class="body muted">Octubre y noviembre · medidas · fotos</text><text x="1032" y="811" class="body muted">Récords · rutinas · configuración</text>
  <text x="1016" y="854" class="small dim">Copia recuperable · ejecución única</text>
  <rect x="1016" y="868" width="358" height="47" rx="8" fill="#2a2023"/><text x="1028" y="888" class="tiny gold">nicoGym_history_backup_before_2026-10-01_v1</text><text x="1028" y="905" class="tiny muted">Recuperación: Storage.restaurarHistorialAnterior()</text>
  <text x="1016" y="942" class="small muted">La base IndexedDB de fotos queda intacta.</text>
  <rect x="1016" y="960" width="358" height="57" rx="10" fill="url(#burgundy)"/><text x="1195" y="985" text-anchor="middle" class="small" font-weight="700">INDICADOR · HISTORIAL · GRÁFICA</text><text x="1195" y="1003" text-anchor="middle" class="tiny">sin alterar datos corporales</text>
  <text x="42" y="1090" class="small dim">Incluye: rutina · pantalla de entrenamiento · gráfica · tabla individual · respaldo y limpieza segura.</text>
</svg>
