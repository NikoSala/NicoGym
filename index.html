                    } else if (tipo === 'solo-peso') {
                        titulo = '📊 Actualización semanal — Solo peso';
                        descripcion = 'Hoy solo debes registrar tu peso. Mediciones y fotos se conservan.';
                        mensajeAdicional = `
                            <div style="padding:10px;background:rgba(255,255,255,0.05);border-radius:var(--radius-sm);margin-bottom:8px;text-align:center;">
                                <span style="font-size:13px;color:var(--text-secondary);">
                                    📏 Mediciones y fotos se conservan de la última actualización completa.
                                </span>
                            </div>
                        `;
                        if (ultimo) {
                            mensajeAdicional += `
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--text-secondary);background:rgba(0,0,0,0.1);padding:8px;border-radius:var(--radius-sm);margin-bottom:8px;">
                                    <div>Último peso: <strong style="color:var(--text);">${ultimo.peso} kg</strong></div>
                                    <div>Última grasa: <strong style="color:var(--text);">${ultimo.grasaPorcentaje}%</strong></div>
                                    <div>Último músculo: <strong style="color:var(--text);">${ultimo.masaMuscular} kg</strong></div>
                                    <div>Última cintura: <strong style="color:var(--text);">${ultimo.cintura} cm</strong></div>
                                </div>
                            `;
                        }
                    }
                }

                const mostrarCamposCompletos = (tipo === 'completa' || tipo === 'mediciones' || !esDomingo || !esFechaValida);

                let html = `
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-plus"></i> ${titulo}</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">${descripcion}</div>
                        ${mensajeAdicional}
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
                            <div class="form-field"><label>Fecha</label><input type="date" id="medFecha" class="input" value="${UI.getHoy()}"></div>
                            <div class="form-field"><label>Peso (kg) *</label><input type="number" id="medPeso" step="0.1" placeholder="${ultimo ? ultimo.peso : '84.3'}" class="input"></div>
                            ${mostrarCamposCompletos ? `
                                <div class="form-field"><label>% Grasa</label><input type="number" id="medGrasa" step="0.1" placeholder="${ultimo ? ultimo.grasaPorcentaje : '27.5'}" class="input"></div>
                                <div class="form-field"><label>Masa muscular (kg)</label><input type="number" id="medMusculo" step="0.1" placeholder="${ultimo ? ultimo.masaMuscular : '58.2'}" class="input"></div>
                                <div class="form-field"><label>Masa magra (kg)</label><input type="number" id="medMagra" step="0.1" placeholder="${ultimo ? ultimo.masaMagra : '62.0'}" class="input"></div>
                                <div class="form-field"><label>Grasa visceral</label><input type="number" id="medVisceral" step="0.5" placeholder="${ultimo ? ultimo.grasaVisceral : '8.0'}" class="input"></div>
                                <div class="form-field" style="grid-column:span 2;"><label>Cintura (cm)</label><input type="number" id="medCintura" step="0.1" placeholder="${ultimo ? ultimo.cintura : '98'}" class="input"></div>

                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-chart-simple"></i> Resumen</div>
                        <div class="peso-grid">
                            <div class="peso-stat"><div class="num primary">${ultimo ? ultimo.peso : '--'}</div><div class="label">Peso</div></div>
                            <div class="peso-stat"><div class="num green">${ultimo ? ultimo.grasaPorcentaje : '--'}%</div><div class="label">Grasa</div></div>
                            <div class="peso-stat"><div class="num orange">${ultimo ? ultimo.masaMuscular : '--'}</div><div class="label">Músculo</div></div>
                        </div>
                        ${primero && ultimo ? `
                            <div style="display:flex;justify-content:space-between;padding:6px 10px;background:rgba(0,0,0,0.1);border-radius:var(--radius-sm);margin-top:6px;font-size:12px;flex-wrap:wrap;gap:4px;">
                                <span>📉 Desde inicio: <strong>${(primero.peso - ultimo.peso).toFixed(1)} kg</strong></span>
                                <span>📏 Cintura: <strong>${ultimo.cintura} cm</strong></span>
                                <span>📊 Grasa visceral: <strong>${ultimo.grasaVisceral || '--'}</strong></span>
                            </div>
                        ` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> Historial</div>
                        <div id="historialMediciones"></div>
                    </div>
                `;
                c.innerHTML = html;
                this._renderHistorial();
            },

            _guardar() {
                const f = document.getElementById('medFecha').value;
                if (!f) { UI.toast('Selecciona fecha', 'error'); return; }

                const peso = parseFloat(document.getElementById('medPeso').value);
                if (isNaN(peso) || peso === 0) { UI.toast('Introduce un peso válido', 'error'); return; }

                const ultimo = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1] : null;
                const idx = STATE.mediciones.findIndex(x => x.fecha === f);
                const ultimoRegistro = (idx !== -1 ? STATE.mediciones[idx] : null) || ultimo || STATE.ultimasMediciones || {
                    grasaPorcentaje: 0,
                    masaMuscular: 0,
                    masaMagra: 0,
                    grasaVisceral: 0,
                    cintura: 0
                };
                const conservarSiVacio = (id, valorAnterior) => {
                    const input = document.getElementById(id);
                    const valor = input ? parseFloat(input.value) : NaN;
                    return Number.isFinite(valor) ? valor : (valorAnterior ?? 0);
                };
                const grasaPorcentaje = conservarSiVacio('medGrasa', ultimoRegistro.grasaPorcentaje);
                const masaMuscular = conservarSiVacio('medMusculo', ultimoRegistro.masaMuscular);
                const masaMagra = conservarSiVacio('medMagra', ultimoRegistro.masaMagra);
                const grasaVisceral = conservarSiVacio('medVisceral', ultimoRegistro.grasaVisceral);
                const cintura = conservarSiVacio('medCintura', ultimoRegistro.cintura);
                const nm = {
                    fecha: f,
                    peso: peso,
                    grasaPorcentaje: grasaPorcentaje,
                    masaMuscular: masaMuscular,
                    masaMagra: masaMagra || 0,
                    grasaVisceral: grasaVisceral || 0,
                    cintura: cintura
                };

                if (idx !== -1) STATE.mediciones[idx] = nm;
                else STATE.mediciones.push(nm);

                STATE.mediciones.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
                STATE.recordatorios.ultimaMedicion = f;

                STATE.ultimasMediciones = {
                    grasaPorcentaje: grasaPorcentaje,
                    masaMuscular: masaMuscular,
                    masaMagra: masaMagra || 0,
                    grasaVisceral: grasaVisceral || 0,
                    cintura: cintura
                };

                Storage._save();
                UI.toast('✅ Datos guardados', 'success');
                this.render();
                APP.renderizarTodo();
                document.getElementById('medPeso').value = '';

            _renderHistorial() {
                const c = document.getElementById('historialMediciones');

                if (STATE.mediciones.length === 0) {
                    c.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:10px;">Sin registros</div>';

                }
                const rev = [...STATE.mediciones].reverse();
                c.innerHTML = rev.map((m, i) => {
                    const diff = i < rev.length - 1 ? (m.peso - rev[i + 1].peso).toFixed(1) : null;
                    return `
                        <div class="historial-medicion-card" onclick="Peso._toggleDetalle(${i})">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span class="med-fecha">${UI.formatearFecha(m.fecha)}</span>
                                <span style="font-weight:600;">${m.peso} kg</span>
                            </div>
                            <div class="med-resumen">
                                <span class="med-item">📏 <span class="valor">${m.cintura}</span> cm</span>

                                <span class="med-item">🔥 <span class="valor">${m.grasaPorcentaje}</span>%</span>
                                ${diff !== null && Math.abs(parseFloat(diff)) > 0 ? `<span class="med-item ${parseFloat(diff) < 0 ? 'positive' : 'negative'}">${parseFloat(diff) > 0 ? '+' : ''}${diff} kg</span>` : ''}
                            </div>
                            <div class="historial-medicion-detalle" id="pesoDetalle-${i}">
                                <div class="detalle-item"><span>Peso</span><span>${m.peso} kg</span></div>
                                <div class="detalle-item"><span>Cintura</span><span>${m.cintura} cm</span></div>
                                <div class="detalle-item"><span>% Grasa</span><span>${m.grasaPorcentaje}%</span></div>
                                <div class="detalle-item"><span>Masa muscular</span><span>${m.masaMuscular} kg</span></div>
                                <div class="detalle-item"><span>Masa magra</span><span>${m.masaMagra || '--'} kg</span></div>
                                <div class="detalle-item"><span>Grasa visceral</span><span>${m.grasaVisceral || '--'}</span></div>
                                <div style="margin-top:6px;display:flex;gap:6px;justify-content:center;">
                                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();Peso._editar('${m.fecha}')"><i class="fa-solid fa-pen"></i> Editar</button>
                                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();Peso._eliminar('${m.fecha}')"><i class="fa-solid fa-trash"></i> Eliminar</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            _toggleDetalle(i) {
                const d = document.getElementById(`pesoDetalle-${i}`);
                if (d) d.classList.toggle('open');
            },

            _editar(f) {
                const m = STATE.mediciones.find(x => x.fecha === f);
                if (!m) return;
                document.getElementById('medFecha').value = m.fecha;
                document.getElementById('medPeso').value = m.peso;
                document.getElementById('medGrasa').value = m.grasaPorcentaje;
                document.getElementById('medMusculo').value = m.masaMuscular;
                document.getElementById('medMagra').value = m.masaMagra || '';
                document.getElementById('medVisceral').value = m.grasaVisceral || '';
                document.getElementById('medCintura').value = m.cintura;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            _eliminar(f) {
                UI.confirmar('¿Eliminar esta medición?', () => {

        // ==========================================
        // ESTADÍSTICAS
        // ==========================================
        const Estadisticas = {
            render() {
                const c = document.getElementById('estadisticasContainer');
                if (!c) return;

                const ev = STATE.evolution;
                const total = STATE.diasEntrenados.length || 0;
                const wc = (ev.currentWeight - ev.initialWeight).toFixed(1);
                const wc2 = (ev.currentWaist - ev.initialWaist).toFixed(1);
                const altura = STATE.altura || CONFIG.ALTURA;
                const imc = ev.currentWeight / ((altura / 100) ** 2);

            _abrirDB() {
                return new Promise(r => {
                    const req = indexedDB.open(this.DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        if (!e.target.result.objectStoreNames.contains(this.STORE_NAME))
                            e.target.result.createObjectStore(this.STORE_NAME, { keyPath: 'fecha' });
                    };
                    req.onsuccess = e => { this.db = e.target.result;
                        r(); };
                    req.onerror = () => r();
                });
            },

            async exportarBackup() {
                await this._abrirDB();
                if (!this.db) throw new Error('No se pudo abrir la base de fotos');

                return new Promise((resolve, reject) => {
                    const req = this.db.transaction(this.STORE_NAME, 'readonly')
                        .objectStore(this.STORE_NAME).getAll();
                    req.onsuccess = e => {
                        const fotos = (e.target.result || [])
                            .filter(dia => dia && typeof dia.fecha === 'string')
                            .map(dia => ({
                                fecha: dia.fecha,
                                timestamp: dia.timestamp,
                                frente: dia.frente || null,
                                espalda: dia.espalda || null,
                                izquierda: dia.izquierda || null,
                                derecha: dia.derecha || null
                            }));
                        resolve(fotos);
                    };
                    req.onerror = () => reject(req.error || new Error('No se pudieron leer las fotos'));
                });
            },

            async restaurarBackup(diasFotos) {
                await this._abrirDB();
                if (!this.db) throw new Error('No se pudo abrir la base de fotos');

                const fotosValidas = diasFotos
                    .filter(dia => dia && typeof dia.fecha === 'string')
                    .map(dia => ({
                        fecha: dia.fecha,
                        timestamp: Number.isFinite(dia.timestamp) ? dia.timestamp : Date.now(),
                        frente: dia.frente || null,
                        espalda: dia.espalda || null,
                        izquierda: dia.izquierda || null,
                        derecha: dia.derecha || null
                    }));

                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.STORE_NAME, 'readwrite');
                    const store = tx.objectStore(this.STORE_NAME);
                    store.clear();
                    fotosValidas.forEach(dia => store.put(dia));
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error || new Error('No se pudieron restaurar las fotos'));
                    tx.onabort = () => reject(tx.error || new Error('Se canceló la restauración de fotos'));
                });
            },

            _leerArchivo(file) {
                if (!file) return Promise.resolve(null);
                return new Promise(r => { const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(file); });
            },

            _obtenerFechas() {

            async _guardar() {
                const f = document.getElementById('fechaFotos').value;
                if (!f) { UI.toast('Selecciona fecha', 'error'); return; }

                const inputs = document.querySelectorAll('.equip-card input[type="file"]');
                const files = {};
                for (const input of inputs) {
                    const label = input.parentElement.querySelector('.label').textContent;
                    files[label] = input.files[0];
                }

                const fr = await this._leerArchivo(files['Frente']);
                const es = await this._leerArchivo(files['Espalda']);
                const iz = await this._leerArchivo(files['Izquierda']);
                const de = await this._leerArchivo(files['Derecha']);

                if (!fr && !es && !iz && !de) { UI.toast('Selecciona al menos una foto', 'error'); return; }

                await this._abrirDB();
                await this.db.transaction(this.STORE_NAME, 'readwrite').objectStore(this.STORE_NAME).put({
                    fecha: f,
                    timestamp: Date.now(),
                    frente: fr,
                    espalda: es,
                    izquierda: iz,
                    derecha: de

                STATE.recordatorios.ultimasFotos = f;

                            </div>
                        </div>

                            <div style="color:var(--text-secondary);">📏 Mediciones: <strong>cada 2 semanas</strong></div>
                            <div style="color:var(--text-secondary);">📸 Fotos: <strong>cada 4 semanas</strong></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-database"></i> Datos</div>
                        <button class="btn btn-ghost btn-block" onclick="Storage.exportar()"><i class="fa-solid fa-download"></i> Exportar</button>
                        <button class="btn btn-ghost btn-block" onclick="document.getElementById('importFile').click()" style="margin-top:4px;"><i class="fa-solid fa-upload"></i> Importar</button>
                        <input type="file" id="importFile" accept=".json" class="hidden" onchange="Storage.importar(this.files[0]); this.value='';">
                        <button class="btn btn-danger btn-block" onclick="APP.confirmarReset()" style="margin-top:4px;"><i class="fa-solid fa-trash"></i> Borrar todos los datos</button>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-circle-info"></i> Acerca de</div>
                        <div class="ajustes-item"><span class="aj-label">Versión</span><span style="color:var(--text-secondary);" id="versionDisplay">${CONFIG.VERSION}</span></div>
                        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px;">NicoGym · Tu compañero de entrenamiento</div>
                    </div>
                `;
            },

            _guardar() {
                const nombre = document.getElementById('ajusteNombre').value || 'Nico';
                const altura = parseInt(document.getElementById('ajusteAltura').value) || CONFIG.ALTURA;
                const objetivo = parseInt(document.getElementById('ajusteObjetivo').value) || CONFIG.PESO_OBJETIVO;
                STATE.nombre = nombre;
                STATE.altura = altura;
                CONFIG.PESO_OBJETIVO = objetivo;
                STATE.ajustes = { nombre, altura, objetivo };
                Storage._save();
                UI.toast('✅ Ajustes guardados', 'success');
                APP.renderizarTodo();
            },

            _guardarRecordatorios() {
                const fm = parseInt(document.getElementById('ajusteFreqMediciones').value) || 2;
                const ff = parseInt(document.getElementById('ajusteFreqFotos').value) || 4;
                STATE.recordatorios.freqMediciones = fm;
                STATE.recordatorios.freqFotos = ff;
                Storage._save();
                UI.toast('✅ Recordatorios guardados', 'success');
                APP.renderizarTodo();
            },

            _toggleDescanso() {
                CONFIG.TEMPORIZADOR_DESCANSO = !CONFIG.TEMPORIZADOR_DESCANSO;
                STATE.config.temporizadorDescanso = CONFIG.TEMPORIZADOR_DESCANSO;
                Storage._save();
                this.render();
                UI.toast(`⏱️ Temporizador ${CONFIG.TEMPORIZADOR_DESCANSO ? 'activado' : 'desactivado'}`, 'info');
            }
        };

        // ==========================================
        // INICIO
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
