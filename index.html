<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NicoGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --bg-card: #162033;
            --bg-card-hover: #1e2d4a;
            --primary: #3b82f6;
            --primary-dim: rgba(59, 130, 246, 0.12);
            --primary-glow: rgba(59, 130, 246, 0.30);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --transition: 0.25s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: var(--radius-full); }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-xs { gap: var(--space-xs); }
        .gap-sm { gap: var(--space-sm); }
        .mt-xs { margin-top: var(--space-xs); }
        .mt-sm { margin-top: var(--space-sm); }
        .mt-md { margin-top: var(--space-md); }
        .mt-lg { margin-top: var(--space-lg); }
        .mb-xs { margin-bottom: var(--space-xs); }
        .mb-sm { margin-bottom: var(--space-sm); }
        .mb-md { margin-bottom: var(--space-md); }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .text-primary { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .w-full { width: 100%; }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px;
            padding: 0 var(--space-sm); background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 30%, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo i { -webkit-text-fill-color: initial; color: var(--primary); margin-right: 4px; }
        .top-right { display: flex; align-items: center; gap: 12px; }
        .top-stats { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; background: var(--bg-card); padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid var(--border); color: var(--text-secondary); }
        .top-stats strong { color: var(--text); }

        .bell-wrap { position: relative; cursor: pointer; padding: 6px; border-radius: 50%; transition: var(--transition); background: transparent; border: none; color: var(--text-secondary); font-size: 18px; }
        .bell-wrap:hover { background: var(--bg-card); color: var(--text); }
        .bell-wrap .badge { position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; transform: translate(4px, -4px); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); }

        .notif-dropdown {
            position: absolute; top: calc(100% + 8px); right: -8px; width: 300px; max-height: 380px;
            overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 0; box-shadow: var(--shadow); display: none; z-index: 1100;
        }
        .notif-dropdown.open { display: block; }
        .notif-dropdown .notif-header { padding: 0 var(--space-sm) 10px var(--space-sm); font-weight: 600; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .notif-item { display: flex; align-items: center; gap: 10px; padding: 8px var(--space-sm); font-size: 13px; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: rgba(255,255,255,0.03); }
        .notif-item .ni-icon { font-size: 18px; flex-shrink: 0; }
        .notif-item .ni-text { flex: 1; }
        .notif-empty { padding: 20px var(--space-sm); text-align: center; color: var(--text-secondary); font-size: 13px; }

        .side-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .side-overlay.open { opacity: 1; pointer-events: auto; }
        .side-menu {
            position: fixed; top: 0; left: -300px; width: 290px; height: 100%;
            background: var(--bg-card); border-right: 1px solid var(--border); z-index: 1001;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 70px var(--space-sm) var(--space-md); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
        }
        .side-menu.open { left: 0; }
        .side-menu .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: var(--transition); border: none; background: transparent; width: 100%; text-align: left; }
        .side-menu .menu-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .side-menu .menu-item.active { background: var(--primary-dim); color: var(--primary); }
        .side-menu .menu-item i { width: 22px; font-size: 16px; text-align: center; flex-shrink: 0; }
        .side-menu .menu-divider { height: 1px; background: var(--border); margin: 8px 14px; }
        .side-menu .menu-footer { margin-top: auto; padding-top: 12px; font-size: 11px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; height: 62px;
            background: rgba(11, 17, 32, 0.94); backdrop-filter: blur(14px) saturate(1.4);
            border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 4px;
        }
        .bottom-nav .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: none; color: var(--text-secondary); font-size: 9px; font-weight: 500; padding: 4px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); position: relative; letter-spacing: 0.3px; text-transform: uppercase; }
        .bottom-nav .nav-btn i { font-size: 18px; transition: var(--transition); }
        .bottom-nav .nav-btn.active { color: var(--primary); }
        .bottom-nav .nav-btn.active i { transform: translateY(-1px); }
        .bottom-nav .nav-btn:active { transform: scale(0.96); }

        .page { display: none; padding: 72px var(--space-sm) 76px; max-width: 520px; margin: 0 auto; min-height: 100vh; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin-bottom: var(--space-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .card:hover { border-color: rgba(255,255,255,0.10); }
        .card-accent { border-left: 3px solid var(--primary); background: linear-gradient(135deg, var(--primary-dim), rgba(59,130,246,0.02)); }
        .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 14px; }
        .card-title i { margin-right: 6px; color: var(--primary); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
            border: none; cursor: pointer; transition: var(--transition); text-decoration: none;
            font-family: var(--font); background: var(--bg-card); color: var(--text);
            border: 1px solid var(--border); height: 40px; min-height: 40px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { box-shadow: 0 0 24px var(--primary-glow); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #000; border-color: var(--success); }
        .btn-success:hover { box-shadow: 0 0 24px rgba(34,197,94,0.25); transform: translateY(-1px); }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(239,68,68,0.08); }
        .btn-sm { padding: 4px 14px; font-size: 12px; height: 32px; min-height: 32px; }
        .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { border-color: var(--text-secondary); color: var(--text); }
        .btn-block { width: 100%; justify-content: center; }

        .input {
            width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: rgba(0,0,0,0.2);
            color: var(--text); font-size: 14px; font-family: var(--font);
            outline: none; transition: var(--transition);
        }
        .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
        .input-sm { padding: 6px 10px; font-size: 12px; }

        .saludo { font-size: 26px; font-weight: 700; margin-bottom: 2px; letter-spacing: -0.5px; }
        .saludo span { color: var(--primary); }
        .saludo-dia { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-md); }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
        .dash-stat { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center; }
        .dash-stat .num { font-size: 30px; font-weight: 700; }
        .dash-stat .num.green { color: var(--success); }
        .dash-stat .num.primary { color: var(--primary); }
        .dash-stat .num.orange { color: var(--warning); }
        .dash-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .pending-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .pending-item:last-child { border-bottom: none; }
        .pending-item .pi-icon { font-size: 18px; }

        /* RUTINAS - SEMANA */
        .tab-dias { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
        .tab-dias::-webkit-scrollbar { display: none; }
        .tab-dias .tab-dia { flex-shrink: 0; padding: 6px 16px; border-radius: var(--radius-full); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .tab-dias .tab-dia:hover { border-color: var(--text-secondary); }
        .tab-dias .tab-dia.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tab-dias .tab-dia.completado { border-color: var(--success); color: var(--success); }
        .tab-dias .tab-dia.descanso { opacity: 0.5; }

        /* EJERCICIO CON IMAGEN GRANDE */
        .ejercicio-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .ejercicio-card:hover { border-color: rgba(255,255,255,0.10); }
        .ejercicio-card .ej-top { display: flex; gap: 16px; align-items: flex-start; }
        .ejercicio-card .ej-img-wrap { flex-shrink: 0; width: 120px; height: 120px; border-radius: var(--radius-sm); overflow: hidden; background: rgba(0,0,0,0.2); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .ejercicio-card .ej-img-wrap:hover { transform: scale(1.02); }
        .ejercicio-card .ej-img { width: 100%; height: 100%; object-fit: cover; }
        .ejercicio-card .ej-img-fallback { width: 120px; height: 120px; border-radius: var(--radius-sm); background: var(--primary-dim); display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--primary); border: 1px solid var(--border); flex-shrink: 0; }
        .ejercicio-card .ej-info { flex: 1; min-width: 0; }
        .ejercicio-card .ej-nombre { font-size: 16px; font-weight: 600; }
        .ejercicio-card .ej-datos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; font-size: 12px; color: var(--text-secondary); }
        .ejercicio-card .ej-datos span { background: rgba(0,0,0,0.15); padding: 2px 10px; border-radius: var(--radius-full); }
        .ejercicio-card .ej-ultimo { margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
        .ejercicio-card .ej-ultimo strong { color: var(--text); }
        .ejercicio-card .ej-botones { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .ejercicio-card .ej-botones .btn { flex: 1; min-width: 80px; }

        .ej-tecnica {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .ej-tecnica.open { display: block; }
        .ej-tecnica .tec-paso { display: flex; gap: 8px; padding: 2px 0; align-items: flex-start; }
        .ej-tecnica .tec-numero { font-weight: 700; color: var(--primary); min-width: 20px; }
        .ej-tecnica .tec-texto { color: var(--text-secondary); }
        .ej-tecnica .tec-titulo { color: var(--text); font-weight: 600; margin-top: 6px; margin-bottom: 2px; }
        .ej-tecnica .tec-titulo:first-child { margin-top: 0; }

        .btn-completar { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm); margin-top: var(--space-sm); }

        .historial-ejercicio { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border); }
        .historial-ejercicio .he-nombre { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .historial-ejercicio .he-sesion { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
        .historial-ejercicio .he-sesion:last-child { border-bottom: none; }
        .historial-ejercicio .he-sesion .he-peso { font-weight: 600; color: var(--primary); }
        .historial-ejercicio .he-sesion .he-reps { color: var(--text-secondary); }
        .historial-ejercicio .he-sesion .he-fecha { font-size: 11px; color: var(--text-secondary); }
        .historial-ejercicio .he-progreso { color: var(--success); font-size: 12px; font-weight: 600; margin-top: 4px; }

        .historial-entreno { background: var(--bg-card); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 6px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .historial-entreno .he-fecha { font-size: 13px; font-weight: 600; }
        .historial-entreno .he-estado { color: var(--success); font-size: 14px; }
        .historial-entreno .he-duracion { font-size: 12px; color: var(--text-secondary); }

        .stats-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
        .stats-item-2 { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
        .stats-item-2 .num { font-size: 24px; font-weight: 700; }
        .stats-item-2 .num.green { color: var(--success); }
        .stats-item-2 .num.primary { color: var(--primary); }
        .stats-item-2 .num.orange { color: var(--warning); }
        .stats-item-2 .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-panel {
            background: var(--bg-card); border-radius: var(--radius); padding: 24px;
            max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-panel .modal-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 4px; transition: var(--transition); }
        .modal-panel .modal-close:hover { color: var(--text); }
        .modal-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }

        .toast-msg {
            position: fixed; bottom: 80px; left: var(--space-sm); right: var(--space-sm);
            padding: 12px 18px; border-radius: var(--radius-sm); text-align: center; font-weight: 600;
            z-index: 4000; animation: toastIn 0.3s ease, toastOut 0.4s 2.6s forwards;
            max-width: 400px; margin: 0 auto; box-shadow: var(--shadow);
        }
        .toast-success { background: var(--success); color: #000; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(10px); visibility: hidden; } }

        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 3000; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 92%; max-height: 92%; object-fit: contain; border-radius: var(--radius-sm); }

        .ajustes-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .ajustes-item:last-child { border-bottom: none; }
        .ajustes-item .aj-label { font-size: 13px; }

        @media (max-width: 420px) {
            .top-stats { display: none; }
            .side-menu { width: 260px; left: -260px; }
            .page { padding: 68px 12px 72px; }
            .card { padding: 16px 18px; }
            .stats-grid-2 { grid-template-columns: 1fr 1fr; }
            .modal-panel { padding: 18px; }
            .ejercicio-card .ej-img-wrap { width: 80px; height: 80px; }
            .ejercicio-card .ej-img-fallback { width: 80px; height: 80px; font-size: 32px; }
        }
        @media (min-width: 600px) {
            .page { padding: 76px 20px 80px; }
            .bottom-nav .nav-btn { padding: 4px 20px; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="logo"><i class="fa-solid fa-dumbbell"></i>NicoGym</div>
        <div class="top-right">
            <div class="top-stats">
                <span id="topPesoDisplay">-- kg</span>
                <span>·</span>
                <span>🎯 <strong id="topObjetivo">75</strong></span>
            </div>
            <div class="bell-wrap" id="bellWrap" onclick="UI.toggleNotif()">
                <i class="fa-regular fa-bell"></i>
                <span class="badge hidden" id="bellBadge">0</span>
                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">🔔 Pendientes</div>
                    <div id="notifList">
                        <div class="notif-empty">Sin notificaciones</div>
                    </div>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="UI.toggleMenu()" style="padding:4px 10px;font-size:16px;">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- SIDE MENU -->
    <div class="side-overlay" id="sideOverlay" onclick="UI.toggleMenu()"></div>
    <nav class="side-menu" id="sideMenu">
        <button class="menu-item active" onclick="APP.navegar('inicio')"><i class="fa-solid fa-house"></i> Inicio</button>
        <button class="menu-item" onclick="APP.navegar('rutinas')"><i class="fa-solid fa-dumbbell"></i> Rutinas</button>
        <button class="menu-item" onclick="APP.navegar('historial')"><i class="fa-solid fa-clock-rotate-left"></i> Historial</button>
        <button class="menu-item" onclick="APP.navegar('estadisticas')"><i class="fa-solid fa-chart-bar"></i> Estadísticas</button>
        <button class="menu-item" onclick="APP.navegar('ajustes')"><i class="fa-solid fa-gear"></i> Ajustes</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="APP.confirmarReset()" style="color:var(--danger);"><i class="fa-solid fa-trash"></i> Reset</button>
        <div class="menu-footer">NicoGym 2.0</div>
    </nav>

    <!-- PAGES -->
    <div class="page active" id="page-inicio">
        <div id="dashboardContainer"></div>
    </div>

                    { nombre: 'Sentadilla Goblet', series: 4, reps: '6-10', descanso: '120s',

                    { nombre: 'Elevación de gemelos', series: 3, reps: '8-12', descanso: '60s',

                    { nombre: 'Curl femoral (búlgaro)', series: 3, reps: '10-15', descanso: '60s',
                        img: '',
                        tecnica: '1️⃣ Apoya un pie en una superficie elevada.\n2️⃣ Baja la cadera controladamente.\n3️⃣ Mantén el equilibrio.\n4️⃣ Sube hasta estirar la pierna.\n5️⃣ Respira: inhala al bajar, exhala al subir.' },
                    { nombre: 'Plancha', series: 3, reps: '30-45s', descanso: '45s',
                        img: '',
                        tecnica: '1️⃣ Apoya antebrazos y puntas de pies.\n2️⃣ Cuerpo recto, abdomen contraído.\n3️⃣ No dejes caer la cadera.\n4️⃣ Mantén la posición el tiempo indicado.\n5️⃣ Respira: mantén la respiración constante.' }
                ],
                jueves: [
                    { nombre: 'Press militar mancuernas', series: 4, reps: '6-10', descanso: '120s',
                        img: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Shoulder-Press.gif',
                        tecnica: '1️⃣ Sentado, mancuernas a altura de orejas.\n2️⃣ Empuja hacia arriba sin bloquear codos.\n3️⃣ Baja controladamente hasta las orejas.\n4️⃣ Mantén la espalda recta.\n5️⃣ Respira: exhala al subir, inhala al bajar.' },
                    { nombre: 'Remo al mentón', series: 4, reps: '6-10', descanso: '90s',
                        img: 'https://api.smartworkout.app/asset/image/80833bf7-99b5-4272-b3b2-629ccc137ce1',
                        tecnica: '1️⃣ De pie, mancuernas sobre muslos.\n2️⃣ Sube verticalmente hacia el mentón.\n3️⃣ Codos hacia arriba.\n4️⃣ Baja controladamente.\n5️⃣ Respira: exhala al subir, inhala al bajar.' },
                    { nombre: 'Aperturas inclinadas', series: 3, reps: '8-12', descanso: '90s',
                        img: 'https://media.tenor.com/oJXOnsC72qMAAAAM/crussifixo-no-banco-com-halteres.gif',
                        tecnica: '1️⃣ Tumbado en banco inclinado, mancuernas juntas arriba.\n2️⃣ Abre brazos en arco.\n3️⃣ Vuelve a juntar las mancuernas.\n4️⃣ Controla el movimiento.\n5️⃣ Respira: inhala al abrir, exhala al cerrar.' },
                    { nombre: 'Curl martillo', series: 3, reps: '10-15', descanso: '60s',
                        img: 'https://api.smartworkout.app/asset/image/8588e41c-5c2d-4ee0-90ca-ad69b7d0438a',
                        tecnica: '1️⃣ Agarre neutro, muñeca recta.\n2️⃣ Curva hacia el hombro.\n3️⃣ Baja controladamente.\n4️⃣ Mantén codos fijos.\n5️⃣ Respira: exhala al subir, inhala al bajar.' },
                    { nombre: 'Patada de tríceps', series: 3, reps: '10-15', descanso: '60s',
                        img: 'https://i.pinimg.com/originals/96/a1/b6/96a1b68a9a9f4c853b695a3740e91326.gif',
                        tecnica: '1️⃣ Rodilla y mano apoyadas en banco.\n2️⃣ Estira brazo hacia atrás hasta paralelo al suelo.\n3️⃣ Mantén el codo fijo.\n4️⃣ Baja controladamente.\n5️⃣ Respira: exhala al estirar, inhala al volver.' }
                ],
                viernes: [
                    { nombre: 'Peso muerto rumano', series: 4, reps: '6-10', descanso: '120s',
                        img: '',
                        tecnica: '1️⃣ De pie, barra o mancuernas frente a ti.\n2️⃣ Baja con espalda recta hasta sentir el isquio.\n3️⃣ Sube con cadera.\n4️⃣ No redondees la espalda.\n5️⃣ Respira: inhala al bajar, exhala al subir.' },
                    { nombre: 'Sentadilla búlgara', series: 4, reps: '6-10', descanso: '90s',
                        img: '',
                        tecnica: '1️⃣ Un pie atrás apoyado en banco.\n2️⃣ Baja hasta que rodilla delantera forme 90°.\n3️⃣ Sube con el talón.\n4️⃣ Mantén el equilibrio.\n5️⃣ Respira: inhala al bajar, exhala al subir.' },
                    { nombre: 'Curl femoral tumbado', series: 3, reps: '8-12', descanso: '60s',
                        img: '',
                        tecnica: '1️⃣ Tumbado boca abajo.\n2️⃣ Flexiona rodillas llevando talones a glúteos.\n3️⃣ Sube y baja controladamente.\n4️⃣ Mantén la cadera apoyada.\n5️⃣ Respira: exhala al subir, inhala al bajar.' },
                    { nombre: 'Elevación gemelos', series: 3, reps: '10-15', descanso: '60s',
                        img: 'https://i.pinimg.com/originals/2f/7c/ca/2f7cca8d37c65384c1d0bd84cc0a91d1.gif',
                        tecnica: '1️⃣ De pie, mancuernas a los lados.\n2️⃣ Elévate con la punta de los pies.\n3️⃣ Baja controladamente.\n4️⃣ Mantén el equilibrio.\n5️⃣ Respira: exhala al subir, inhala al bajar.' },
                    { nombre: 'Abdominales', series: 3, reps: '15-20', descanso: '45s',
                        img: '',
                        tecnica: '1️⃣ Tumbado boca arriba, rodillas flexionadas.\n2️⃣ Eleva el torso hacia las rodillas.\n3️⃣ Baja controladamente.\n4️⃣ No tires del cuello.\n5️⃣ Respira: exhala al subir, inhala al bajar.' }
                ]
            }
        };

        // ==========================================
        // STATE
        // ==========================================
        const STATE = {
            nombre: 'Nico',
            altura: CONFIG.ALTURA,
            pesoObjetivo: CONFIG.PESO_OBJETIVO,
            mediciones: [],
            historialEntrenos: [],
            diasEntrenados: [],
            registroEjercicios: {},
            evolution: { currentWeight: 0, totalWorkouts: 0, totalTime: 0 },
            ajustes: {}
        };

        // ==========================================
        // STORAGE
        // ==========================================
        const Storage = {
            init() {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    Object.assign(STATE, d);
                    if (!STATE.registroEjercicios) STATE.registroEjercicios = {};
                    if (!STATE.evolution) STATE.evolution = { currentWeight: 0, totalWorkouts: 0, totalTime: 0 };
                    if (!STATE.ajustes) STATE.ajustes = {};
                }
                if (STATE.mediciones.length > 0) {
                    STATE.evolution.currentWeight = STATE.mediciones[STATE.mediciones.length - 1].peso;
                }
                STATE.evolution.totalWorkouts = STATE.diasEntrenados.length || 0;
                this._save();
                return this;
            },
            _save() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE)); },
            resetAll() { localStorage.removeItem(CONFIG.STORAGE_KEY); location.reload(); },
            exportar() {
                const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'nicogym_backup.json';
                a.click();
                UI.toast('✅ Datos exportados', 'success');
            },
            importar(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const datos = JSON.parse(e.target.result);
                        Object.assign(STATE, datos);
                        this._save();
                        UI.toast('✅ Datos importados', 'success');
                        APP.renderizarTodo();
                    } catch (err) { UI.toast('❌ Error al importar', 'error'); }
                };
                reader.readAsText(file);
            }
        };

        // ==========================================
        // UI
        // ==========================================
        const UI = {
            toast(msg, tipo = 'info') {
                const t = document.createElement('div');
                t.className = `toast-msg toast-${tipo}`;
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            },
            confirmar(msg, cb) {
                Modal.abrir(`
                    <h3>${msg}</h3>
                    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
                        <button class="btn btn-danger" onclick="Modal.cerrar(); (${cb.toString()})()">Confirmar</button>
                        <button class="btn btn-ghost" onclick="Modal.cerrar()">Cancelar</button>
                    </div>
                `);
            },
            toggleMenu() {
                document.getElementById('sideMenu').classList.toggle('open');
                document.getElementById('sideOverlay').classList.toggle('open');
            },
            toggleNotif() { document.getElementById('notifDropdown').classList.toggle('open'); },
            cerrarLightbox() { document.getElementById('lightbox').classList.remove('active'); },
            abrirLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('active'); },
            getHoy() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            formatFecha(fecha) { return new Date(fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); },
            getDiaNombre() {
                const mapa = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes', 6: 'sabado' };
                return mapa[new Date().getDay()] || 'lunes';
            },
            getDiaSemanaNombre(d) { return CONFIG.DIAS_SEMANA[d.getDay()] || ''; },
            actualizarTopBar() {
                const p = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                document.getElementById('topPesoDisplay').textContent = p + ' kg';
                document.getElementById('topObjetivo').textContent = STATE.pesoObjetivo || CONFIG.PESO_OBJETIVO;
            }
        };

        const Modal = {
            abrir(html) {
                document.getElementById('modalGlobalContent').innerHTML = html;
                document.getElementById('modalGlobal').classList.remove('hidden');
            },
            cerrar() {
                document.getElementById('modalGlobal').classList.add('hidden');
            }
        };

        function getDiasHasta(fecha) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            return Math.round((fecha - hoy) / 86400000);
        }

        // ==========================================
        // APP
        // ==========================================
        const APP = {
            init() {
                Storage.init();
                this._cargarAjustes();
                this.renderizarTodo();
                this._eventos();
                document.addEventListener('click', (e) => {
                    const bell = document.getElementById('bellWrap');
                    const drop = document.getElementById('notifDropdown');
                    if (bell && drop && !bell.contains(e.target)) drop.classList.remove('open');
                });
                return this;
            },
            _eventos() {
                document.getElementById('importFile').addEventListener('change', function() { Storage.importar(this.files[0]); });
            },
            _cargarAjustes() {
                const a = STATE.ajustes || {};
                if (a.nombre) STATE.nombre = a.nombre;
                if (a.altura) STATE.altura = a.altura || CONFIG.ALTURA;
                if (a.pesoObjetivo) STATE.pesoObjetivo = a.pesoObjetivo;
            },
            renderizarTodo() {
                UI.actualizarTopBar();
                Dashboard.render();
                Rutinas.render();
                Historial.render();
                Estadisticas.render();
                Ajustes.render();
                Notificaciones.render();
            },
            navegar(id) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const page = document.getElementById(`page-${id}`);
                if (page) page.classList.add('active');

                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.nav-btn').forEach(b => {
                    if (b.textContent.trim().toLowerCase().includes(id) ||
                        (id === 'estadisticas' && b.textContent.includes('Stats')) ||
                        (id === 'historial' && b.textContent.includes('Historial'))) {
                        b.classList.add('active');
                    }
                });

                document.querySelectorAll('.side-menu .menu-item').forEach(m => m.classList.remove('active'));
                document.querySelectorAll('.side-menu .menu-item').forEach(m => {
                    const txt = m.textContent.trim().toLowerCase();
                    if (txt.includes(id) || (id === 'estadisticas' && txt.includes('estadísticas')) ||
                        (id === 'historial' && txt.includes('historial'))) {
                        m.classList.add('active');
                    }
                });

                if (document.getElementById('sideMenu').classList.contains('open')) UI.toggleMenu();
                window.scrollTo(0, 0);
                if (id === 'rutinas') Rutinas.render();
                if (id === 'historial') Historial.render();
                if (id === 'estadisticas') Estadisticas.render();
                if (id === 'ajustes') Ajustes.render();
                if (id === 'inicio') Dashboard.render();
            },
            confirmarReset() { UI.confirmar('¿Borrar TODOS los datos? No se puede deshacer.', () => Storage.resetAll()); }
        };

        // ==========================================
        // DASHBOARD
        // ==========================================
        const Dashboard = {
            render() {
                const c = document.getElementById('dashboardContainer');
                if (!c) return;

                const hoy = new Date();
                const horas = hoy.getHours();
                let saludo = 'Buenos días';
                if (horas >= 14 && horas < 21) saludo = 'Buenas tardes';
                if (horas >= 21 || horas < 6) saludo = 'Buenas noches';

                const dia = UI.getDiaNombre();
                const infoDia = CONFIG.SEMANA[dia] || { nombre: '', icono: '📅', rutina: '', tipo: 'descanso' };
                const entrenadoHoy = STATE.diasEntrenados.includes(UI.getHoy());

                const peso = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                const obj = STATE.pesoObjetivo || CONFIG.PESO_OBJETIVO;

                const hoySemana = new Date();
                const inicioSemana = new Date(hoySemana);
                inicioSemana.setDate(hoySemana.getDate() - hoySemana.getDay() + 1);
                inicioSemana.setHours(0, 0, 0, 0);
                const diasSemana = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(inicioSemana);
                    d.setDate(inicioSemana.getDate() + i);
                    diasSemana.push(UI.formatFecha(d));
                }
                const entrenosSemana = STATE.diasEntrenados.filter(f => diasSemana.includes(f)).length;

                let racha = 0;
                let h = new Date();
                for (let i = 0; i < 100; i++) {
                    let f = new Date(h);
                    f.setDate(h.getDate() - i);
                    if (STATE.diasEntrenados.includes(UI.formatFecha(f))) racha++;
                    else break;
                }

                const diasMap = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes', 6: 'sabado' };
                let proxDia = null;
                let proxNombre = '';
                let proxIcono = '';
                let diasParaProx = 0;
                for (let i = 1; i <= 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const diaKey = diasMap[d.getDay()];
                    const info = CONFIG.SEMANA[diaKey];
                    if (info && info.tipo === 'entreno') {
                        const fechaStr = UI.formatFecha(d);
                        if (!STATE.diasEntrenados.includes(fechaStr)) {
                            proxDia = diaKey;
                            proxNombre = info.nombre;
                            proxIcono = info.icono;
                            diasParaProx = i;
                            break;
                        }
                    }
                }

                c.innerHTML = `
                    <div class="saludo">${saludo}, <span>${STATE.nombre}</span></div>
                    <div class="saludo-dia">${UI.getDiaSemanaNombre(hoy)} · ${hoy.toLocaleDateString('es-ES', {day:'numeric', month:'long'})}</div>

                    <div class="card card-accent">
                        <div class="card-title">📊 Resumen</div>
                        <div class="dash-grid">
                            <div class="dash-stat">
                                <div class="num primary">${peso}</div>
                                <div class="label">Peso (kg)</div>
                            </div>
                            <div class="dash-stat">
                                <div class="num green">${obj}</div>
                                <div class="label">Objetivo</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">💪 Próximo entrenamiento</div>
                        ${proxDia && diasParaProx <= 3 ? `
                            <div style="display:flex;align-items:center;gap:var(--space-sm);">
                                <span style="font-size:28px;">${proxIcono}</span>
                                <div>
                                    <div style="font-size:16px;font-weight:600;">${proxNombre}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">${CONFIG.SEMANA[proxDia].rutina} · ${diasParaProx === 1 ? 'Mañana' : `En ${diasParaProx} días`}</div>
                                </div>
                                <button class="btn btn-primary btn-sm" onclick="APP.navegar('rutinas')" style="margin-left:auto;">Ver</button>
                            </div>
                        ` : `
                            <div style="text-align:center;padding:8px 0;color:var(--text-secondary);">
                                ${dia === 'domingo' ? '😌 Domingo de descanso' : '✅ Todos los entrenos completados'}
                            </div>
                        `}
                    </div>

                    <div class="card">
                        <div class="dash-grid">
                            <div class="dash-stat">
                                <div class="num green">${entrenosSemana}</div>
                                <div class="label">Esta semana</div>
                            </div>
                            <div class="dash-stat">
                                <div class="num primary">${racha}</div>
                                <div class="label">Racha 🔥</div>
                            </div>
                        </div>
                    </div>

                    ${dia !== 'domingo' && CONFIG.SEMANA[dia]?.tipo === 'entreno' && !entrenadoHoy ? `
                        <button class="btn btn-primary btn-block" onclick="APP.navegar('rutinas')" style="padding:14px;font-size:15px;">
                            <i class="fa-solid fa-play"></i> Empezar entrenamiento
                        </button>
                    ` : ''}
                `;
            }
        };

        // ==========================================
        // RUTINAS
        // ==========================================
        const Rutinas = {
            diaSeleccionado: null,

            render() {
                const c = document.getElementById('rutinasContainer');
                if (!c) return;

                const hoy = new Date();
                const diaActual = UI.getDiaNombre();

                if (!this.diaSeleccionado) {
                    this.diaSeleccionado = diaActual;
                }

                let html = `<div class="card"><div class="card-title">📅 Semana</div><div class="tab-dias">`;

                const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
                const nombresCortos = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

                dias.forEach((dia, idx) => {
                    const info = CONFIG.SEMANA[dia];
                    const esHoy = dia === diaActual;
                    const esSeleccionado = dia === this.diaSeleccionado;
                    const esEntreno = info.tipo === 'entreno';
                    const completado = esEntreno && STATE.diasEntrenados.some(f => {
                        const d = new Date(f);
                        return d.getDay() === idx && d.toDateString() === new Date().toDateString();
                    });

                    let clase = 'tab-dia';
                    if (esSeleccionado) clase += ' active';
                    if (completado) clase += ' completado';
                    if (!esEntreno) clase += ' descanso';

                    const label = esEntreno ? nombresCortos[idx] : '·';

                    html += `
                        <button class="${clase}" onclick="Rutinas.seleccionarDia('${dia}')">
                            ${info.icono} ${label}
                        </button>
                    `;
                });

                html += `</div></div>`;

                const diaInfo = CONFIG.SEMANA[this.diaSeleccionado];
                if (diaInfo && diaInfo.tipo === 'entreno') {
                    const ejercicios = CONFIG.EJERCICIOS_POR_DIA[this.diaSeleccionado] || [];
                    const completadoHoy = STATE.diasEntrenados.includes(UI.getHoy());

                    html += `
                        <div class="card">
                            <div class="entreno-header" style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md);">
                                <span style="font-size:32px;">${diaInfo.icono}</span>
                                <div style="flex:1;">
                                    <div style="font-size:20px;font-weight:700;">${diaInfo.nombre}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">⏱ ${diaInfo.rutina} · ${ejercicios.length} ejercicios</div>
                                </div>
                            </div>
                            ${completadoHoy && this.diaSeleccionado === diaActual ? `
                                <div style="text-align:center;padding:16px;color:var(--success);">
                                    <span style="font-size:32px;display:block;margin-bottom:8px;">✅</span>
                                    <strong>Entrenamiento completado</strong>
                                    <div style="font-size:12px;color:var(--text-secondary);">¡Buen trabajo! 💪</div>
                                </div>
                            ` : `
                                ${ejercicios.map((ej, idx) => {
                                    const registros = STATE.registroEjercicios[ej.nombre] || [];
                                    const ultimo = registros.length > 0 ? registros[registros.length - 1] : null;
                                    const tecPasos = ej.tecnica ? ej.tecnica.split('\n').filter(p => p.trim()) : [];

                                    return `
                                        <div class="ejercicio-card">
                                            <div class="ej-top">
                                                <div class="ej-img-wrap" onclick="UI.abrirLightbox('${ej.img || ''}')">
                                                    ${ej.img ? `
                                                        <img src="${ej.img}" class="ej-img" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'ej-img-fallback\\'>💪</div>'" alt="${ej.nombre}">
                                                    ` : `
                                                        <div class="ej-img-fallback">💪</div>
                                                    `}
                                                </div>
                                                <div class="ej-info">
                                                    <div class="ej-nombre">${idx+1}. ${ej.nombre}</div>
                                                    <div class="ej-datos">
                                                        <span>${ej.series} × ${ej.reps}</span>
                                                        <span>⏱ ${ej.descanso}</span>
                                                    </div>
                                                    ${ultimo ? `
                                                        <div class="ej-ultimo">
                                                            Último: <strong>${ultimo.peso} kg</strong> · ${ultimo.reps} (${UI.formatFecha(ultimo.fecha)})
                                                        </div>
                                                    ` : ''}
                                                    <div class="ej-botones">
                                                        <button class="btn btn-ghost btn-sm" onclick="Rutinas.toggleTecnica(this)"><i class="fa-solid fa-circle-info"></i> Técnica</button>
                                                        <button class="btn btn-primary btn-sm" onclick="Rutinas.registrarEjercicio('${ej.nombre}', '${this.diaSeleccionado}')">
                                                            <i class="fa-solid fa-pen"></i> Registrar
                                                        </button>
                                                    </div>
                                                    <div class="ej-tecnica">
                                                        ${tecPasos.length > 0 ? tecPasos.map(p => `
                                                            <div class="tec-paso">
                                                                <span class="tec-numero">${p.match(/^\d+[.、) ]?/)?.[0] || '•'}</span>
                                                                <span class="tec-texto">${p.replace(/^\d+[.、) ]?\s*/, '')}</span>
                                                            </div>
                                                        `).join('') : `
                                                            <div class="tec-paso"><span class="tec-texto">Posición correcta. Movimiento controlado. Respira adecuadamente.</span></div>
                                                        `}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                                ${this.diaSeleccionado === diaActual && !completadoHoy ? `
                                    <button class="btn btn-success btn-completar" onclick="Rutinas.completarEntreno()">
                                        <i class="fa-solid fa-check-circle"></i> ✔ Entrenamiento completado
                                    </button>
                                ` : ''}
                            `}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="card" style="text-align:center;padding:24px;color:var(--text-secondary);">
                            <span style="font-size:48px;display:block;margin-bottom:12px;">${diaInfo?.icono || '😌'}</span>
                            <div style="font-size:18px;font-weight:600;color:var(--text);">${diaInfo?.nombre || 'Descanso'}</div>
                            <div style="font-size:13px;margin-top:4px;">${diaInfo?.rutina || 'Toca descansar'}</div>
                        </div>
                    `;
                }

                c.innerHTML = html;
            },

            seleccionarDia(dia) {
                this.diaSeleccionado = dia;
                this.render();
            },

            toggleTecnica(btn) {
                const tecnica = btn.closest('.ej-info').querySelector('.ej-tecnica');
                if (tecnica) {
                    tecnica.classList.toggle('open');
                    btn.innerHTML = tecnica.classList.contains('open') ?
                        '<i class="fa-solid fa-circle-chevron-up"></i> Ocultar' :
                        '<i class="fa-solid fa-circle-info"></i> Técnica';
                }
            },

            registrarEjercicio(nombre, dia) {
                const registros = STATE.registroEjercicios[nombre] || [];
                const ultimo = registros.length > 0 ? registros[registros.length - 1] : null;

                Modal.abrir(`
                    <h3>${nombre}</h3>
                    <div style="margin:12px 0;">
                        <label style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">Peso (kg)</label>
                        <input type="number" id="modalPeso" step="0.5" class="input" value="${ultimo?.peso || ''}" placeholder="0">
                    </div>
                    <div style="margin:12px 0;">
                        <label style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">Repeticiones</label>
                        <input type="text" id="modalReps" class="input" placeholder="10,10,9,8" value="${ultimo?.reps || ''}">
                    </div>
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button class="btn btn-success btn-block" onclick="Rutinas.guardarRegistro('${nombre}')" style="flex:1;">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                        <button class="btn btn-ghost" onclick="Modal.cerrar()" style="flex:0.5;">Cancelar</button>
                    </div>
                `);
            },

            guardarRegistro(nombre) {
                const peso = parseFloat(document.getElementById('modalPeso').value);
                const reps = document.getElementById('modalReps').value.trim() || '-';
                if (!peso || peso === 0) { UI.toast('Introduce un peso', 'error'); return; }

                if (!STATE.registroEjercicios[nombre]) STATE.registroEjercicios[nombre] = [];
                STATE.registroEjercicios[nombre].push({
                    fecha: UI.getHoy(),
                    peso: peso,
                    reps: reps,
                    completado: true
                });

                Storage._save();
                Modal.cerrar();
                UI.toast(`✅ ${nombre} registrado: ${peso} kg × ${reps}`, 'success');
                this.render();
                Historial.render();
                Estadisticas.render();
            },

            completarEntreno() {
                const hoy = UI.getHoy();
                if (!STATE.diasEntrenados.includes(hoy)) {
                    STATE.diasEntrenados.push(hoy);
                    STATE.evolution.totalWorkouts = STATE.diasEntrenados.length;
                    Storage._save();
                    UI.toast('🎉 ¡Entrenamiento completado!', 'success');
                    confetti({ particleCount: 120, spread: 70 });
                    this.render();
                    Dashboard.render();
                    Historial.render();
                    Estadisticas.render();
                }
            }
        };

        // ==========================================
        // HISTORIAL
        // ==========================================
        const Historial = {
            render() {
                const c = document.getElementById('historialContainer');
                if (!c) return;

                let html = `<div class="card"><div class="card-title">📊 Historial por ejercicio</div>`;

                const ejercicios = Object.keys(STATE.registroEjercicios);
                if (ejercicios.length === 0) {
                    html += `<div style="text-align:center;padding:20px;color:var(--text-secondary);">Aún no hay registros</div>`;
                } else {
                    ejercicios.forEach(nombre => {
                        const registros = STATE.registroEjercicios[nombre] || [];
                        if (registros.length === 0) return;
                        const ultimos = registros.slice(-5);
                        let progreso = '';
                        if (registros.length >= 2) {
                            const primero = registros[0];
                            const ultimo = registros[registros.length - 1];
                            if (ultimo.peso > primero.peso) {
                                progreso = `📈 +${(ultimo.peso - primero.peso).toFixed(1)} kg`;
                            } else if (ultimo.peso < primero.peso) {
                                progreso = `📉 ${(ultimo.peso - primero.peso).toFixed(1)} kg`;
                            }
                        }

                        html += `
                            <div class="historial-ejercicio">
                                <div class="he-nombre">${nombre}</div>
                                ${ultimos.map(r => `
                                    <div class="he-sesion">
                                        <span class="he-fecha">${UI.formatFecha(r.fecha)}</span>
                                        <span><span class="he-peso">${r.peso}</span> kg · <span class="he-reps">${r.reps}</span></span>
                                    </div>
                                `).join('')}
                                ${progreso ? `<div class="he-progreso">${progreso}</div>` : ''}
                            </div>
                        `;
                    });
                }
                html += `</div>`;

                html += `<div class="card"><div class="card-title">📅 Historial de entrenamientos</div>`;
                const entrenos = [...STATE.diasEntrenados].sort().reverse();
                if (entrenos.length === 0) {
                    html += `<div style="text-align:center;padding:12px;color:var(--text-secondary);">Sin entrenos</div>`;
                } else {
                    entrenos.slice(0, 10).forEach(f => {
                        const fecha = new Date(f);
                        const diaKey = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][fecha.getDay()];
                        const info = CONFIG.SEMANA[diaKey];
                        html += `
                            <div class="historial-entreno">
                                <span class="he-fecha">${UI.formatFecha(f)}</span>
                                <span class="he-duracion">${info?.rutina || 'Entreno'}</span>
                                <span class="he-estado">✅</span>
                            </div>
                        `;
                    });
                }
                html += `</div>`;

                c.innerHTML = html;
            }
        };

        // ==========================================
        // ESTADÍSTICAS
        // ==========================================
        const Estadisticas = {
            render() {
                const c = document.getElementById('estadisticasContainer');
                if (!c) return;

                const total = STATE.diasEntrenados.length || 0;
                const hoy = new Date();
                const mes = hoy.getMonth();
                const anio = hoy.getFullYear();
                const entrenosMes = STATE.diasEntrenados.filter(f => {
                    const d = new Date(f);
                    return d.getMonth() === mes && d.getFullYear() === anio;
                }).length;

                const entrenosAnio = STATE.diasEntrenados.filter(f => {
                    const d = new Date(f);
                    return d.getFullYear() === anio;
                }).length;

                const peso = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                const pesoInicio = STATE.mediciones.length > 0 ? STATE.mediciones[0].peso : '--';

                let tiempoEstimado = total * 45;
                const horas = Math.floor(tiempoEstimado / 60);
                const minutos = tiempoEstimado % 60;

                c.innerHTML = `
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-chart-simple"></i> Estadísticas</div>
                        <div class="stats-grid-2">
                            <div class="stats-item-2">
                                <div class="num primary">${entrenosMes}</div>
                                <div class="label">Este mes</div>
                            </div>
                            <div class="stats-item-2">
                                <div class="num green">${entrenosAnio}</div>
                                <div class="label">Este año</div>
                            </div>
                            <div class="stats-item-2">
                                <div class="num orange">${horas}h ${minutos}m</div>
                                <div class="label">Tiempo estimado</div>
                            </div>
                            <div class="stats-item-2">
                                <div class="num primary">${peso}</div>
                                <div class="label">Peso actual</div>
                            </div>
                        </div>
                        ${pesoInicio !== '--' && peso !== '--' ? `
                            <div style="margin-top:10px;padding:8px 12px;background:rgba(0,0,0,0.1);border-radius:var(--radius-sm);text-align:center;font-size:13px;">
                                📉 Cambio de peso: <strong>${(pesoInicio - peso).toFixed(1)} kg</strong>
                            </div>
                        ` : ''}
                        <div style="margin-top:8px;padding:8px 12px;background:rgba(0,0,0,0.08);border-radius:var(--radius-sm);text-align:center;font-size:12px;color:var(--text-secondary);">
                            💪 ${total} entrenos completados
                        </div>
                    </div>
                `;
            }
        };

        // ==========================================
        // NOTIFICACIONES
        // ==========================================
        const Notificaciones = {
            generar() {
                const notifs = [];
                const dia = UI.getDiaNombre();
                const info = CONFIG.SEMANA[dia];
                if (info && info.tipo === 'entreno' && !STATE.diasEntrenados.includes(UI.getHoy())) {
                    notifs.push({ icono: '💪', texto: `Entrena ${info.nombre}: ${info.rutina}` });
                }
                if (STATE.mediciones.length > 0) {
                    const ultima = STATE.mediciones[STATE.mediciones.length - 1];
                    const dias = Math.round((new Date() - new Date(ultima.fecha)) / 86400000);
                    if (dias > 14) {
                        notifs.push({ icono: '📏', texto: 'Hace más de 2 semanas de tu última medición' });
                    }
                }
                return notifs;
            },
            render() {
                const lista = document.getElementById('notifList');
                const notifs = this.generar();
                if (notifs.length === 0) {
                    lista.innerHTML = '<div class="notif-empty">Sin notificaciones</div>';
                } else {
                    lista.innerHTML = notifs.map(n =>
                        `<div class="notif-item"><span class="ni-icon">${n.icono}</span><span class="ni-text">${n.texto}</span></div>`
                    ).join('');
                }
                const badge = document.getElementById('bellBadge');
                if (notifs.length > 0) { badge.classList.remove('hidden');
                    badge.textContent = notifs.length; } else { badge.classList.add('hidden'); }
            }
        };

        // ==========================================
        // AJUSTES
        // ==========================================
        const Ajustes = {
            render() {
                const c = document.getElementById('ajustesContainer');
                if (!c) return;

                c.innerHTML = `
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-user"></i> Perfil</div>
                        <div class="ajustes-item"><span class="aj-label">Nombre</span><input class="input input-sm" id="ajusteNombre" value="${STATE.nombre}" style="width:120px;"></div>
                        <div class="ajustes-item"><span class="aj-label">Altura (cm)</span><input class="input input-sm" type="number" id="ajusteAltura" value="${STATE.altura}" style="width:80px;"></div>
                        <div class="ajustes-item"><span class="aj-label">Peso objetivo (kg)</span><input class="input input-sm" type="number" id="ajusteObjetivo" value="${STATE.pesoObjetivo || CONFIG.PESO_OBJETIVO}" style="width:80px;"></div>
                        <button class="btn btn-primary btn-block" onclick="Ajustes.guardar()" style="margin-top:12px;"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-database"></i> Datos</div>
                        <button class="btn btn-ghost btn-block" onclick="Storage.exportar()"><i class="fa-solid fa-download"></i> Exportar</button>
                        <button class="btn btn-ghost btn-block" onclick="document.getElementById('importFile').click()" style="margin-top:6px;"><i class="fa-solid fa-upload"></i> Importar</button>
                        <input type="file" id="importFile" accept=".json" class="hidden">
                        <button class="btn btn-danger btn-block" onclick="APP.confirmarReset()" style="margin-top:6px;"><i class="fa-solid fa-trash"></i> Borrar todos los datos</button>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-circle-info"></i> Acerca de</div>
                        <div class="ajustes-item"><span class="aj-label">Versión</span><span style="color:var(--text-secondary);" id="versionDisplay">${CONFIG.VERSION}</span></div>
                        <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;">NicoGym · Tu compañero de entrenamiento</div>
                    </div>
                `;
            },

            guardar() {
                const nombre = document.getElementById('ajusteNombre').value || 'Nico';
                const altura = parseInt(document.getElementById('ajusteAltura').value) || CONFIG.ALTURA;
                const objetivo = parseInt(document.getElementById('ajusteObjetivo').value) || CONFIG.PESO_OBJETIVO;
                STATE.nombre = nombre;
                STATE.altura = altura;
                STATE.pesoObjetivo = objetivo;
                STATE.ajustes = { nombre, altura, pesoObjetivo: objetivo };
                Storage._save();
                UI.toast('✅ Ajustes guardados', 'success');
                APP.renderizarTodo();
            }
        };

        // ==========================================
        // INICIO
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
