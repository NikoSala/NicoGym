                c.innerHTML = `
                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-user"></i> Perfil</div>
                            <div class="ajustes-item"><span class="aj-label">Nombre</span><input class="input input-sm" id="ajusteNombre" value="${STATE.nombre}" style="width:120px;"></div>
                            <div class="ajustes-item"><span class="aj-label">Altura (cm)</span><input class="input input-sm" type="number" id="ajusteAltura" value="${STATE.altura}" style="width:80px;"></div>
                            <div class="ajustes-item"><span class="aj-label">Peso objetivo (kg)</span><input class="input input-sm" type="number" id="ajusteObjetivo" value="${CONFIG.PESO_OBJETIVO}" style="width:80px;"></div>
                            <button class="btn btn-primary btn-block" onclick="Ajustes._guardar()" style="margin-top:12px;"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        </div>

                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-bell"></i> Recordatorios</div>
                            <div class="ajustes-item"><span class="aj-label">📏 Mediciones (semanas)</span><input class="input input-sm" type="number" id="ajusteFreqMediciones" value="${STATE.recordatorios.freqMediciones || 2}" min="1" max="8" style="width:60px;"></div>
                            <div class="ajustes-item"><span class="aj-label">📸 Fotos (semanas)</span><input class="input input-sm" type="number" id="ajusteFreqFotos" value="${STATE.recordatorios.freqFotos || 4}" min="1" max="12" style="width:60px;"></div>
                            <button class="btn btn-primary btn-block" onclick="Ajustes._guardarRecordatorios()" style="margin-top:12px;"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        </div>

                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-database"></i> Datos</div>
                            <button class="btn btn-ghost btn-block" onclick="Storage.exportar()"><i class="fa-solid fa-download"></i> Exportar</button>
                            <button class="btn btn-ghost btn-block" onclick="document.getElementById('importFile').click()" style="margin-top:6px;"><i class="fa-solid fa-upload"></i> Importar</button>
                            <input type="file" id="importFile" accept=".json" class="hidden">
                            <button class="btn btn-danger btn-block" onclick="APP.confirmarReset()" style="margin-top:6px;"><i class="fa-solid fa-trash"></i> Borrar todos los datos</button>
                        </div>

                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-circle-info"></i> Acerca de</div>
                            <div class="ajustes-item"><span class="aj-label">Versión</span><span style="color:var(--text-secondary);" id="versionDisplay">${CONFIG.VERSION}</span></div>
                            <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;">NicoGym · Tu compañero de entrenamiento</div>
                        </div>
                    `;
            },

            _guardar() {
                const nombre = document.getElementById('ajusteNombre').value || 'Nico';
                const altura = parseInt(document.getElementById('ajusteAltura').value) || CONFIG.ALTURA;
                const objetivo = parseInt(document.getElementById('ajusteObjetivo').value) || CONFIG.PESO_OBJETIVO;
                STATE.nombre = nombre;
                STATE.altura = altura;
                CONFIG.PESO_OBJETIVO = objetivo;
                STATE.ajustes = { nombre, altura, objetivo };
                Storage._save();
                UI.toast('✅ Ajustes guardados', 'success');
                APP.renderizarTodo();
            },

            _guardarRecordatorios() {
                const fm = parseInt(document.getElementById('ajusteFreqMediciones').value) || 2;
                const ff = parseInt(document.getElementById('ajusteFreqFotos').value) || 4;
                STATE.recordatorios.freqMediciones = fm;
                STATE.recordatorios.freqFotos = ff;
                Storage._save();
                UI.toast('✅ Recordatorios guardados', 'success');
                APP.renderizarTodo();
            }
        };

        // ==========================================
        // CALCULADORA DE DISCOS
        // ==========================================
        const Calculadora = {
            discosDisponibles: [
                { peso: 1.25, cantidad: 4 },
                { peso: 1.5, cantidad: 4 },
                { peso: 2, cantidad: 4 }
            ],
            estado: {
                tipo: 'mancuerna',
                discosSeleccionados: {},
                ejercicioNombre: '',
                ejercicioId: '',
                dia: '',
                idx: ''
            },
            pesosBarra: {
                mancuerna: .5,
                barra: 1
            },

            abrir(ejercicioNombre, dia, idx) {
                this.estado.ejercicioNombre = ejercicioNombre;
                this.estado.dia = dia;
                this.estado.idx = idx;
                this.estado.ejercicioId = `${dia}-${idx}`;

                this.estado.discosSeleccionados = {};
                this.discosDisponibles.forEach(d => {
                    this.estado.discosSeleccionados[d.peso] = 0;
                });

                this.setTipo('mancuerna');

                document.getElementById('calcEjercicioNombre').textContent = ejercicioNombre;

                const ultimo = Rutinas._getUltimoEntreno(ejercicioNombre);
                document.getElementById('calcReps').value = ultimo?.reps || '';

                document.getElementById('modalCalculadora').classList.remove('hidden');

                this._renderDiscos();
                this._actualizarPesoTotal();
            },

            cerrar() {
                document.getElementById('modalCalculadora').classList.add('hidden');
            },

            setTipo(tipo) {
                this.estado.tipo = tipo;
                document.getElementById('calcTipoMancuerna').className = `btn btn-sm ${tipo === 'mancuerna' ? 'btn-primary' : 'btn-ghost'}`;
                document.getElementById('calcTipoBarra').className = `btn btn-sm ${tipo === 'barra' ? 'btn-primary' : 'btn-ghost'}`;
                const pesoBarra = this.pesosBarra[tipo] || 0;
                document.getElementById('calcPesoBarra').textContent = pesoBarra.toFixed(1);
                this._actualizarPesoTotal();
            },

            toggleDisco(peso) {
                const maxDiscos = this.discosDisponibles.find(d => d.peso === peso)?.cantidad || 0;
                const actual = this.estado.discosSeleccionados[peso] || 0;
                if (actual < maxDiscos) {
                    this.estado.discosSeleccionados[peso] = actual + 1;
                } else {
                    this.estado.discosSeleccionados[peso] = 0;
                }
                this._renderDiscos();
                this._actualizarPesoTotal();
            },

            _renderDiscos() {
                const container = document.getElementById('calcDiscosContainer');
                container.innerHTML = '';
                this.discosDisponibles.forEach(d => {
                    const seleccionados = this.estado.discosSeleccionados[d.peso] || 0;
                    const total = d.cantidad;
                    const btn = document.createElement('button');
                    btn.className = `btn btn-sm ${seleccionados > 0 ? 'btn-primary' : 'btn-ghost'}`;
                    btn.textContent = `${d.peso} kg (${seleccionados}/${total})`;
                    btn.onclick = () => this.toggleDisco(d.peso);
                    container.appendChild(btn);
                });
            },

            _actualizarPesoTotal() {
                let pesoDiscos = 0;
                for (const [peso, cantidad] of Object.entries(this.estado.discosSeleccionados)) {
                    pesoDiscos += parseFloat(peso) * cantidad;
                }

                // El peso total es SOLO los discos (la barra no se suma)
                const pesoTotal = pesoDiscos;

                document.getElementById('calcPesoDiscos').textContent = pesoDiscos.toFixed(1);
                document.getElementById('calcPesoTotal').textContent = pesoTotal.toFixed(1);
            },

            guardar() {
                const pesoTotal = parseFloat(document.getElementById('calcPesoTotal').textContent);
                const reps = document.getElementById('calcReps').value.trim() || '-';

                if (pesoTotal === 0) {
                    UI.toast('Selecciona algún disco', 'error');
                    return;
                }

                const dia = this.estado.dia;
                const idx = this.estado.idx;
                const nombre = this.estado.ejercicioNombre;
                const id = `${dia}-${idx}`;

                // Guardar inputs ocultos (para compatibilidad con finalizar)
                const pesoInput = document.getElementById(`peso-${id}`);
                const repsInput = document.getElementById(`reps-${id}`);
                if (pesoInput) pesoInput.value = pesoTotal;
                if (repsInput) repsInput.value = reps;

                // Marcar check
                if (!STATE.checks[id]) {
                    STATE.checks[id] = true;
                    Storage._save();
                    Rutinas._actualizarProgreso();
                    const c = document.getElementById(`lista-${dia}`);
                    if (c) {
                        const cards = c.querySelectorAll('.ex-card');
                        if (cards[idx]) cards[idx].classList.add('checked');
                        const checkbox = cards[idx]?.querySelector('.check-box');
                        if (checkbox) checkbox.checked = true;
                    }
                }

                // Guardar historial
                const hoy = UI.getHoy();
                let entrenamientoExistente = STATE.historialEntrenos.find(e => e.fecha === hoy && e.dia === dia);

                if (entrenamientoExistente) {
                    const ejExistente = entrenamientoExistente.ejercicios.find(e => e.nombre === nombre);
                    if (ejExistente) {
                        ejExistente.peso = pesoTotal;
                        ejExistente.reps = reps;
                    } else {
                        entrenamientoExistente.ejercicios.push({ nombre, peso: pesoTotal, reps });
                    }
                } else {
                    STATE.historialEntrenos.push({
                        fecha: hoy,
                        dia: dia,
                        tipo: CONFIG.TIPOS_RUTINA[dia] || dia.toUpperCase(),
                        ejercicios: [{ nombre, peso: pesoTotal, reps }]
                    });
                }

                Storage._save();

                // Récord
                const repsNum = reps.split(',').map(Number).reduce((a, b) => a + b, 0);
                if (pesoTotal > 0 && repsNum > 0) {
                    const date = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit',
                        year: 'numeric' });
                    if (Records.actualizar(nombre, pesoTotal, repsNum, date)) {
                        UI.toast('🏆 Nuevo récord!', 'success');
                    }
                }

                UI.toast(`✅ ${nombre} guardado: ${pesoTotal} kg × ${reps}`, 'success');
                this.cerrar();

                // Comprobar día completado
                const ejerciciosDia = CONFIG.EJERCICIOS[dia] || [];
                const todosCompletados = ejerciciosDia.every((_, i) => STATE.checks[`${dia}-${i}`]);
                if (todosCompletados && ejerciciosDia.length > 0) {
                    const hoyStr = UI.getHoy();
                    if (!STATE.diasEntrenados.includes(hoyStr)) {
                        STATE.diasEntrenados.push(hoyStr);
                        Storage._save();
                        UI.toast(`🎉 ¡${dia.toUpperCase()} COMPLETADO!`, 'success');
                        confetti({ particleCount: 120, spread: 70 });
                        APP.renderizarTodo();
                    }
                }

                APP.renderizarTodo();
            }
        };

        // ==========================================
        // INICIO
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
