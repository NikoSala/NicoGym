<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>NicoGym</title>
    <meta name="theme-color" content="#07110f" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
    <link rel="apple-touch-icon" href="img/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
    <link
      rel="preload"
      as="style"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g"
      crossorigin="anonymous"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous" /></noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" integrity="sha384-hbhUBXITXDJbdxAutkRZOGlStNARd6f3N2y0fDfrBwMhXEaeaCrpNu7g24F/vYDq" crossorigin="anonymous"></script>
    <link rel="preload" as="image" href="img/logo-nicogym-600.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="css/styles.css?v=20261001a" />
  </head>
  <body>
    <!-- LOADING SCREEN -->
    <div class="loading-screen" id="loadingScreen">
      <img src="img/logo-nicogym-600.jpg" alt="NicoGym" class="loading-logo" width="600" height="600" fetchpriority="high" decoding="async" />
      <div class="loader"></div>
      <div class="loader-text">Cargando NicoGym...</div>
    </div>

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-left">
        <button
          type="button"
          class="logo"
          onclick="APP.navegar('inicio')"
          aria-label="Volver al inicio"
        >
          <img src="img/logo-nicogym-600.jpg" alt="NicoGym" class="header-logo" width="600" height="600" decoding="async" />
        </button>
      </div>
      <div class="top-right">
        <div class="top-stats hidden">
          <span id="topPesoDisplay">-- kg</span>
          <span>·</span>
          <span>🎯 <strong id="topObjetivo">75</strong></span>
        </div>
        <button
          class="btn btn-ghost btn-sm top-settings-btn"
          aria-label="Abrir ajustes"
          title="Ajustes"
          onclick="APP.navegar('ajustes')"
        >
          <i class="fa-solid fa-gear"></i>
        </button>
        <button
          id="menuToggle"
          class="btn btn-ghost btn-sm"
          aria-label="Abrir menú"
          aria-controls="sideMenu"
          aria-expanded="false"
          onclick="UI.toggleMenu()"
          style="padding: 2px 6px; font-size: 12px; border: none; height: 30px; min-height: 30px;"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>

    <!-- SIDE MENU -->
    <div class="side-overlay" id="sideOverlay" aria-hidden="true" onclick="UI.toggleMenu()"></div>
    <nav class="side-menu" id="sideMenu" aria-label="Menú principal" inert>
      <div class="menu-section-label">PRINCIPAL</div>
      <button class="menu-item active" data-page="inicio" aria-current="page" onclick="APP.navegar('inicio')"><i class="fa-solid fa-house"></i> Inicio</button>
      <button class="menu-item" data-page="rutinas" onclick="APP.navegar('rutinas')"><i class="fa-solid fa-dumbbell"></i> Entrenar</button>
      <button class="menu-item" data-page="semana" onclick="APP.navegar('semana')"><i class="fa-solid fa-calendar-week"></i> Plan semanal</button>
      <button class="menu-item" data-page="biblioteca" onclick="APP.navegar('biblioteca')"><i class="fa-solid fa-book-open"></i> Ejercicios</button>
      <details class="menu-group" data-menu-group="progreso">
        <summary><i class="fa-solid fa-chart-line"></i><span>Progreso</span><i class="fa-solid fa-chevron-down menu-group-chevron"></i></summary>
        <div class="menu-submenu">
          <button class="menu-item" data-page="estadisticas" onclick="APP.navegar('estadisticas')"><i class="fa-solid fa-chart-bar"></i> Resumen</button>
          <button class="menu-item" data-page="historial" onclick="APP.navegar('historial')"><i class="fa-solid fa-clock-rotate-left"></i> Entrenamientos</button>
          <button class="menu-item" data-page="peso" onclick="APP.navegar('peso')"><i class="fa-solid fa-scale-balanced"></i> Peso y medidas</button>
          <button class="menu-item" data-page="fotos" onclick="APP.navegar('fotos')"><i class="fa-solid fa-camera"></i> Fotos</button>
          <button class="menu-item" data-page="agenda" onclick="APP.navegar('agenda')"><i class="fa-solid fa-calendar-check"></i> Agenda</button>
          <button class="menu-item" data-page="records" onclick="APP.navegar('records')"><i class="fa-solid fa-trophy"></i> Récords</button>
          <button class="menu-item" data-page="comparador" onclick="APP.navegar('comparador')"><i class="fa-solid fa-code-compare"></i> Comparar entrenamientos</button>
          <button class="menu-item" data-page="objetivos" onclick="APP.navegar('objetivos')"><i class="fa-solid fa-bullseye"></i> Objetivos</button>
        </div>
      </details>
      <div class="menu-footer">NicoGym 3.2</div>
    </nav>

    <!-- PAGES -->
    <div class="page active" id="page-inicio">
      <div id="dashboardContainer"></div>
    </div>

    <div class="page" id="page-rutinas">
      <div id="progresoRutinaContainer"></div>
      <div class="day-tabs" id="dayTabs"></div>
      <div id="dayPanelsContainer"></div>
    </div>

    <div class="page" id="page-biblioteca">
      <div id="bibliotecaContainer"></div>
    </div>

    <div class="page" id="page-semana">
      <div id="semanaContainer"></div>
    </div>

    <div class="page" id="page-agenda">
      <div id="agendaContainer"></div>
    </div>

    <div class="page" id="page-records">
      <div id="recordsContainer"></div>
    </div>
    <div class="page" id="page-progreso">
      <div class="progress-page-shell">
        <nav class="progress-view-tabs" aria-label="Vistas de progreso">
          <button type="button" class="active" data-progress-view="estadisticas" onclick="APP.navegar('estadisticas')"><i class="fa-solid fa-chart-line"></i> Resumen</button>
          <button type="button" data-progress-view="historial" onclick="APP.navegar('historial')"><i class="fa-solid fa-clock-rotate-left"></i> Entrenamientos</button>
          <button type="button" data-progress-view="peso" onclick="APP.navegar('peso')"><i class="fa-solid fa-scale-balanced"></i> Peso</button>
          <button type="button" data-progress-view="fotos" onclick="APP.navegar('fotos')"><i class="fa-solid fa-camera"></i> Fotos</button>
        </nav>
        <section class="progress-page-view" id="progresoResumenView"><div id="estadisticasContainer"></div></section>
        <section class="progress-page-view" id="progresoHistorialView" hidden><div id="historialContainer"></div></section>
        <section class="progress-page-view" id="progresoPesoView" hidden><div id="pesoContainer"></div></section>
        <section class="progress-page-view" id="progresoFotosView" hidden><div id="fotosContainer"></div></section>
      </div>
    </div>

    <div class="page" id="page-ajustes">
      <div id="ajustesContainer"></div>
    </div>
        <!-- PÁGINA COMPARADOR -->
    <div class="page" id="page-comparador">
      <div id="comparadorContainer"></div>
    </div>

    <!-- PÁGINA OBJETIVOS -->
    <div class="page" id="page-objetivos">
      <div id="objetivosContainer"></div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-btn active" aria-current="page" onclick="APP.navegar('inicio')">
        <i class="fa-solid fa-house"></i>Inicio
      </button>
      <button class="nav-btn" onclick="APP.navegar('rutinas')">
        <i class="fa-solid fa-dumbbell"></i>Entrenar
      </button>
      <button class="nav-btn" onclick="APP.navegar('semana')">
        <i class="fa-solid fa-calendar-week"></i>Plan
      </button>
      <button class="nav-btn" onclick="APP.navegar('estadisticas')">
        <i class="fa-solid fa-chart-line"></i>Progreso
      </button>
    </nav>

    <!-- MODAL -->
    <div
      class="modal-overlay hidden"
      id="modalGlobal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalGlobalTitle"
    >
      <div class="modal-panel" id="modalGlobalPanel" tabindex="-1">
        <button
          class="modal-close"
          aria-label="Cerrar"
          onclick="Modal.cerrar()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modalGlobalTitle" class="sr-only">Ventana NicoGym</div>
        <div id="modalGlobalContent"></div>
      </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto de progreso ampliada" tabindex="-1">
      <button type="button" class="lightbox-close" aria-label="Cerrar foto" onclick="UI.cerrarLightbox()">&times;</button>
      <img id="lightboxImg" src="" alt="Foto de progreso ampliada" />
    </div>

    <!-- MODO ENTRENO -->
    <div class="modo-entreno-overlay" id="modoEntreno">
      <div class="me-header">
        <button
          type="button"
          class="me-logo-btn"
          onclick="APP._pausarEntreno()"
          aria-label="Pausar entrenamiento y volver al inicio"
          title="Pausar y guardar"
        >
          <img src="img/logo-nicogym-600.jpg" alt="NicoGym" width="600" height="600" loading="lazy" decoding="async" />
        </button>

        <span class="me-titulo" id="meTitulo">🏋️ Entrenando</span>

        <span class="me-progreso-texto" id="meProgresoTexto">0 / 0</span>
      </div>
      <div class="me-progreso-bar">
        <div class="me-progreso-track">
          <div
            class="me-progreso-fill"
            id="meProgresoFill"
            style="width: 0%"
          ></div>
        </div>
        <div class="me-progreso-info" id="meProgresoInfo">0%</div>
      </div>
      <div id="meCompletadoMsg" class="me-completado-msg hidden">
        ✔ Ejercicio completado
      </div>
      <div class="me-body" id="meBody"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/exercise-names.js"></script>
    <script src="js/exercises.js?v=20260923d"></script>
    <script src="js/exercise-library.js?v=20260923e"></script>
    <script src="js/helpers.js?v=20261001a"></script>
    <script src="js/routines.js?v=20260923a"></script>
    <script src="js/cargas.js"></script>
    <script src="js/storage.js?v=20261001b"></script>
    <script src="js/state.js?v=20260923a"></script>
    <script src="js/ui.js?v=20261001b"></script>
    <script src="js/modal.js"></script>
    <script src="js/records.js?v=20261001a"></script>
    <script src="js/progression.js"></script>
    <script src="js/app.js?v=20261001b"></script>
    <script src="js/dashboard.js?v=20261001a"></script>
    <script src="js/workouts.js?v=20260923a"></script>
    <script src="js/week.js?v=20261001a"></script>
    <script src="js/weight.js?v=20260826"></script>
    <script src="js/stats.js?v=20261001a"></script>
    <script src="js/agenda.js?v=20260923a"></script>
    <script src="js/photos.js?v=20261001a"></script>
    <script src="js/settings.js?v=20261001a"></script>
    <script src="js/comparador.js?v=20261001a"></script>
    <script src="js/objetivos.js?v=20261001a"></script>
    <script src="js/history.js?v=20261001a"></script>
    <script src="js/init.js?v=20261001a"></script>

  </body>
</html>
