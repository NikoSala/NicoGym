            return getExerciseDatabase().find(e => e.nombre === nombre);
        }

        // MODELO NORMALIZADO DE EJERCICIOS/RUTINAS
        // Un ejercicio tiene un único ID. La rutina semanal decide cuándo se usa.
        // Se conserva la base antigua para que los backups existentes sigan funcionando.
        let _rutinasNormalizadas = null;
        function normalizarExerciseId(nombre) {
            const aliases = {
                'press plano con mancuernas (viernes)': 'press-plano',
                'press militar sentado (viernes)': 'press-militar',
                'remo a una mano con mancuerna (viernes)': 'one-arm-dumbbell-row',
                'aperturas con mancuernas (viernes)': 'aperturas',
                'elevaciones laterales (viernes)': 'elevaciones-laterales',
                'curl martillo (viernes)': 'hammer-curl',
                'extensión de tríceps por encima de la cabeza (viernes)': 'extension-triceps-cabeza'
            };
            const key = String(nombre || '').trim().toLowerCase();
            if (aliases[key]) return aliases[key];
            return String(nombre || '')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/\([^)]*\)/g, '')
                .replace(/\b(viernes|jueves|miercoles|martes|lunes|sabado|domingo)\b/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }
        const RUTINAS_SEMANA = {
            lunes: ['press-plano','press-inclinado','aperturas','press-militar','elevaciones-laterales'],
            martes: ['barbell-row','one-arm-dumbbell-row','dumbbell-reverse-fly','dumbbell-shrug','alternating-dumbbell-curl','hammer-curl','reverse-dumbbell-curl'],
            miercoles: ['elevaciones-frontales','extension-triceps-cabeza','press-cerrado'],
            jueves: ['dumbbell-pullover','incline-dumbbell-curl','dumbbell-zottman-curl','dumbbell-preacher-curl','dumbbell-spider-curl','dumbbell-tate-press','dumbbell-squeeze-press','aperturas'],
            viernes: ['sentadilla-goblet','one-arm-dumbbell-row','press-militar','remo-en-banco-inclinado-con-mancuernas','elevaciones-laterales','hammer-curl','extension-triceps-cabeza'],
            sabado: [], domingo: []
        };
        function getRutinasNormalizadas() {
            if (_rutinasNormalizadas) return _rutinasNormalizadas;
            const db = getExerciseDatabase();
            const catalogo = new Map();
            const porIdYDia = new Map();
            db.forEach(e => {
                const id = normalizarExerciseId(e.nombre) || `ejercicio-${catalogo.size + 1}`;
                if (!catalogo.has(id)) catalogo.set(id, { ...e, id, dia: undefined });
                porIdYDia.set(`${id}|${e.dia || ''}`, e);
            });
            const rutinas = {};
            Object.keys(RUTINAS_SEMANA).forEach(dia => {
                rutinas[dia] = RUTINAS_SEMANA[dia].filter(id => catalogo.has(id));
            });
            _rutinasNormalizadas = { catalogo, rutinas, porIdYDia };
            return _rutinasNormalizadas;
        }
        function getEjerciciosPorDia(dia) {
            const { catalogo, rutinas, porIdYDia } = getRutinasNormalizadas();
            return (rutinas[dia] || []).map(id => {
                const base = catalogo.get(id);
                // Si existe una variante antigua específica de ese día, reutilizamos
                // solo su configuración de rutina, no creamos otro ejercicio.
                const variante = porIdYDia.get(`${id}|${dia}`) || base;
                return { ...base, ...variante, id, dia };
            });
        }

        function getDificultadColor(dificultad) {
            const map = { 'facil': '🟢', 'media': '🟡', 'dificil': '🔴' };
            return map[dificultad] || '🟡';
        }

        function getDificultadTexto(dificultad) {
            const map = { 'facil': 'Fácil', 'media': 'Media', 'dificil': 'Difícil' };
            return map[dificultad] || 'Media';
        }

        function calcularDuracionEstimada(ejercicios) {
            let minutos = 5; // calentamiento/movilización base
            ejercicios.forEach((ej, idx) => {
                const series = Math.max(0, Number(ej.series) || 0);
                const descanso = Math.max(0, Number(ej.descanso) || 60);
                // ~45 s de ejecución por serie + descansos entre series.
                minutos += series * 0.75 + Math.max(0, series - 1) * (descanso / 60);
                // Transición entre ejercicios.
                if (idx < ejercicios.length - 1) minutos += 1.5;
                if (ej.esCaminata) minutos += 15;
            });
            return Math.max(1, Math.round(minutos));
        }

        function getProximoDomingo(desde, cadaSemanas) {
            const d = new Date(desde);
            const hoy = new Date();
            while (d <= hoy) d.setDate(d.getDate() + 7 * cadaSemanas);
            while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
            return d;
        }

        function getDiasHasta(fecha) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            return Math.round((fecha - hoy) / 86400000);
        }

        // ==========================================
        // FUNCIONES CALENDARIO DEFINITIVO
        // ==========================================
        function getTipoActualizacion(fecha) {
            const d = typeof fecha === 'string' ? new Date(fecha + 'T00:00:00') : new Date(fecha);
            d.setHours(0, 0, 0, 0);

            if (d.getDay() !== 0) return null;

            const inicio = new Date(CONFIG.FECHA_INICIO_CALENDARIO + 'T00:00:00');
            inicio.setHours(0, 0, 0, 0);

            const diffTime = d.getTime() - inicio.getTime();
            if (diffTime < 0) return null;

            const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));

            const freqFotos = Math.max(1, parseInt(STATE.recordatorios?.freqFotos, 10) || 4);
            const freqMediciones = Math.max(1, parseInt(STATE.recordatorios?.freqMediciones, 10) || 2);
            const esFotos = diffWeeks % freqFotos === 0;
            const esMediciones = diffWeeks % freqMediciones === 0;

            if (esFotos) return 'completa';
            if (esMediciones) return 'mediciones';
            return 'solo-peso';
        }

        function getProximaActualizacion() {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            let d = new Date(hoy);
            while (d.getDay() !== 0) {
                d.setDate(d.getDate() + 1);
            }

            const inicio = new Date(CONFIG.FECHA_INICIO_CALENDARIO + 'T00:00:00');
            inicio.setHours(0, 0, 0, 0);

            if (d.getTime() < inicio.getTime()) {
                d = new Date(inicio);
            }

            return d;
        }

        // ==========================================
        // STORAGE
        // ==========================================
        // Fechas locales robustas: evita que Android WebView/UTC cambie el día.
        function normalizarFechaLocal(valor) {
            if (valor instanceof Date && !Number.isNaN(valor.getTime())) {
                return `${valor.getFullYear()}-${String(valor.getMonth()+1).padStart(2,'0')}-${String(valor.getDate()).padStart(2,'0')}`;
            }
            if (typeof valor === 'number' && Number.isFinite(valor)) {
                const d = new Date(valor);
                return Number.isNaN(d.getTime()) ? '' : normalizarFechaLocal(d);
            }
            const raw = String(valor ?? '').trim();
            if (!raw) return '';
            let m = raw.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
            if (m) {
                const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
                return (d.getFullYear()===Number(m[1]) && d.getMonth()===Number(m[2])-1 && d.getDate()===Number(m[3]))
                    ? `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}` : '';
            }
            m = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
            if (m) {
                const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
                return (d.getFullYear()===Number(m[3]) && d.getMonth()===Number(m[2])-1 && d.getDate()===Number(m[1]))
                    ? `${m[3]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}` : '';
            }
            const d = new Date(raw);
            return Number.isNaN(d.getTime()) ? '' : normalizarFechaLocal(d);
        }

        function fechaLocalParaDate(fecha) {
            const f = normalizarFechaLocal(fecha);
            return f ? new Date(f + 'T00:00:00') : new Date(NaN);
        }

        function parseReps(value) {
            const raw = String(value ?? '').trim();
            if (!raw || raw === '-') return { valid:false, series:[], total:0, reason:'Introduce las repeticiones de cada serie.' };
            const parts = raw.split(',').map(v => v.trim());
            if (parts.some(v => v === '')) return { valid:false, series:[], total:0, reason:'No dejes series vacías.' };
            const series = parts.map(Number);
            if (series.some(v => !Number.isInteger(v) || v < 1 || v > 999)) return { valid:false, series:[], total:0, reason:'Las repeticiones deben ser enteros entre 1 y 999.' };
            return { valid:true, series, total:series.reduce((a,b)=>a+b,0) };
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
        }

        function calcularCargaEjercicio(ej) {
            // El modelo actual guarda un único campo 'peso' y no guarda si ese
            // valor representa una mancuerna, las dos mancuernas o una barra.
            // Por seguridad no inventamos un factor 2: la carga calculada usa
            // exactamente el peso que el usuario introdujo.
            return Number(ej?.factorCarga) > 0 ? Number(ej.factorCarga) : 1;
        }

        function calcularTotalesEjercicio(ej) {
            const pr = parseReps(ej?.reps);
            const reps = pr.valid ? pr.total : (Number(ej?.repsTotales) || 0);
            const series = pr.valid ? pr.series.length : (Number(ej?.series) || 0);
            const carga = Number(ej?.peso) || 0;
            const factor = calcularCargaEjercicio(ej);
            return { reps, series, cargaAcumulada: carga * series * factor, volumen: carga * reps * factor, factor };
        }

        function obtenerPesoInicialHistorico() {
            const candidatos = [];
            const añadir = (v, prioridad=0) => {
                const n = Number(v);
                if (Number.isFinite(n) && n > 0) candidatos.push({n, prioridad});
            };

            // 1) Valor persistido explícitamente en evolution.
            añadir(STATE.evolution?.initialWeight, 100);

            // 2) Campos históricos usados por versiones anteriores.
            añadir(STATE.initialWeight, 90);
            añadir(STATE.ultimasMediciones?.pesoInicial, 80);
            añadir(STATE.ultimoRegistroPeso?.pesoInicial, 70);

            // 3) Copias de seguridad disponibles en localStorage.
            for (const clave of [CONFIG.STORAGE_KEY + '.safety', CONFIG.STORAGE_KEY + '.corrupt-backup']) {
                try {
                    const raw = localStorage.getItem(clave);
                    if (!raw) continue;
                    const b = JSON.parse(raw);
                    añadir(b?.evolution?.initialWeight, clave.endsWith('.safety') ? 110 : 115);
                    añadir(b?.initialWeight, 105);
                    añadir(b?.ultimasMediciones?.pesoInicial, 85);
                    añadir(b?.pesoInicial, 80);
                } catch (_) {}
            }

            // Si existe un valor explícito, conservarlo. Si no, la primera
            // medición cronológica es el único dato demostrable disponible.
            candidatos.sort((a,b)=>b.prioridad-a.prioridad);
            if (candidatos.length) return candidatos[0].n;
            const medidas=[...(STATE.mediciones||[])].filter(m=>Number.isFinite(Number(m?.peso))&&Number(m.peso)>0).sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
            return medidas.length ? Number(medidas[0].peso) : 0;
        }

        function calcularProgresoObjetivo(pesoInicial, pesoActual, objetivo) {
            const inicial = Number(pesoInicial);
            const actual = Number(pesoActual);
            const meta = Number(objetivo);
            if (![inicial, actual, meta].every(Number.isFinite) || inicial <= 0 || actual <= 0 || meta <= 0) return 0;
            if (Math.abs(inicial - meta) < 0.0001) return Math.abs(actual - meta) < 0.0001 ? 100 : 0;
            const progreso = inicial > meta
                ? ((inicial - actual) / (inicial - meta)) * 100
                : ((actual - inicial) / (meta - inicial)) * 100;
            return Math.round(Math.max(-100, Math.min(100, progreso)));
        }

        function actualizarEvolutionDesdeMediciones() {
            if (!STATE.evolution || typeof STATE.evolution !== 'object') {
                STATE.evolution = { initialWeight: 0, currentWeight: 0, initialWaist: 0, currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0 };
            }
            if (!Array.isArray(STATE.mediciones) || STATE.mediciones.length === 0) {
                STATE.evolution.currentWeight = 0;
                STATE.evolution.currentWaist = 0;
                STATE.evolution.totalWorkouts = Array.isArray(STATE.diasEntrenados) ? STATE.diasEntrenados.length : 0;
                return;
            }
            const ordenadas = [...STATE.mediciones].sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
            const primera = ordenadas[0];
            const ultima = ordenadas[ordenadas.length - 1];
            // El peso inicial histórico es un dato persistente: no lo sustituimos
            // por la primera medición que quede visible tras una migración.
            const pesoInicialGuardado = Number(STATE.evolution.initialWeight);
            const cinturaInicialGuardada = Number(STATE.evolution.initialWaist);
            const pesoHistorico = obtenerPesoInicialHistorico();
            if (!Number.isFinite(pesoInicialGuardado) || pesoInicialGuardado <= 0 || (pesoHistorico > 0 && Math.abs(pesoInicialGuardado - Number(primera.peso)) < 0.001 && Math.abs(pesoHistorico - pesoInicialGuardado) > 0.001)) {
                STATE.evolution.initialWeight = pesoHistorico || Number(primera.peso) || 0;
            }
            if (!Number.isFinite(cinturaInicialGuardada) || cinturaInicialGuardada <= 0) {
                STATE.evolution.initialWaist = Number(primera.cintura) || 0;
            }
            STATE.evolution.currentWeight = Number(ultima.peso) || 0;
            STATE.evolution.currentWaist = Number(ultima.cintura) || 0;
            STATE.evolution.totalWorkouts = Array.isArray(STATE.diasEntrenados) ? STATE.diasEntrenados.length : 0;
        }

        const Storage = {
            init() {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (raw) {
                    try {
                        const d = JSON.parse(raw);
                        if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('Estado inválido');
                        Object.assign(STATE, migrateState(d));
                    } catch (err) {
                        console.error('NicoGym: estado local corrupto.', err);
                        try { localStorage.setItem(CONFIG.STORAGE_KEY + '.corrupt-backup', raw); } catch (_) {}
                    }
                    if (!STATE.recordatorios) STATE.recordatorios = { freqMediciones: 2, freqFotos: 4,
                            ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES, ultimasFotos: null,
                            ultimoPeso: null };
                    if (!STATE.records) STATE.records = [];
                    if (!STATE.evolution) STATE.evolution = { initialWeight: 0, currentWeight: 0, initialWaist: 0,
                            currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0 };
                    if (!STATE.ajustes) STATE.ajustes = {};
                    if (!STATE.config) STATE.config = { temporizadorDescanso: false };
                    if (!STATE.ultimoRegistroPeso) STATE.ultimoRegistroPeso = null;
                    if (!STATE.ultimasMediciones) STATE.ultimasMediciones = null;
                    if (!STATE.ultimasFotosGuardadas) STATE.ultimasFotosGuardadas = null;
                }
                // Recuperar el peso inicial histórico si una versión anterior lo
                // sustituyó por la primera medición visible. Se consulta la copia
                // de seguridad local sin tocar ni borrar el estado actual.
                try {
                    const safetyRaw = localStorage.getItem(CONFIG.STORAGE_KEY + '.safety');
                    if (safetyRaw) {
                        const safety = JSON.parse(safetyRaw);
                        // Algunas versiones antiguas filtraban mal las fechas al migrar
                        // y podían dejar estas listas vacías. Si la copia de seguridad
                        // conserva los datos, los recuperamos sin inventar registros.
                        for (const campo of ['diasEntrenados','diasNoFumar','historialEntrenos','records']) {
                            if (Array.isArray(safety?.[campo]) && safety[campo].length &&
                                (!Array.isArray(STATE[campo]) || STATE[campo].length === 0)) {
                                STATE[campo] = safety[campo];
                            }
                        }
                        const inicialActual = Number(STATE.evolution?.initialWeight);
                        const primeraVisible = Number(STATE.mediciones?.[0]?.peso);
                        const inicialSafety = Number(safety?.evolution?.initialWeight);
                        if (Number.isFinite(inicialSafety) && inicialSafety > 0 &&
                            (!Number.isFinite(inicialActual) || inicialActual <= 0 ||
                             (Number.isFinite(primeraVisible) && Math.abs(inicialActual - primeraVisible) < 0.001 && Math.abs(inicialSafety - primeraVisible) >= 0.001))) {
                            STATE.evolution.initialWeight = inicialSafety;
                        }
                        const cinturaSafety = Number(safety?.evolution?.initialWaist);
                        const cinturaActual = Number(STATE.evolution?.initialWaist);
                        const primeraCintura = Number(STATE.mediciones?.[0]?.cintura);
                        if (Number.isFinite(cinturaSafety) && cinturaSafety > 0 &&
                            (!Number.isFinite(cinturaActual) || cinturaActual <= 0 ||
                             (Number.isFinite(primeraCintura) && Math.abs(cinturaActual - primeraCintura) < 0.001 && Math.abs(cinturaSafety - primeraCintura) >= 0.001))) {
                            STATE.evolution.initialWaist = cinturaSafety;
                        }
                    }
                } catch (err) { console.warn('NicoGym: no se pudo leer la copia de seguridad histórica', err); }
                // Si no hay configuración guardada, establecer temporizador en false
                if (STATE.config && STATE.config.temporizadorDescanso === undefined) {
                    STATE.config.temporizadorDescanso = false;
                }
                actualizarEvolutionDesdeMediciones();
                this._calcularDiasSinFumar();
                let fotosPendientes = STATE.fotosProgreso?.diasFotos;
                if (!Array.isArray(fotosPendientes) || !fotosPendientes.length) {
                    const posiblesClaves = ['nicoGym.fotosProgreso', 'nicoGymFotos', 'fotosProgreso'];
                    for (const clave of posiblesClaves) {
                        try {
                            const rawFotos = localStorage.getItem(clave);
                            if (!rawFotos) continue;
                            const parsedFotos = JSON.parse(rawFotos);
                            const lista = Array.isArray(parsedFotos) ? parsedFotos : parsedFotos?.diasFotos;
                            if (Array.isArray(lista) && lista.length) { fotosPendientes = lista; break; }
                        } catch (_) {}
                    }
                }
                if (Array.isArray(fotosPendientes) && fotosPendientes.length) {
                    setTimeout(async () => {
                        try { await Fotos.restaurarBackup(fotosPendientes); delete STATE.fotosProgreso; this._save(); }
                        catch (err) { console.warn('NicoGym: no se pudieron migrar fotos antiguas', err); }
                    }, 0);
                }
                return this;
            },
            _calcularDiasSinFumar() {
                const inicioStr = STATE.fechaInicioNoFumar || CONFIG.FECHA_INICIO_NO_FUMAR;
                const inicio = new Date(inicioStr + 'T00:00:00');
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                if (Number.isNaN(inicio.getTime()) || inicio > hoy) {
                    STATE.evolution.daysWithoutSmoking = 0;
                    return;
                }
                const diasTranscurridos = Math.floor((Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - Date.UTC(inicio.getFullYear(), inicio.getMonth(), inicio.getDate())) / 86400000) + 1;
                const recaidas = new Set((STATE.diasNoFumar || []).filter(f => /^\d{4}-\d{2}-\d{2}$/.test(String(f)) && f >= inicioStr && f <= UI.getHoy()));
                STATE.evolution.daysWithoutSmoking = Math.max(0, diasTranscurridos - recaidas.size);
            },
            _save() {
                try {
                    const anterior = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (anterior && !sessionStorage.getItem(CONFIG.STORAGE_KEY + '.safety-created')) {
                        localStorage.setItem(CONFIG.STORAGE_KEY + '.safety', anterior);
                        sessionStorage.setItem(CONFIG.STORAGE_KEY + '.safety-created', '1');
                    }
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE));
                } catch (err) {
                    console.error('NicoGym: no se pudo guardar el estado', err);
                    UI.toast('⚠️ No se pudieron guardar los datos. Comprueba el almacenamiento del navegador.', 'error');
                }
            },
            resetearSemana() {
                const hoy = new Date();
                const semanaActual = this._getSemanaKey(hoy);
                const ultimaSemana = localStorage.getItem('ultimaSemana');
                if (ultimaSemana !== semanaActual) {
                    STATE.checks = {};
                    localStorage.setItem('ultimaSemana', semanaActual);
                    this._save();
                    return true;
                }
                return false;
            },
            _getSemanaKey(fecha) {
                const d = new Date(fecha);
                d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
                const year = d.getFullYear();
                const week = Math.ceil((((d - new Date(year, 0, 1)) / 86400000) + 1) / 7);
                return `${year}-W${String(week).padStart(2, '0')}`;
            },
            resetAll() { localStorage.removeItem(CONFIG.STORAGE_KEY);
                location.reload(); },
            async exportar() {
                try {
                    // Las fotos de progreso viven en IndexedDB, no en STATE. Se
                    // incluyen en el backup junto con una copia de las claves de
                    // localStorage para no perder información persistida durante
                    // una migración. No se modifica ningún dato del navegador.
                    const fotosProgreso = await Fotos.exportarBackup();
                    const localStorageSnapshot = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key !== null) localStorageSnapshot[key] = localStorage.getItem(key);
                    }

                    const backup = {
                        app: 'NicoGym',
                        backupVersion: CONFIG.BACKUP_VERSION,
                        createdAt: new Date().toISOString(),
                        state: JSON.parse(JSON.stringify(STATE)),
                        fotosProgreso: { version: 1, diasFotos: fotosProgreso },
                        localStorage: { version: 1, entries: localStorageSnapshot }
                    };

                    const contenido = JSON.stringify(backup, null, 2);
                    const blob = new Blob([contenido], { type: 'application/json;charset=utf-8' });
                    const fecha = new Date().toISOString().slice(0, 10);
                    const nombreSugerido = `NicoGym_backup_${fecha}.json`;

                    // Android WebView: si la APK expone un puente nativo, se lo
                    // entregamos para que Android pueda abrir su selector/guardar el archivo.
                    // No dependemos de que ese puente exista: la web sigue funcionando sin él.
                    const android = window.Android;
                    if (android) {
                        try {
                            if (typeof android.exportBackup === 'function') {
                                android.exportBackup(contenido, nombreSugerido);
                                UI.toast('✅ Backup enviado a Android para guardarlo', 'success');
                                return;
                            }
                            if (typeof android.saveBackup === 'function') {
                                android.saveBackup(contenido, nombreSugerido);
                                UI.toast('✅ Backup enviado a Android para guardarlo', 'success');
                                return;
                            }
                        } catch (androidErr) {
                            console.warn('NicoGym: puente Android no disponible o falló; se usa fallback web.', androidErr);
                        }
                    }

                    // Web Share API: suele integrarse mejor con Android WebView que
                    // showSaveFilePicker y permite elegir una aplicación/ubicación.
                    try {
                        const file = new File([blob], nombreSugerido, { type: 'application/json' });
                        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ title: 'Backup de NicoGym', files: [file] });
                            UI.toast('✅ Backup compartido/guardado', 'success');
                            return;
                        }
                    } catch (shareErr) {
                        if (shareErr?.name !== 'AbortError') console.warn('NicoGym: Web Share no disponible.', shareErr);
                    }

                    // Fallback final para WebView sin puente ni Web Share: descarga normal.
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    a.href = url;
                    a.download = nombreSugerido;
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
                    UI.toast('✅ Backup generado. Revisa Descargas/Archivos del dispositivo.', 'success');
                } catch (err) {
                    if (err?.name === 'AbortError') {
                        UI.toast('ℹ️ Exportación cancelada', 'info');
                        return;
                    }
                    console.error('Error al exportar el backup:', err);
                    UI.toast('❌ No se pudo guardar el backup: ' + (err?.message || 'error desconocido'), 'error');
                }
            },
            // IMPORTAR - función conectada correctamente
            importar(file) {
                if (!file) {
                    UI.toast('❌ No se seleccionó ningún archivo', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const datos = JSON.parse(e.target.result);
                        if (!datos || typeof datos !== 'object' || Array.isArray(datos)) {
                            throw new Error('Formato de backup no válido');
                        }
                        // Los backups antiguos no tienen fotosProgreso. En ese
                        // caso se conserva IndexedDB tal como estaba.
                        const fotosProgreso = Array.isArray(datos.fotosProgreso?.diasFotos)
                            ? datos.fotosProgreso.diasFotos : null;
                        const esNuevo = datos.app === 'NicoGym' && datos.state && typeof datos.state === 'object';
                        if (esNuevo) {
                            const v = Number(datos.backupVersion);
                            if (!Number.isInteger(v) || v < 2 || v > CONFIG.BACKUP_VERSION) throw new Error('Versión de backup no compatible');
                        }
                        const datosEstado = esNuevo ? { ...datos.state } : { ...datos };
                        delete datosEstado.fotosProgreso;
                        Object.assign(STATE, migrateState(datosEstado));

                        // Compatibilidad con backups anteriores: conservar valores
                        // predeterminados si alguna sección no existe en el backup.
                        if (!STATE.recordatorios) STATE.recordatorios = {
                            freqMediciones: 2, freqFotos: 4,
                            ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES,
                            ultimasFotos: null, ultimoPeso: null
                        };
                        if (!STATE.records) STATE.records = [];
                        if (!STATE.evolution) STATE.evolution = {
                            initialWeight: 0, currentWeight: 0, initialWaist: 0,
                            currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0
                        };
                        if (!STATE.ajustes) STATE.ajustes = {};
                        if (!STATE.config) STATE.config = { temporizadorDescanso: false };
                        if (STATE.config.temporizadorDescanso === undefined) {
                            STATE.config.temporizadorDescanso = false;
                        }
                        if (!STATE.ultimoRegistroPeso) STATE.ultimoRegistroPeso = null;
                        if (!STATE.ultimasMediciones) STATE.ultimasMediciones = null;
                        if (!STATE.ultimasFotosGuardadas) STATE.ultimasFotosGuardadas = null;

                        CONFIG.TEMPORIZADOR_DESCANSO = STATE.config.temporizadorDescanso === true;
                        if (fotosProgreso !== null) {
                            await Fotos.restaurarBackup(fotosProgreso);
                        }
                        this._save();
                        UI.toast('✅ Datos importados correctamente', 'success');
                        APP.renderizarTodo();
                    } catch (err) {
                        UI.toast('❌ Error al importar: formato inválido', 'error');
                        console.error('Error al importar:', err);
                    }
                };
                reader.onerror = () => {
                    UI.toast('❌ Error al leer el archivo', 'error');
                };
                reader.readAsText(file);
            }
        };

        // ==========================================
        // STATE
        // ==========================================
        const STATE_SCHEMA_VERSION = 3;
        function migrateState(state) {
            if (!state || typeof state !== 'object') return state;
            if (!Array.isArray(state.diasEntrenados)) state.diasEntrenados = [];
            if (!Array.isArray(state.diasNoFumar)) state.diasNoFumar = [];
            if (!Array.isArray(state.historialEntrenos)) state.historialEntrenos = [];
            if (!Array.isArray(state.records)) state.records = [];
            if (!Array.isArray(state.mediciones)) state.mediciones = [];

            // Reconstruir índices derivados a partir del historial real.
            // Algunas versiones antiguas guardaban el entrenamiento en
            // historialEntrenos pero no añadían la fecha a diasEntrenados.
            // No se inventan sesiones: solo se usan fechas que ya existen
            // en el historial y que contienen ejercicios.
            // Normalizar fechas antiguas en lugar de descartarlas. Versiones
            // anteriores podían guardar DD/MM/YYYY o valores Date serializados.
            state.diasEntrenados = [...new Set((state.diasEntrenados || []).map(normalizarFechaLocal).filter(Boolean))].sort();
            state.diasNoFumar = [...new Set((state.diasNoFumar || []).map(normalizarFechaLocal).filter(Boolean))].sort();
            state.historialEntrenos = state.historialEntrenos.map(e => ({
                ...e,
                fecha: normalizarFechaLocal(e?.fecha),
                ejercicios: Array.isArray(e?.ejercicios) ? e.ejercicios : []
            })).filter(e => e.fecha && e.ejercicios.length);
            const fechasHistorial = state.historialEntrenos.map(e => e.fecha);
            state.diasEntrenados = [...new Set([...state.diasEntrenados, ...fechasHistorial])].sort();
            const candidato = state.fechaInicioNoFumar || state.evolution?.fechaInicioNoFumar || state.ajustes?.fechaInicioNoFumar;
            const fechaNoFumar = normalizarFechaLocal(candidato);
            state.fechaInicioNoFumar = fechaNoFumar || CONFIG.FECHA_INICIO_NO_FUMAR;

            // Normalizar mediciones antiguas sin borrar datos existentes.
            // El Dashboard y los gráficos necesitan un orden cronológico fiable.
            state.mediciones = state.mediciones
                .filter(m => m && typeof m === 'object')
                .map(m => ({
                    ...m,
                    fecha: normalizarFechaLocal(m.fecha),
                    peso: Number(m.peso),
                    cintura: Number.isFinite(Number(m.cintura)) ? Number(m.cintura) : 0,
                    grasaPorcentaje: Number.isFinite(Number(m.grasaPorcentaje)) ? Number(m.grasaPorcentaje) : 0,
                    masaMuscular: Number.isFinite(Number(m.masaMuscular)) ? Number(m.masaMuscular) : 0,
                    masaMagra: Number.isFinite(Number(m.masaMagra)) ? Number(m.masaMagra) : 0,
                    grasaVisceral: Number.isFinite(Number(m.grasaVisceral)) ? Number(m.grasaVisceral) : 0
                }))
                .filter(m => m.fecha && Number.isFinite(m.peso) && m.peso > 0)
                .sort((a, b) => a.fecha.localeCompare(b.fecha));

            state.recordatorios = (state.recordatorios && typeof state.recordatorios === 'object') ? state.recordatorios : {};
            state.recordatorios.freqMediciones = Math.max(1, parseInt(state.recordatorios.freqMediciones,10) || 2);
            state.recordatorios.freqFotos = Math.max(1, parseInt(state.recordatorios.freqFotos,10) || 4);
            state.schemaVersion = STATE_SCHEMA_VERSION;
            return state;
        }

        const STATE = {
            schemaVersion: 3,
            nombre: 'Nico',
            altura: CONFIG.ALTURA,
            mediciones: [],
            historialEntrenos: [],
            diasNoFumar: [],
            fechaInicioNoFumar: CONFIG.FECHA_INICIO_NO_FUMAR,
            diasEntrenados: [],
            checks: {},
            recordatorios: { freqMediciones: 2, freqFotos: 4, ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES,
                ultimasFotos: null, ultimoPeso: null },
            records: [],
            evolution: { initialWeight: 0, currentWeight: 0, initialWaist: 0, currentWaist: 0, totalWorkouts: 0,
                daysWithoutSmoking: 0 },
            ajustes: {},
            config: { temporizadorDescanso: false },
            _cargado: false,
            ultimoRegistroPeso: null,
            ultimasMediciones: null,
            ultimasFotosGuardadas: null
        };

        let diaActivo = 'lunes';
        let modoEntrenoActivo = false;
        let ejerciciosEntreno = [];
        let idxEjercicioActual = 0;
        let temporizadorDescanso = null;
        let tiempoDescanso = 0;
        let startTimeEntreno = null;
        let recordsConseguidos = [];
let cardioCompletado = false;
        let totalPesoLevantadoEntreno = 0;
        let totalVolumenEntreno = 0;
        let totalSeriesEntreno = 0;
        let totalRepsEntreno = 0;
        let msgCompletadoTimeout = null;

        // ==========================================
        // UI

        const UI = {
            toast(msg, tipo = 'info') {

            },
            ejecutarConfirmacion() {

                const modal = document.getElementById('modalGlobal');
                modal.classList.remove('hidden');
                const first = modal.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                if (first) setTimeout(() => first.focus(), 0);
            },
            cerrar() {
                const modal = document.getElementById('modalGlobal');
                modal.classList.add('hidden');
                if (this._previousFocus && typeof this._previousFocus.focus === 'function') {
                    setTimeout(() => this._previousFocus.focus(), 0);
                }
                this._previousFocus = null;
            }
        };
        document.addEventListener('keydown', e => {
            const modal = document.getElementById('modalGlobal');
            if (!modal || modal.classList.contains('hidden')) return;
            if (e.key === 'Escape') { e.preventDefault(); Modal.cerrar(); return; }
            if (e.key === 'Tab') {
                const focusables = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled);
                if (!focusables.length) return;
                const first = focusables[0], last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        });

        // ==========================================
        // RECORDS
        // ==========================================
        const Records = {
            getRecord(exerciseId, name) {
                return STATE.records.find(r => (exerciseId && r.exerciseId === exerciseId) || (!r.exerciseId && r.exerciseName === name));
            },
            actualizar(exerciseId, name, weight, reps, date) {
                const current = this.getRecord(exerciseId, name);
                if (!current || weight > current.weight || (weight === current.weight && reps > current.reps)) {
                    STATE.records = STATE.records.filter(r => !((exerciseId && r.exerciseId === exerciseId) || (!r.exerciseId && r.exerciseName === name)));
                    STATE.records.push({ exerciseId, exerciseName: name, weight, reps, date });
                    Storage._save();
                    return true;
                }
                return false;
            },
            render() {
                const c = document.getElementById('recordsContainer');
                if (!c) return;
                if (STATE.records.length === 0) {
                    c.innerHTML =
                        `<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">

                            <p style="font-size:13px;">Aún no has batido ningún récord</p>

                const sorted = [...STATE.records].sort((a, b) => b.weight - a.weight);

        };

        // ==========================================

        const APP = {

                // Cargar preferencia del temporizador: si no existe, false por defecto

            // ==========================================

            // ==========================================
            // MODO ENTRENO GUIADO
            // ==========================================
            iniciarEntreno(dia) {
                const ejercicios = getEjerciciosPorDia(dia);
                if (ejercicios.length === 0) {

                        material: ['Cinta de correr'],

                const dificultadColor = getDificultadColor(ej.dificultad);

                const intensidad = ej.intensidadMuscular || {};

                let html = `

            _guardarEjercicio() {
                const ej = ejerciciosEntreno[idxEjercicioActual];
                const peso = parseFloat(document.getElementById('mePeso').value);
                const reps = document.getElementById('meReps').value.trim() || '-';
                const notas = document.getElementById('meNotas').value.trim() || '';

                if (!peso || peso === 0) {
                    UI.toast('Introduce un peso válido', 'error');
                    return;
                }

                const repsData = parseReps(reps);
                if (!repsData.valid) { UI.toast(`❌ ${repsData.reason}`, 'error'); return; }
                const repsNum = repsData.total;
                const seriesNum = repsData.series.length;

                const totalesEjercicio = calcularTotalesEjercicio({ nombre: ej.nombre, peso, reps, series: seriesNum, repsTotales: repsNum });
                totalPesoLevantadoEntreno += totalesEjercicio.cargaAcumulada;
                totalVolumenEntreno += totalesEjercicio.volumen;
                totalSeriesEntreno += seriesNum;
                totalRepsEntreno += repsNum;

                const hoy = UI.getHoy();
                const dia = ej.dia;
                let entrenamientoExistente = STATE.historialEntrenos.find(e => e.fecha === hoy && e.dia === dia);

                const registroEjercicio = {
                    exerciseId: ej.id,
                    nombre: ej.nombre,
                    peso: peso,
                    reps: reps,
                    tipo: 'mancuerna',
                    discos: {},
                    notas: notas,
                    series: seriesNum,
                    repsTotales: repsNum
                };

                if (entrenamientoExistente) {
                    const ejExistente = entrenamientoExistente.ejercicios.find(e => e.nombre === ej.nombre);
                    if (ejExistente) Object.assign(ejExistente, registroEjercicio);
                    else entrenamientoExistente.ejercicios.push(registroEjercicio);
                } else {
                    STATE.historialEntrenos.push({
                        fecha: hoy,
                        dia: dia,
                        tipo: CONFIG.TIPOS_RUTINA[dia] || dia.toUpperCase(),
                        ejercicios: [registroEjercicio]
                    });
                }

                if (peso > 0 && repsNum > 0) {
                    const date = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit',
                        year: 'numeric' });
                    if (Records.actualizar(ej.id, ej.nombre, peso, repsNum, date)) {
                        recordsConseguidos.push(ej.nombre);
                        UI.toast('🏆 ¡Nuevo récord!', 'success');
                    }
                }

                const ejerciciosDia = getEjerciciosPorDia(dia);
                const idxEjercicio = ejerciciosDia.findIndex(e => e.nombre === ej.nombre);
                if (idxEjercicio >= 0) {
                    const id = `${dia}-${idxEjercicio}`;
                    if (!STATE.checks[id]) STATE.checks[id] = true;
                }

                Storage._save();

                this._mostrarMensajeCompletado(ej.nombre);

                idxEjercicioActual++;
                if (idxEjercicioActual >= ejerciciosEntreno.length) {
                    setTimeout(() => this._finalizarEntreno(), CONFIG.TIEMPO_MSG_COMPLETADO + 300);
                } else if (CONFIG.TEMPORIZADOR_DESCANSO) {
                    setTimeout(() => this._mostrarDescanso(), CONFIG.TIEMPO_MSG_COMPLETADO);
                } else {
                    setTimeout(() => this._mostrarEjercicio(), CONFIG.TIEMPO_MSG_COMPLETADO);
                }
            },

            _mostrarMensajeCompletado(nombre) {
                const msg = document.getElementById('meCompletadoMsg');
                msg.textContent = `✔ ${nombre} completado`;
                msg.classList.remove('hidden');
                if (msgCompletadoTimeout) clearTimeout(msgCompletadoTimeout);
            },

            _mostrarDescanso() {
                const ej = ejerciciosEntreno[idxEjercicioActual];
                const descanso = ej.descanso || 60;
                tiempoDescanso = descanso;

                const body = document.getElementById('meBody');
                body.innerHTML = `
                    <div class="me-descanso">
                        <div style="font-size:22px;margin-bottom:6px;">⏱️</div>
                        <div class="me-timer" id="meTimer">${tiempoDescanso}</div>

                            <i class="fa-solid fa-forward"></i> Saltar descanso
                        </button>
                    </div>
                `;

                if (temporizadorDescanso) clearInterval(temporizadorDescanso);
                temporizadorDescanso = setInterval(() => {
                    tiempoDescanso--;
                    const el = document.getElementById('meTimer');
                    if (el) el.textContent = tiempoDescanso;
                    if (tiempoDescanso <= 0) {

            _saltarDescanso() {

                const ej = ejerciciosEntreno[idxEjercicioActual];
                const hoy = UI.getHoy();
                let entrenamientoExistente = STATE.historialEntrenos.find(e => e.fecha === hoy && e.dia === ej.dia);
                const registroCardio = { exerciseId: ej.id, nombre: ej.nombre, tipo: 'caminata', minutos: `${CONFIG.MIN_CINTA}-${CONFIG.MAX_CINTA}`, notas: '' };
                if (entrenamientoExistente) {
                    const existente = entrenamientoExistente.ejercicios.find(e => e.nombre === ej.nombre);
                    if (existente) Object.assign(existente, registroCardio);
                    else entrenamientoExistente.ejercicios.push(registroCardio);

                    STATE.historialEntrenos.push({ fecha: hoy, dia: ej.dia, tipo: CONFIG.TIPOS_RUTINA[ej.dia] || ej.dia.toUpperCase(), ejercicios: [registroCardio] });

            _getUltimoEntreno(nombre) {
                const ord = [...STATE.historialEntrenos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                for (const e of ord) {
                    const ej = e.ejercicios.find(x => x.nombre === nombre);
                    if (ej) return { fecha: e.fecha, peso: ej.peso, reps: ej.reps };
                }
                return null;
            }
        };

        // ==========================================

            render() {
                const c = document.getElementById('dashboardContainer');
                if (!c) return;

                const hoy = new Date();
                const horas = hoy.getHours();
                let saludo = 'Buenos días';
                if (horas >= 14 && horas < 21) saludo = 'Buenas tardes';
                if (horas >= 21 || horas < 6) saludo = 'Buenas noches';

                const dia = UI.getDiaNombre();
                const rutinaNombre = CONFIG.TIPOS_RUTINA[dia] || 'Descanso';
                const entrenadoHoy = STATE.diasEntrenados.includes(UI.getHoy());

                const peso = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                const obj = CONFIG.PESO_OBJETIVO;
                let pctObjetivo = 0;
                if (STATE.mediciones.length > 0) {
                    const primero = obtenerPesoInicialHistorico();
                    const ultimo = Number(STATE.mediciones[STATE.mediciones.length - 1].peso);
                    pctObjetivo = calcularProgresoObjetivo(primero, ultimo, obj);
                }

                let racha = 0;
                const hoyRacha = new Date();
                hoyRacha.setHours(0,0,0,0);
                const diasProgramados = new Set(['lunes','martes','miercoles','jueves','viernes']);
                for (let i = 0; i < 180; i++) {
                    const f = new Date(hoyRacha);
                    f.setDate(hoyRacha.getDate() - i);
                    const nombreDia = ({0:'domingo',1:'lunes',2:'martes',3:'miercoles',4:'jueves',5:'viernes',6:'sabado'})[f.getDay()];
                    if (!diasProgramados.has(nombreDia)) continue;
                    const completado = STATE.diasEntrenados.includes(UI.formatFecha(f));
                    if (i === 0 && !completado) continue;
                    if (completado) racha++;
                    else break;
                }

                let ultimoEntreno = 'Nunca';
                const fechasEntreno = [...new Set([
                    ...(STATE.diasEntrenados || []).map(normalizarFechaLocal),
                    ...(STATE.historialEntrenos || []).map(e => Array.isArray(e?.ejercicios) && e.ejercicios.length ? normalizarFechaLocal(e.fecha) : '')
                ].filter(Boolean))].sort();
                if (fechasEntreno.length > 0) {
                    const ultimo = fechasEntreno[fechasEntreno.length - 1];
                    const diff = Math.round((new Date(UI.getHoy() + 'T00:00:00') - new Date(ultimo + 'T00:00:00')) / 86400000);
                    if (diff === 0) ultimoEntreno = 'Hoy';
                    else if (diff === 1) ultimoEntreno = 'Ayer';
                    else if (diff < 7) ultimoEntreno = `Hace ${diff} días`;
                    else ultimoEntreno = UI.formatearFecha(ultimo);
                }

                let ultimaMedicion = 'Nunca';
                if (STATE.mediciones.length > 0) {
                    const ultima = STATE.mediciones[STATE.mediciones.length - 1];
                    const diff = Math.round((new Date(UI.getHoy() + 'T00:00:00') - new Date(normalizarFechaLocal(ultima.fecha) + 'T00:00:00')) / 86400000);
                    if (diff === 0) ultimaMedicion = 'Hoy';
                    else if (diff === 1) ultimaMedicion = 'Ayer';
                    else if (diff < 7) ultimaMedicion = `Hace ${diff} días`;
                    else ultimaMedicion = UI.formatearFecha(ultima.fecha);
                }

                const diasMap = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes',
                    6: 'sabado' };
                let proxDia = null;

                    const d = new Date(hoy);
                    d.setDate(hoy.getDate() + i);
                    const diaKey = diasMap[d.getDay()];

                            <div class="pe-nombre">${proxIcono} ${proxNombre}</div>

                                <span style="font-size:13px;color:var(--text-secondary);">

                                    <div>Último peso: <strong style="color:var(--text);">${ultimo.peso} kg</strong></div>

                                </div>

                const mostrarCamposCompletos = (tipo === 'completa' || tipo === 'mediciones' || !esDomingo || !esFechaValida);

                let html = `
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-plus"></i> ${titulo}</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">${descripcion}</div>
                        ${mensajeAdicional}
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
                            <div class="form-field"><label>Fecha</label><input type="date" id="medFecha" class="input" value="${UI.getHoy()}"></div>
                            <div class="form-field"><label>Peso (kg) *</label><input type="number" id="medPeso" step="0.1" placeholder="${ultimo ? ultimo.peso : '84.3'}" class="input"></div>
                            ${mostrarCamposCompletos ? `
                                <div class="form-field"><label>% Grasa</label><input type="number" id="medGrasa" step="0.1" placeholder="${ultimo ? ultimo.grasaPorcentaje : '27.5'}" class="input"></div>
                                <div class="form-field"><label>Masa muscular (kg)</label><input type="number" id="medMusculo" step="0.1" placeholder="${ultimo ? ultimo.masaMuscular : '58.2'}" class="input"></div>
                                <div class="form-field"><label>Masa magra (kg)</label><input type="number" id="medMagra" step="0.1" placeholder="${ultimo ? ultimo.masaMagra : '62.0'}" class="input"></div>
                                <div class="form-field"><label>Grasa visceral</label><input type="number" id="medVisceral" step="0.5" placeholder="${ultimo ? ultimo.grasaVisceral : '8.0'}" class="input"></div>
                                <div class="form-field" style="grid-column:span 2;"><label>Cintura (cm)</label><input type="number" id="medCintura" step="0.1" placeholder="${ultimo ? ultimo.cintura : '98'}" class="input"></div>

                            <div class="peso-stat"><div class="num primary">${ultimo ? ultimo.peso : '--'}</div><div class="label">Peso</div></div>

                `;
                c.innerHTML = html;
                this._renderHistorial();
            },

            getUltimaMedicionCompletaTexto() {
                const medidas = Array.isArray(STATE.mediciones) ? STATE.mediciones
                    .map(m => ({ ...m, fecha: normalizarFechaLocal(m?.fecha) }))
                    .filter(m => m.fecha && Number.isFinite(Number(m.peso)) && Number(m.peso) > 0)
                    .sort((a,b) => b.fecha.localeCompare(a.fecha)) : [];
                if (!medidas.length) return 'Ninguna registrada';
                // Una medición se considera completa cuando contiene al menos
                // peso y cintura. Los demás campos son opcionales en modelos
                // antiguos y no deben hacer que una medición válida desaparezca.
                const completas = medidas.filter(m => Number.isFinite(Number(m.cintura)) && Number(m.cintura) > 0);
                const fecha = (completas[0] || medidas[0]).fecha;
                try { return UI.formatearFecha(fecha); }
                catch (_) { return fecha; }
            },

            _guardar() {
                const f = document.getElementById('medFecha').value;
                if (!f) { UI.toast('Selecciona fecha', 'error'); return; }

                const peso = parseFloat(document.getElementById('medPeso').value);
                if (isNaN(peso) || peso === 0) { UI.toast('Introduce un peso válido', 'error'); return; }

                const ultimo = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1] : null;
                const idx = STATE.mediciones.findIndex(x => x.fecha === f);
                const ultimoRegistro = (idx !== -1 ? STATE.mediciones[idx] : null) || ultimo || STATE.ultimasMediciones || {
                    grasaPorcentaje: 0,
                    masaMuscular: 0,
                    masaMagra: 0,
                    grasaVisceral: 0,
                    cintura: 0
                };
                const conservarSiVacio = (id, valorAnterior) => {
                    const input = document.getElementById(id);
                    const valor = input ? parseFloat(input.value) : NaN;
                    return Number.isFinite(valor) ? valor : (valorAnterior ?? 0);
                };
                const grasaPorcentaje = conservarSiVacio('medGrasa', ultimoRegistro.grasaPorcentaje);
                const masaMuscular = conservarSiVacio('medMusculo', ultimoRegistro.masaMuscular);
                const masaMagra = conservarSiVacio('medMagra', ultimoRegistro.masaMagra);
                const grasaVisceral = conservarSiVacio('medVisceral', ultimoRegistro.grasaVisceral);
                const cintura = conservarSiVacio('medCintura', ultimoRegistro.cintura);
                const nm = {
                    fecha: f,
                    peso: peso,
                    grasaPorcentaje: grasaPorcentaje,
                    masaMuscular: masaMuscular,
                    masaMagra: masaMagra || 0,
                    grasaVisceral: grasaVisceral || 0,
                    cintura: cintura
                };

                if (idx !== -1) STATE.mediciones[idx] = nm;
                else STATE.mediciones.push(nm);

                STATE.mediciones.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
                STATE.recordatorios.ultimaMedicion = f;

                STATE.ultimasMediciones = {
                    grasaPorcentaje: grasaPorcentaje,
                    masaMuscular: masaMuscular,
                    masaMagra: masaMagra || 0,
                    grasaVisceral: grasaVisceral || 0,
                    cintura: cintura
                };

                actualizarEvolutionDesdeMediciones();
                Storage._save();
                UI.toast('✅ Datos guardados', 'success');
                this.render();
                APP.renderizarTodo();
                document.getElementById('medPeso').value = '';
            },

            _renderHistorial() {
                const c = document.getElementById('historialMediciones');
                if (!c) return;
                if (STATE.mediciones.length === 0) {
                    c.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:10px;">Sin registros</div>';
                    return;
                }
                const rev = [...STATE.mediciones].reverse();
                c.innerHTML = rev.map((m, i) => {
                    const diff = i < rev.length - 1 ? (m.peso - rev[i + 1].peso).toFixed(1) : null;
                    return `
                        <div class="historial-medicion-card" onclick="Peso._toggleDetalle(${i})">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span class="med-fecha">${UI.formatearFecha(m.fecha)}</span>

                            </div>
                            <div class="med-resumen">
                                <span class="med-item">📏 <span class="valor">${m.cintura}</span> cm</span>
                                <span class="med-item">💪 <span class="valor">${m.masaMuscular}</span> kg</span>
                                <span class="med-item">🔥 <span class="valor">${m.grasaPorcentaje}</span>%</span>
                                ${diff !== null && Math.abs(parseFloat(diff)) > 0 ? `<span class="med-item ${parseFloat(diff) < 0 ? 'positive' : 'negative'}">${parseFloat(diff) > 0 ? '+' : ''}${diff} kg</span>` : ''}
                            </div>
                            <div class="historial-medicion-detalle" id="pesoDetalle-${i}">
                                <div class="detalle-item"><span>Peso</span><span>${m.peso} kg</span></div>
                                <div class="detalle-item"><span>Cintura</span><span>${m.cintura} cm</span></div>
                                <div class="detalle-item"><span>% Grasa</span><span>${m.grasaPorcentaje}%</span></div>
                                <div class="detalle-item"><span>Masa muscular</span><span>${m.masaMuscular} kg</span></div>
                                <div class="detalle-item"><span>Masa magra</span><span>${m.masaMagra || '--'} kg</span></div>
                                <div class="detalle-item"><span>Grasa visceral</span><span>${m.grasaVisceral || '--'}</span></div>
                                <div style="margin-top:6px;display:flex;gap:6px;justify-content:center;">
                                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();Peso._editar('${m.fecha}')"><i class="fa-solid fa-pen"></i> Editar</button>
                                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();Peso._eliminar('${m.fecha}')"><i class="fa-solid fa-trash"></i> Eliminar</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            _toggleDetalle(i) {
                const d = document.getElementById(`pesoDetalle-${i}`);
                if (d) d.classList.toggle('open');
            },

            _editar(f) {
                const m = STATE.mediciones.find(x => x.fecha === f);
                if (!m) return;
                document.getElementById('medFecha').value = m.fecha;
                document.getElementById('medPeso').value = m.peso;
                document.getElementById('medGrasa').value = m.grasaPorcentaje;

        const Fotos = {
            db: null,
            DB_NAME: 'FotosProgresoDB',
            STORE_NAME: 'diasFotos',
            _objectUrls: [],

            _abrirDB() {
                return new Promise(r => {
                    const req = indexedDB.open(this.DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        if (!e.target.result.objectStoreNames.contains(this.STORE_NAME))
                            e.target.result.createObjectStore(this.STORE_NAME, { keyPath: 'fecha' });
                    };
                    req.onsuccess = e => { this.db = e.target.result;
                        r(); };
                    req.onerror = () => r();
                });
            },

            async exportarBackup() {
                await this._abrirDB();
                if (!this.db) throw new Error('No se pudo abrir la base de fotos');

                return new Promise((resolve, reject) => {
                    const req = this.db.transaction(this.STORE_NAME, 'readonly')
                        .objectStore(this.STORE_NAME).getAll();
                    req.onsuccess = e => {
                        const fotos = (e.target.result || [])
                            .filter(dia => dia && typeof dia.fecha === 'string')
                            .map(dia => ({
                                fecha: dia.fecha,
                                timestamp: dia.timestamp,
                                frente: dia.frente || null,
                                espalda: dia.espalda || null,
                                izquierda: dia.izquierda || null,
                                derecha: dia.derecha || null
                            }));
                        resolve(fotos);
                    };
                    req.onerror = () => reject(req.error || new Error('No se pudieron leer las fotos'));
                });
            },

            async restaurarBackup(diasFotos) {
                await this._abrirDB();
                if (!this.db) throw new Error('No se pudo abrir la base de fotos');

                const fotosValidas = diasFotos
                    .filter(dia => dia && typeof dia.fecha === 'string')
                    .map(dia => ({
                        fecha: dia.fecha,
                        timestamp: Number.isFinite(dia.timestamp) ? dia.timestamp : Date.now(),
                        frente: dia.frente || null,
                        espalda: dia.espalda || null,
                        izquierda: dia.izquierda || null,
                        derecha: dia.derecha || null
                    }));

                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(this.STORE_NAME, 'readwrite');
                    const store = tx.objectStore(this.STORE_NAME);
                    store.clear();
                    fotosValidas.forEach(dia => store.put(dia));
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error || new Error('No se pudieron restaurar las fotos'));
                    tx.onabort = () => reject(tx.error || new Error('Se canceló la restauración de fotos'));
                });
            },

            async _leerArchivo(file) {
                if (!file) return null;
                if (!file.type?.startsWith('image/')) throw new Error('Archivo de imagen no válido');
                const dataUrl = await new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=e=>resolve(e.target.result); reader.onerror=()=>reject(new Error('No se pudo leer la imagen')); reader.readAsDataURL(file); });
                const img = await new Promise((resolve,reject)=>{ const im=new Image(); im.onload=()=>resolve(im); im.onerror=()=>reject(new Error('No se pudo procesar la imagen')); im.src=dataUrl; });
                const max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
                const c=document.createElement('canvas'); c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)); c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
                c.getContext('2d').drawImage(img,0,0,c.width,c.height);
                return c.toDataURL('image/jpeg',0.82);
            },

            _guardarRegistroFotos(data) {
                return new Promise((resolve,reject)=>{
                    const tx=this.db.transaction(this.STORE_NAME,'readwrite');
                    tx.objectStore(this.STORE_NAME).put(data);
                    tx.oncomplete=()=>resolve();
                    tx.onerror=()=>reject(tx.error||new Error('No se pudieron guardar las fotos'));
                    tx.onabort=()=>reject(tx.error||new Error('Se canceló el guardado de fotos'));
                });
            },

            async render() {

                if (!c) return;

                    </div>

                    <div class="card">

                        <div style="display:flex;gap:6px;margin-bottom:8px">

                `;
                document.getElementById('fechaFotos').value = UI.getHoy();
            },

            _obtenerFechas() {
                return new Promise(r => {
                    if (!this.db) { this._abrirDB().then(() => this._obtenerFechas().then(r)); return; }
                    const req = this.db.transaction(this.STORE_NAME, 'readonly').objectStore(this.STORE_NAME)
                        .getAll();
                    req.onsuccess = e => r((e.target.result || []).sort((a, b) => b.timestamp - a.timestamp).map(i =>
                        i.fecha));
                    req.onerror = () => r([]);
                });
            },

            async _guardar() {
                const f = document.getElementById('fechaFotos').value;
                if (!f) { UI.toast('Selecciona fecha', 'error'); return; }

                const inputs = document.querySelectorAll('.equip-card input[type="file"]');
                const files = {};
                for (const input of inputs) {
                    const label = input.parentElement.querySelector('.label').textContent;
                    files[label] = input.files[0];
                }

                const fr = await this._leerArchivo(files['Frente']);
                const es = await this._leerArchivo(files['Espalda']);
                const iz = await this._leerArchivo(files['Izquierda']);
                const de = await this._leerArchivo(files['Derecha']);

                if (!fr && !es && !iz && !de) { UI.toast('Selecciona al menos una foto', 'error'); return; }

                await this._abrirDB();
                await this._guardarRegistroFotos({
                    fecha: f,
                    timestamp: Date.now(),
                    frente: fr,
                    espalda: es,
                    izquierda: iz,
                    derecha: de
                });
                STATE.recordatorios.ultimasFotos = f;
                Storage._save();
                UI.toast('✅ Fotos guardadas', 'success');
                this.render();
                APP.renderizarTodo();

                document.querySelectorAll('.equip-card input[type="file"]').forEach(input => input.value = '');
                document.querySelectorAll('.foto-preview').forEach(el => el.classList.add('hidden'));
            },

            _preview(input, tipo) {
                if (input.files[0]) {
                    const r = new FileReader();
                    r.onload = e => {
                        const img = document.getElementById('preview' + tipo);
                        img.src = e.target.result;
                        img.classList.remove('hidden');
                    };
                    r.readAsDataURL(input.files[0]);
                }
            },

            async _fuenteImagen(valor) {
                if (!valor) return null;
                if (typeof valor === 'string') return valor;
                if (valor instanceof Blob) {
                    const url = URL.createObjectURL(valor);
                    this._objectUrls.push(url);
                    return url;
                }
                if (valor instanceof ArrayBuffer) {
                    const url = URL.createObjectURL(new Blob([valor], {type:'image/jpeg'}));
                    this._objectUrls.push(url);
                    return url;
                }
                if (ArrayBuffer.isView(valor)) {
                    const url = URL.createObjectURL(new Blob([valor.buffer], {type:'image/jpeg'}));
                    this._objectUrls.push(url);
                    return url;
                }
                if (typeof valor === 'object') {
                    if (typeof valor.dataUrl === 'string') return valor.dataUrl;
                    if (typeof valor.src === 'string') return valor.src;
                    if (typeof valor.data === 'string') return valor.data;
                    if (valor.blob instanceof Blob) return this._fuenteImagen(valor.blob);
                }
                return null;
            },

            async _comparar() {
                const f1 = document.getElementById('compararDia1').value;
                const f2 = document.getElementById('compararDia2').value;
                const resultado = document.getElementById('comparadorResultado');
                if (!f1 || !f2) { UI.toast('Selecciona dos días', 'error'); return; }

                this._objectUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} });
                this._objectUrls = [];
                await this._abrirDB();
                if (!this.db) { UI.toast('No se pudo abrir la base de fotos', 'error'); return; }
                const store = this.db.transaction(this.STORE_NAME, 'readonly').objectStore(this.STORE_NAME);
                const get = key => new Promise((resolve,reject)=>{
                    const req=store.get(key);
                    req.onsuccess=e=>resolve(e.target.result || null);
                    req.onerror=()=>reject(req.error || new Error('No se pudo leer la foto'));
                });
                let d1, d2;
                try { [d1,d2]=await Promise.all([get(f1),get(f2)]); }
                catch(err){ console.error(err); UI.toast('No se pudieron leer las fotos', 'error'); return; }

                const gen = async (t, c) => {
                    const src1 = await this._fuenteImagen(d1?.[c]);
                    const src2 = await this._fuenteImagen(d2?.[c]);
                    if (!src1 && !src2) return '';
                    const img = (src, fecha, alt) => src
                        ? `<img src="${escapeHTML(src)}" alt="${alt}" style="width:100%;height:100%;border-radius:var(--radius-sm);object-fit:cover;cursor:pointer;display:block;" onclick="UI.abrirLightbox(this.src)">`
                        : `<div style="height:100%;min-height:220px;border-radius:var(--radius-sm);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--text-secondary);font-size:11px;">Sin foto</div>`;
                    return `
                        <div class="ng-photo-compare" style="background:var(--bg-card);border-radius:var(--radius-sm);padding:8px;margin-bottom:8px;border:1px solid var(--border);">
                            <h4 style="color:var(--primary);margin-bottom:6px;text-align:center;font-size:12px;">${t}</h4>
                            <div class="ng-photo-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                                <div style="min-width:0;"><div style="font-size:10px;color:var(--text-secondary);text-align:center;margin-bottom:3px;">${UI.formatearFecha(f1)}</div><div style="aspect-ratio:3/4;overflow:hidden;border-radius:var(--radius-sm);">${img(src1,f1,t+' día 1')}</div></div>
                                <div style="min-width:0;"><div style="font-size:10px;color:var(--text-secondary);text-align:center;margin-bottom:3px;">${UI.formatearFecha(f2)}</div><div style="aspect-ratio:3/4;overflow:hidden;border-radius:var(--radius-sm);">${img(src2,f2,t+' día 2')}</div></div>
                            </div>
                        </div>`;
                };

                const partes=[];
                for (const [t,c] of [['FRENTE','frente'],['ESPALDA','espalda'],['IZQUIERDA','izquierda'],['DERECHA','derecha']]) partes.push(await gen(t,c));
                const html=partes.join('');
                resultado.innerHTML=html || '<div style="text-align:center;padding:16px;color:var(--text-secondary);">No hay fotos para comparar en esas fechas.</div>';
            }
        };
