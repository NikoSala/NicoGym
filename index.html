        // ============================================================
        // CAPA FINAL DE CALIDAD · FUNCIONES AVANZADAS
        // ============================================================
        const NicoGymFinal = {
            _warmupPendiente: false,
            _beforeInstallPrompt: null,
            escapeHTML(value) { return escapeHTML(value); },
            validarEstado(state) {
                if (!state || typeof state !== 'object' || Array.isArray(state)) return false;
                if (state.historialEntrenos && !Array.isArray(state.historialEntrenos)) return false;
                if (state.mediciones && !Array.isArray(state.mediciones)) return false;
                if (state.records && !Array.isArray(state.records)) return false;
                if (state.diasEntrenados && !Array.isArray(state.diasEntrenados)) return false;
                return true;
            },
            getRachaSesiones() {
                const dias = ['lunes','martes','miercoles','jueves','viernes'];
                const map = {0:'domingo',1:'lunes',2:'martes',3:'miercoles',4:'jueves',5:'viernes',6:'sabado'};
                const entrenados = new Set(STATE.diasEntrenados || []);
                let racha = 0;
                const d = new Date(); d.setHours(0,0,0,0);
                // Si hoy es laborable y aún no se ha hecho, la racha se mide desde la última sesión.
                if (dias.includes(map[d.getDay()]) && !entrenados.has(UI.formatFecha(d))) d.setDate(d.getDate()-1);
                for (let i=0;i<365;i++) {
                    const dia = map[d.getDay()];
                    if (dias.includes(dia)) {
                        if (entrenados.has(UI.formatFecha(d))) racha++;
                        else break;
                    }
                    d.setDate(d.getDate()-1);
                }
                return racha;
            },
            getSemanaActual() {
                const now = new Date();
                const day = now.getDay() || 7;
                const monday = new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate()-day+1);
                const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
                return { monday, sunday };
            },
            resumenSemanal() {
                const {monday,sunday} = this.getSemanaActual();
                const sesiones = new Set((STATE.diasEntrenados||[]).filter(f => { const d=new Date(f); return d>=monday && d<=sunday; }));
                let volumen=0, reps=0, series=0;
                (STATE.historialEntrenos||[]).forEach(ent => {
                    const d=new Date(ent.fecha); if(d<monday||d>sunday) return;
                    (ent.ejercicios||[]).forEach(e=>{
                        const tot=calcularTotalesEjercicio(e);
                        reps+=tot.reps; series+=tot.series; volumen+=tot.volumen;
                    });
                });
                const records = (STATE.records||[]).filter(r => { const d=new Date(r.date); return d>=monday && d<=sunday; }).length;
                return {sesiones: sesiones.size, volumen, reps, series, records};
            },
            siguienteObjetivo(ej, ultimo) {
                if (!ultimo) return 'Empieza con un peso que te permita completar el rango con técnica limpia.';
                const m=String(ej.reps||'').match(/(\d+)\s*[-–]\s*(\d+)/);
                if (!m) return `Mantén ${ultimo.peso} kg e intenta mejorar las repeticiones con buena técnica.`;
                const min=Number(m[1]), max=Number(m[2]);
                const p=parseReps(ultimo.reps);
                const maxSerie=p.valid ? Math.max(...p.series) : 0;
                if (p.valid && p.series.length>0 && p.series.every(r=>r>=max)) {
                    const incremento=/press|sentadilla|remo|barbell/i.test(ej.nombre)?2.5:1;
                    return `💪 Próximo objetivo: prueba ${Number(ultimo.peso)+incremento} kg y busca ${min}–${max} reps.`;
                }
                return `🎯 Próximo objetivo: mantén ${ultimo.peso} kg e intenta acercarte a ${max} reps por serie.`;
            },
            e1RM(peso,reps) { return Number(peso) * (1 + Number(reps)/30); },
            añadirPWA() {
                const meta=document.createElement('meta'); meta.name='theme-color'; meta.content='#151515'; document.head.appendChild(meta);
                const manifest={name:'NicoGym',short_name:'NicoGym',start_url:'.',display:'standalone',background_color:'#111',theme_color:'#151515',icons:[{src:'img/logo-nicogym.png',sizes:'512x512',type:'image/png'}]};
                const link=document.createElement('link'); link.rel='manifest'; link.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(link);
                window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); this._beforeInstallPrompt=e; });
            },
            añadirRIR() {
                const inputs=document.querySelector('.me-ej-inputs'); if(!inputs || document.getElementById('meRIR')) return;
                const wrap=document.createElement('div'); wrap.className='me-input-group'; wrap.innerHTML='<label>RIR (repeticiones en reserva)</label><input type="number" id="meRIR" min="0" max="5" step="1" placeholder="0–5">';
                inputs.appendChild(wrap);
            },
            añadirObjetivo(ej) {
                const card=document.querySelector('.me-ejercicio-card'); if(!card) return;
                const ultimo=APP._getUltimoEntreno(ej.nombre); if(!ultimo) return;
                const box=document.createElement('div'); box.className='ng-next-goal'; box.innerHTML=this.escapeHTML(this.siguienteObjetivo(ej,ultimo));
                const datos=card.querySelector('.me-ej-datos'); if(datos) datos.after(box); else card.prepend(box);
            },
            añadirCalentamiento(ej) {
                if(this._warmupPendiente || idxEjercicioActual!==0) return false;
                this._warmupPendiente=true;
                const body=document.getElementById('meBody');
                body.innerHTML=`<div class="ng-warmup"><div class="ng-warmup-icon">🔥</div><h3>Calentamiento</h3><p>5 minutos de movilidad y 2 series progresivas antes de empezar.</p><div class="ng-warmup-list"><div>• Movilidad articular suave</div><div>• 1ª serie con poco peso</div><div>• 2ª serie de aproximación</div></div><button class="btn btn-primary btn-block" id="ngStartWorkout"><i class="fa-solid fa-play"></i> Empezar entrenamiento</button></div>`;
                document.getElementById('ngStartWorkout').onclick=()=>{ startTimeEntreno=Date.now(); this._warmupPendiente=false; APP._warmupCompletadoOnce=true; APP._mostrarEjercicio(); };
                return true;
            },
            añadirResumenDashboard() {
                const c=document.getElementById('dashboardContainer'); if(!c) return;
                const existente=c.querySelector('.ng-weekly');
                if (existente) existente.remove();
                const r=this.resumenSemanal();
                const weekly=document.createElement('div'); weekly.className='card ng-weekly';
                weekly.innerHTML=`<div class="card-title">📅 Resumen semanal</div><div class="ng-summary-grid"><div><b>${r.sesiones}</b><span>sesiones</span></div><div><b>${Math.round(r.volumen).toLocaleString('es-ES')}</b><span>kg volumen</span></div><div><b>${r.reps}</b><span>reps</span></div><div><b>${r.records}</b><span>récords</span></div></div>`;
                c.appendChild(weekly);
            },
            añadirGraficos() {
                const c=document.getElementById('estadisticasContainer');
                if(!c) return;
                const existente=c.querySelector('.ng-charts');
                if(existente) existente.remove();

                // Normalizamos y ordenamos aquí también para que los datos ya
                // guardados en localStorage se representen aunque provengan de
                // una versión anterior de NicoGym.
                const medidas=[...(STATE.mediciones||[])]
                    .filter(m => m && Number.isFinite(Number(m.peso)) && Number(m.peso) > 0)
                    .sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')))
                    .slice(-12);

                let pesoGrafico='';
                if (medidas.length) {
                    const pesos=medidas.map(m=>Number(m.peso));
                    const minPeso=Math.min(...pesos);
                    const maxPeso=Math.max(...pesos);
                    const margen=Math.max(0.5,(maxPeso-minPeso)*0.15);
                    const lo=minPeso-margen, hi=maxPeso+margen, rango=Math.max(0.001,hi-lo);
                    const ancho=460, alto=90;
                    const puntos=medidas.map((m,i)=>{
                        const x=20+(medidas.length===1 ? ancho/2 : (i/(medidas.length-1))*ancho);
                        const y=110-((Number(m.peso)-lo)/rango)*alto;
                        return {x,y,peso:Number(m.peso)};
                    });
                    const poly=puntos.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
                    const linea=medidas.length>1 ? `<polyline points="${poly}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>` : '';
                    const puntosSvg=puntos.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="currentColor"><title>${p.peso.toFixed(1)} kg</title></circle>`).join('');
                    const etiquetaInicio=`<text x="20" y="18" class="ng-chart-label">${minPeso.toFixed(1)} kg</text>`;
                    const etiquetaFin=`<text x="390" y="18" class="ng-chart-label">${maxPeso.toFixed(1)} kg</text>`;
                    pesoGrafico=`${etiquetaInicio}${etiquetaFin}${linea}${puntosSvg}`;
                } else {
                    pesoGrafico='<text x="20" y="70">Aún no hay mediciones de peso válidas</text>';
                }

                const porDia=new Map();
                (STATE.historialEntrenos||[]).forEach(e=>{
                    const fecha=String(e.fecha||'');
                    if(!fecha) return;
                    let v=0;
                    (e.ejercicios||[]).forEach(x=>{
                        v+=calcularTotalesEjercicio(x).volumen;
                    });
                    porDia.set(fecha,(porDia.get(fecha)||0)+v);
                });
                const vol=[...porDia.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-8).map(([key,v])=>({key,v}));
                const maxV=Math.max(1,...vol.map(x=>x.v));
                const bars=vol.map((x,i)=>{
                    const h=x.v>0?Math.max(4,Math.round((x.v/maxV)*90)):0;
                    return `<rect x="${i*42+8}" y="${100-h}" width="28" height="${h}" rx="4"><title>${escapeHTML(x.key)}: ${Math.round(x.v).toLocaleString('es-ES')} kg</title></rect>`;
                }).join('');

                const card=document.createElement('div');
                card.className='card ng-charts';
                card.innerHTML=`<div class="card-title">📈 Progreso</div><div class="ng-chart-title">Peso</div><svg viewBox="0 0 500 140" class="ng-svg" role="img" aria-label="Evolución del peso"><line x1="10" y1="120" x2="490" y2="120" class="axis"></line>${pesoGrafico}</svg><div class="ng-chart-title">Volumen reciente</div><svg viewBox="0 0 360 120" class="ng-svg ng-bars" role="img" aria-label="Volumen reciente">${bars||'<text x="20" y="60">Sin entrenamientos registrados</text>'}</svg><div class="ng-chart-note">Los gráficos usan tus registros locales y se actualizan al guardar datos.</div>`;
                c.appendChild(card);
            },
            sliderFotos() {
                const result=document.getElementById('comparadorResultado'); if(!result) return;
                result.querySelectorAll('.ng-photo-pair').forEach(pair=>{
                    if(pair.querySelector('.ng-slider')) return;
                    const imgs=pair.querySelectorAll('img'); if(imgs.length<2) return;
                    const wrap=document.createElement('div'); wrap.className='ng-slider';
                    wrap.innerHTML=`<div class="ng-slide-before"><img src="${imgs[0].src}"></div><div class="ng-slide-after"><img src="${imgs[1].src}"></div><input type="range" min="0" max="100" value="50" aria-label="Comparar fotos"><span class="ng-slide-handle">↔</span>`;
                    pair.replaceChildren(wrap);
                    const range=wrap.querySelector('input'), after=wrap.querySelector('.ng-slide-after');
                    range.oninput=()=>after.style.width=range.value+'%';
                });
            }
        };

        // Iniciar calentamiento y mejorar el modo guiado.
        const _mostrarEjercicioOriginal = APP._mostrarEjercicio.bind(APP);
        APP._mostrarEjercicio = function() {
            if (idxEjercicioActual===0 && ejerciciosEntreno[0] && !NicoGymFinal._warmupPendiente && !this._warmupCompletadoOnce) {
                this._warmupCompletadoOnce=false;
                if (NicoGymFinal.añadirCalentamiento(ejerciciosEntreno[0])) return;
            }
            const result=_mostrarEjercicioOriginal();
            const ej=ejerciciosEntreno[idxEjercicioActual];
            if(ej && !ej.esCaminata){ NicoGymFinal.añadirRIR(); NicoGymFinal.añadirObjetivo(ej); }
            return result;
        };

        const _iniciarEntrenoOriginal = APP.iniciarEntreno.bind(APP);
        APP.iniciarEntreno = function(dia) {
            this._warmupCompletadoOnce=false;
            NicoGymFinal._warmupPendiente=false;
            const r=_iniciarEntrenoOriginal(dia);
            return r;
        };

        // Guardado enriquecido: RIR y 1RM estimado sin romper el historial existente.
        const _guardarEjercicioOriginal = APP._guardarEjercicio.bind(APP);
        APP._guardarEjercicio = function() {
            const ejActual=ejerciciosEntreno[idxEjercicioActual];
            const rirEl=document.getElementById('meRIR');
            const rir=rirEl ? Number(rirEl.value) : null;
            const nombre=ejActual?.nombre, hoy=UI.getHoy();
            const result=_guardarEjercicioOriginal();
            if(nombre){
                const ent=STATE.historialEntrenos.find(e=>e.fecha===hoy && e.dia===ejActual.dia);
                const reg=ent?.ejercicios?.find(e=>e.nombre===nombre);
                if(reg){
                    if(Number.isFinite(rir) && rir>=0 && rir<=5) reg.rir=rir;
                    const pr=parseReps(reg.reps); if(pr.valid){ reg.e1rm=Math.max(...pr.series.map(r=>NicoGymFinal.e1RM(reg.peso,r))); }
                    Storage._save();
                }
            }
            return result;
        };

        // Mejorar progreso: el ejercicio actual no cuenta como completado hasta guardarlo.
        const _mostrarOriginal2=APP._mostrarEjercicio;
        APP._mostrarEjercicio=function(){
            const total=ejerciciosEntreno.length;
            const completados=Math.min(idxEjercicioActual,total);
            document.getElementById('meProgresoFill').style.width=(total?Math.round((completados/total)*100):0)+'%';
            return _mostrarOriginal2.apply(this,arguments);
        };

        // Racha y progreso semanal coherentes en dashboard.
        const _dashboardOriginal=Dashboard.render.bind(Dashboard);
        Dashboard.render=function(){
            _dashboardOriginal();
            const c=document.getElementById('dashboardContainer');
            if(c){
                const last=c.querySelector('.ng-weekly'); if(!last) NicoGymFinal.añadirResumenDashboard();
            }
        };

        // Estadísticas convertidas en una pantalla de progreso útil.
        const _statsOriginal=Estadisticas.render.bind(Estadisticas);
        Estadisticas.render=function(){ _statsOriginal(); NicoGymFinal.añadirGraficos(); };

        // El comparador de fotos renderiza directamente las dos imágenes; no se aplica
        // una segunda capa que pueda ocultar o sustituir las imágenes originales.

        // Accesibilidad de modal.
        const _modalAbrir=Modal.abrir.bind(Modal);
        Modal.abrir=function(html){ _modalAbrir(html); const modal=document.getElementById('modalGlobal'); modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-label','Ventana de diálogo'); };
        document.querySelectorAll('.side-menu button, .nav-btn').forEach(b=>{ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label',b.textContent.trim()); });

        // Más seguridad para datos externos: validación antes de aplicar backups.
        const _migrateStateOriginal=migrateState;
        migrateState=function(state){
            if(!NicoGymFinal.validarEstado(state)) throw new Error('Estado de backup no válido');
            const clean=_migrateStateOriginal(state);
            clean.nombre=String(clean.nombre||'Nico').slice(0,80);
            if(Array.isArray(clean.diasEntrenados)) clean.diasEntrenados=[...new Set(clean.diasEntrenados.map(normalizarFechaLocal).filter(Boolean))].slice(-2000);
            if(Array.isArray(clean.diasNoFumar)) clean.diasNoFumar=[...new Set(clean.diasNoFumar.map(normalizarFechaLocal).filter(Boolean))].slice(-5000);
            if(Array.isArray(clean.historialEntrenos)) {
                clean.historialEntrenos=clean.historialEntrenos.slice(-2000).map(ent=>({
                    ...ent,
                    fecha: normalizarFechaLocal(ent.fecha),
                    ejercicios:Array.isArray(ent.ejercicios) ? ent.ejercicios.map(e=>({
                        ...e,
                        exerciseId:e.exerciseId || normalizarExerciseId(e.nombre)
                    })) : []
                })).filter(ent => ent.fecha);
            }
            if(Array.isArray(clean.records)) {
                clean.records=clean.records.slice(-500).map(r=>({
                    ...r,
                    exerciseId:r.exerciseId || normalizarExerciseId(r.exerciseName)
                }));
            }
            return clean;
        };

        // Mostrar errores graves de forma comprensible.
        window.addEventListener('error', e=>{ if(e?.error) console.error('NicoGym error:',e.error); });
        window.addEventListener('unhandledrejection', e=>{ console.error('NicoGym promise error:',e.reason); UI.toast('⚠️ NicoGym ha detectado un problema. Tus datos guardados no se han borrado.', 'error'); });

        NicoGymFinal.añadirPWA();

        // CSS de la capa final, manteniendo la identidad visual actual.
        const ngStyle=document.createElement('style'); ngStyle.textContent=`
            .ng-next-goal{margin:10px 0;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(128,0,32,.16),rgba(212,175,55,.08));border:1px solid var(--border);font-weight:600;font-size:12px}
            .ng-warmup{padding:28px 18px;text-align:center}.ng-warmup-icon{font-size:48px}.ng-warmup h3{margin:8px 0}.ng-warmup p,.ng-warmup-list{color:var(--text-secondary);font-size:13px;line-height:1.55}.ng-warmup-list{text-align:left;max-width:330px;margin:12px auto 18px}
            .ng-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ng-summary-grid>div{padding:10px 5px;text-align:center;background:rgba(255,255,255,.03);border-radius:9px}.ng-summary-grid b{display:block;font-size:17px}.ng-summary-grid span{display:block;font-size:10px;color:var(--text-secondary);margin-top:3px}.ng-chart-title{font-size:11px;font-weight:700;margin:8px 0 2px;color:var(--text-secondary)}.ng-svg{width:100%;height:auto;display:block;background:rgba(255,255,255,.02);border-radius:9px;color:var(--primary)}.ng-svg .axis{stroke:var(--border)}.ng-chart-note{font-size:10px;color:var(--text-secondary);margin-top:6px}.ng-bars rect{fill:currentColor}.ng-slider{position:relative;overflow:hidden;border-radius:9px;aspect-ratio:4/3;background:#111}.ng-slider img{width:100%;height:100%;object-fit:cover;display:block}.ng-slide-before,.ng-slide-after{position:absolute;inset:0}.ng-slide-after{width:50%;overflow:hidden;border-right:2px solid #fff}.ng-slide-after img{width:200%;max-width:none}.ng-slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}.ng-slide-handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;pointer-events:none}
            @media(min-width:900px){.ng-summary-grid{max-width:720px} }
        `; document.head.appendChild(ngStyle);

        window.addEventListener('error', e => console.error('NicoGym error:', e.error || e.message));
        window.addEventListener('unhandledrejection', e => console.error('NicoGym promise error:', e.reason));

        // ==========================================
        // INICIO
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
