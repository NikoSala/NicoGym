<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NicoGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --bg-card: #162033;
            --bg-card-hover: #1e2d4a;
            --primary: #3b82f6;
            --primary-dim: rgba(59, 130, 246, 0.12);
            --primary-glow: rgba(59, 130, 246, 0.30);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --transition: 0.25s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --space-xs: 6px;
            --space-sm: 12px;
            --space-md: 18px;
            --space-lg: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; max-width: 100%; height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: var(--radius-full); }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-xs { gap: var(--space-xs); }
        .gap-sm { gap: var(--space-sm); }
        .mt-xs { margin-top: var(--space-xs); }
        .mt-sm { margin-top: var(--space-sm); }
        .mt-md { margin-top: var(--space-md); }
        .mb-xs { margin-bottom: var(--space-xs); }
        .mb-sm { margin-bottom: var(--space-sm); }
        .mb-md { margin-bottom: var(--space-md); }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .text-primary { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .w-full { width: 100%; }
        img, video, canvas, iframe { max-width: 100%; }
        input, select, textarea, button { max-width: 100%; }
        .page, .top-bar, .bottom-nav { width: 100%; max-width: 100%; }
        .page { overflow-x: hidden; }

        /* ===== SKELETON LOADING ===== */
        .skeleton { background: rgba(255,255,255,0.04); border-radius: var(--radius-sm); animation: pulse 1.5s ease-in-out infinite; }
        .skeleton-text { height: 14px; width: 100%; border-radius: 4px; margin-bottom: 6px; }
        .skeleton-text.w70 { width: 70%; }
        .skeleton-text.w50 { width: 50%; }
        .skeleton-text.w40 { width: 40%; }
        .skeleton-card { height: 80px; border-radius: var(--radius); }
        .skeleton-stat { height: 60px; border-radius: var(--radius-sm); }
        .skeleton-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-screen .loader { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-screen .loader-text { margin-top: 12px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px;
            padding: 0 var(--space-sm); background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .top-bar .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar .top-left .logo-img {
            height: 32px;
            width: auto;
            display: block;
            object-fit: contain;
        }
        .top-bar .top-left .logo-text {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-bar .top-left .logo-text i {
            -webkit-text-fill-color: initial;
            color: var(--primary);
            margin-right: 4px;
        }
        .top-right { display: flex; align-items: center; gap: 8px; }
        .top-stats { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 500; background: var(--bg-card); padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid var(--border); color: var(--text-secondary); }
        .top-stats strong { color: var(--text); }

        .bell-wrap { position: relative; cursor: pointer; padding: 4px; border-radius: 50%; transition: var(--transition); background: transparent; border: none; color: var(--text-secondary); font-size: 16px; }
        .bell-wrap:hover { background: var(--bg-card); color: var(--text); }
        .bell-wrap .badge { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); }

        .notif-dropdown {
            position: absolute; top: calc(100% + 6px); right: -8px; width: 280px; max-height: 340px;
            overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px 0; box-shadow: var(--shadow); display: none; z-index: 1100;
        }
        .notif-dropdown.open { display: block; }
        .notif-dropdown .notif-header { padding: 0 var(--space-sm) 8px var(--space-sm); font-weight: 600; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .notif-item { display: flex; align-items: center; gap: 8px; padding: 6px var(--space-sm); font-size: 12px; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: rgba(255,255,255,0.03); }
        .notif-item .ni-icon { font-size: 16px; flex-shrink: 0; }
        .notif-item .ni-text { flex: 1; }
        .notif-empty { padding: 16px var(--space-sm); text-align: center; color: var(--text-secondary); font-size: 12px; }

        .side-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .side-overlay.open { opacity: 1; pointer-events: auto; }
        .side-menu {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--bg-card); border-right: 1px solid var(--border); z-index: 1001;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 60px var(--space-sm) var(--space-md); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
        }
        .side-menu.open { left: 0; }
        .side-menu .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); border: none; background: transparent; width: 100%; text-align: left; }
        .side-menu .menu-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .side-menu .menu-item.active { background: var(--primary-dim); color: var(--primary); }
        .side-menu .menu-item i { width: 20px; font-size: 14px; text-align: center; flex-shrink: 0; }
        .side-menu .menu-divider { height: 1px; background: var(--border); margin: 6px 12px; }
        .side-menu .menu-footer { margin-top: auto; padding-top: 10px; font-size: 10px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; height: 54px;
            background: rgba(11, 17, 32, 0.94); backdrop-filter: blur(14px) saturate(1.4);
            border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 4px;
        }
        .bottom-nav .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 0px; background: none; border: none; color: var(--text-secondary); font-size: 8px; font-weight: 500; padding: 2px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); text-transform: uppercase; letter-spacing: 0.3px; }
        .bottom-nav .nav-btn i { font-size: 16px; transition: var(--transition); }
        .bottom-nav .nav-btn.active { color: var(--primary); }
        .bottom-nav .nav-btn.active i { transform: translateY(-1px); }
        .bottom-nav .nav-btn:active { transform: scale(0.96); }

        .page { display: none; padding: 60px var(--space-sm) 66px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        .page.active { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: var(--space-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .card:hover { border-color: rgba(255,255,255,0.10); }
        .card-accent { border-left: 3px solid var(--primary); background: linear-gradient(135deg, var(--primary-dim), rgba(59,130,246,0.02)); }
        .card-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); margin-bottom: 8px; }
        .card-title i { margin-right: 4px; color: var(--primary); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            padding: 6px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px;
            border: none; cursor: pointer; text-decoration: none;
            font-family: var(--font); background: var(--bg-card); color: var(--text);
            border: 1px solid var(--border); height: 34px; min-height: 34px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #000; border-color: var(--success); }
        .btn-success:hover { box-shadow: 0 0 20px rgba(34,197,94,0.25); transform: translateY(-1px); }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(239,68,68,0.08); }
        .btn-sm { padding: 3px 12px; font-size: 10px; height: 26px; min-height: 26px; }
        .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { border-color: var(--text-secondary); color: var(--text); }
        .btn-block { width: 100%; justify-content: center; }

        .input {
            width: 100%; padding: 6px 10px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: rgba(0,0,0,0.2);
            color: var(--text); font-size: 13px; font-family: var(--font);
            outline: none; transition: var(--transition);
        }
        .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
        .input-sm { padding: 4px 8px; font-size: 11px; }

        .saludo { font-size: 22px; font-weight: 700; margin-bottom: 2px; letter-spacing: -0.5px; }
        .saludo span { color: var(--primary); }
        .saludo-dia { font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-md); }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
        .dash-stat { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
        .dash-stat .num { font-size: 22px; font-weight: 700; }
        .dash-stat .num.green { color: var(--success); }
        .dash-stat .num.primary { color: var(--primary); }
        .dash-stat .num.orange { color: var(--warning); }
        .dash-stat .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

        .pending-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .pending-item:last-child { border-bottom: none; }
        .pending-item .pi-icon { font-size: 16px; }

        .day-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .day-tabs .dtab {
            flex-shrink: 0;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            min-width: 60px;
            text-align: center;
        }
        .day-tabs .dtab:hover { border-color: var(--text-secondary); color: var(--text); }
        .day-tabs .dtab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .day-tabs .dtab.completado { border-color: var(--success); color: var(--success); }
        .day-tabs .dtab.descanso { opacity: 0.4; cursor: default; }
        .day-tabs .dtab.descanso:hover { border-color: var(--border); color: var(--text-secondary); }

        .dia-panel { display: none; }
        .dia-panel.active { display: block; animation: fadeUp 0.3s ease; }

        .ex-grid { display: flex; flex-direction: column; gap: 8px; }
        .ex-card { background: var(--bg-card); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; transition: var(--transition); }
        .ex-card.checked { opacity: 0.5; }
        .ex-card.checked .ex-name { text-decoration: line-through; }
        .ex-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(59,130,246,0.04); }
        .ex-name { font-weight: 600; font-size: 13px; }
        .ex-grupo { font-size: 9px; color: var(--text-secondary); margin-left: 6px; background: rgba(255,255,255,0.05); padding: 1px 8px; border-radius: var(--radius-full); }
        .ex-body { padding: 10px 12px; }
        .check-box { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }

        .ex-tog { width: 100%; padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 11px; font-weight: 500; cursor: pointer; transition: var(--transition); }
        .ex-tog:hover { border-color: var(--text-secondary); }
        .ex-det { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
        .ex-det.open { display: block; }
        .ex-img { width: 100%; max-height: 120px; object-fit: cover; border-radius: var(--radius-sm); display: block; margin: 0 auto 6px; cursor: pointer; background: rgba(0,0,0,0.3); }
        .ex-img-fallback { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); margin: 0 auto 6px; background: var(--primary-dim); color: var(--primary); font-size: 28px; border: 1px solid var(--border); }

        .ex-ultimo { font-size: 11px; color: var(--text-secondary); margin-top: 6px; text-align: center; }
        .ultimo-entreno { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: var(--radius-sm); margin-top: 6px; font-size: 11px; background: rgba(255,255,255,0.03); }
        .mejor-marca { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: var(--radius-sm); margin-top: 3px; font-size: 11px; background: var(--primary-dim); border: 1px solid rgba(59,130,246,0.15); }
        .mejor-marca .mm-valor { font-weight: 700; color: var(--primary); }

        .btn-historial-ej { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-full); padding: 1px 10px; font-size: 9px; color: var(--text-secondary); cursor: pointer; margin-top: 4px; transition: var(--transition); }
        .btn-historial-ej:hover { border-color: var(--text-secondary); color: var(--text); }

        .progreso-rutina-bar { background: var(--bg-card); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .progreso-rutina-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
        .progreso-rutina-track { height: 4px; background: rgba(255,255,255,0.06); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .progreso-rutina-fill { height: 100%; background: var(--primary); border-radius: 3px; }
        .progreso-rutina-info { font-size: 11px; color: var(--text-secondary); margin-top: 3px; text-align: right; }
        .progreso-rutina-completado { text-align: center; color: var(--success); font-weight: 600; font-size: 13px; }

        .peso-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-xs); }
        .peso-stat { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
        .peso-stat .num { font-size: 22px; font-weight: 700; }
        .peso-stat .num.green { color: var(--success); }
        .peso-stat .num.primary { color: var(--primary); }
        .peso-stat .num.orange { color: var(--warning); }
        .peso-stat .label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .historial-medicion-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .historial-medicion-card:hover { border-color: var(--primary); }
        .historial-medicion-card .med-fecha { font-weight: 600; font-size: 13px; }
        .historial-medicion-card .med-resumen { display: flex; gap: 10px; margin-top: 3px; font-size: 12px; flex-wrap: wrap; }
        .historial-medicion-card .med-resumen .med-item { display: flex; align-items: center; gap: 3px; }
        .historial-medicion-card .med-resumen .med-item .valor { font-weight: 600; color: var(--primary); }
        .historial-medicion-card .med-resumen .positive { color: var(--success); }
        .historial-medicion-card .med-resumen .negative { color: var(--danger); }

        .historial-medicion-detalle { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
        .historial-medicion-detalle.open { display: block; }
        .historial-medicion-detalle .detalle-item { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .historial-medicion-detalle .detalle-item:last-child { border-bottom: none; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-xs); }
        .stats-item { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
        .stats-item .num { font-size: 20px; font-weight: 700; }
        .stats-item .num.green { color: var(--success); }
        .stats-item .num.orange { color: var(--warning); }
        .stats-item .num.primary { color: var(--primary); }
        .stats-item .num.info { color: var(--secondary); }
        .stats-item .label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .record-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--border); border-left: 3px solid var(--primary); }
        .record-card .record-name { font-weight: 600; font-size: 13px; }
        .record-card .record-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin: 4px 0; }
        .record-card .record-stats .rs-item { text-align: center; }
        .record-card .record-stats .rs-item .rs-label { font-size: 8px; color: var(--text-secondary); text-transform: uppercase; }
        .record-card .record-stats .rs-item .rs-value { font-weight: 700; font-size: 14px; color: var(--primary); }
        .record-card .record-date { font-size: 10px; color: var(--text-secondary); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-panel {
            background: var(--bg-card); border-radius: var(--radius); padding: 16px;
            max-width: 400px; width: 100%; max-height: 85vh; overflow-y: auto;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-panel .modal-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 3px; transition: var(--transition); }
        .modal-panel .modal-close:hover { color: var(--text); }
        .modal-panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .modal-panel .modal-img { width: 100%; border-radius: var(--radius-sm); object-fit: cover; max-height: 150px; margin-bottom: 8px; background: rgba(0,0,0,0.2); }
        .modal-panel .modal-field { margin-bottom: 8px; }

        // ==========================================
        // FUNCIONES AUX
        // ==========================================
        function getEjercicioPorNombre(nombre) {
            return getExerciseDatabase().find(e => e.nombre === nombre);
        }

        function getEjerciciosPorDia(dia) {
            return getExerciseDatabase().filter(e => e.dia === dia);
        }

        function getDificultadColor(dificultad) {
            const map = { 'facil': '🟢', 'media': '🟡', 'dificil': '🔴' };
            return map[dificultad] || '🟡';
        }

        function getDificultadTexto(dificultad) {
            const map = { 'facil': 'Fácil', 'media': 'Media', 'dificil': 'Difícil' };
            return map[dificultad] || 'Media';
        }

        function calcularDuracionEstimada(ejercicios) {
            let total = 0;
            ejercicios.forEach(ej => {
                total += (ej.series || 0) * 0.5 + (ej.descanso || 60) / 60;
            });
            return Math.round(total);
        }

        function getProximoDomingo(desde, cadaSemanas) {
            const d = new Date(desde);
            const hoy = new Date();
            while (d <= hoy) d.setDate(d.getDate() + 7 * cadaSemanas);
            while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
            return d;
        }

        function getDiasHasta(fecha) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            return Math.round((fecha - hoy) / 86400000);
        }

        // ==========================================
        // FUNCIONES CALENDARIO DEFINITIVO
        // ==========================================
        function getTipoActualizacion(fecha) {
            const d = typeof fecha === 'string' ? new Date(fecha + 'T00:00:00') : new Date(fecha);
            d.setHours(0, 0, 0, 0);

            if (d.getDay() !== 0) return null;

            const inicio = new Date(CONFIG.FECHA_INICIO_CALENDARIO + 'T00:00:00');
            inicio.setHours(0, 0, 0, 0);

            const diffTime = d.getTime() - inicio.getTime();
            if (diffTime < 0) return null;

            const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));

            const esFotos = diffWeeks % 4 === 0;
            const esMediciones = diffWeeks % 2 === 0;

            if (esFotos) return 'completa';
            if (esMediciones) return 'mediciones';
            return 'solo-peso';
        }

        function getProximaActualizacion() {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            let d = new Date(hoy);
            while (d.getDay() !== 0) {
                d.setDate(d.getDate() + 1);
            }

            const inicio = new Date(CONFIG.FECHA_INICIO_CALENDARIO + 'T00:00:00');
            inicio.setHours(0, 0, 0, 0);

            if (d.getTime() < inicio.getTime()) {
                d = new Date(inicio);
            }

            return d;
        }

        // ==========================================
        // STORAGE
        // ==========================================
        const Storage = {
            init() {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    Object.assign(STATE, d);
                    if (!STATE.recordatorios) STATE.recordatorios = { freqMediciones: 2, freqFotos: 4,
                            ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES, ultimasFotos: null,
                            ultimoPeso: null };
                    if (!STATE.records) STATE.records = [];
                    if (!STATE.evolution) STATE.evolution = { initialWeight: 0, currentWeight: 0, initialWaist: 0,
                            currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0 };
                    if (!STATE.ajustes) STATE.ajustes = {};
                    if (!STATE.config) STATE.config = { temporizadorDescanso: false };
                    if (!STATE.ultimoRegistroPeso) STATE.ultimoRegistroPeso = null;
                    if (!STATE.ultimasMediciones) STATE.ultimasMediciones = null;
                    if (!STATE.ultimasFotosGuardadas) STATE.ultimasFotosGuardadas = null;
                }
                // Si no hay configuración guardada, establecer temporizador en false
                if (STATE.config && STATE.config.temporizadorDescanso === undefined) {
                    STATE.config.temporizadorDescanso = false;
                }
                this._calcularDiasSinFumar();
                this._save();
                return this;
            },
            _calcularDiasSinFumar() {
                let c = 0;
                const f = new Date(CONFIG.FECHA_INICIO_NO_FUMAR);
                const h = new Date();
                while (f <= h) {
                    if (!STATE.diasNoFumar.includes(UI.formatFecha(f))) c++;
                    f.setDate(f.getDate() + 1);
                }
                STATE.evolution.daysWithoutSmoking = c;
            },
            _save() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE)); },
            resetearSemana() {
                const hoy = new Date();
                const diaSemana = hoy.getDay();
                const semanaActual = this._getSemanaKey(hoy);
                const ultimaSemana = localStorage.getItem('ultimaSemana');
                if (diaSemana === 1 && ultimaSemana !== semanaActual) {
                    STATE.checks = {};
                    localStorage.setItem('ultimaSemana', semanaActual);
                    this._save();
                    return true;
                }
                return false;
            },
            _getSemanaKey(fecha) {
                const d = new Date(fecha);
                d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
                const year = d.getFullYear();
                const week = Math.ceil((((d - new Date(year, 0, 1)) / 86400000) + 1) / 7);
                return `${year}-W${String(week).padStart(2, '0')}`;
            },
            resetAll() { localStorage.removeItem(CONFIG.STORAGE_KEY);
                location.reload(); },
            async exportar() {
                try {
                    // Las fotos de progreso viven en IndexedDB, no en STATE. Se
                    // añaden al JSON solo para el backup y no al localStorage.
                    const fotosProgreso = await Fotos.exportarBackup();
                    const backup = {
                        ...STATE,
                        fotosProgreso: { version: 1, diasFotos: fotosProgreso }
                    };
                    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    a.href = url;
                    a.download = 'nicogym_backup.json';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 0);
                    UI.toast('✅ Datos exportados', 'success');
                } catch (err) {
                    console.error('Error al exportar las fotos:', err);
                    UI.toast('❌ Error al exportar las fotos', 'error');
                }
            },
            // IMPORTAR - función conectada correctamente
            importar(file) {
                if (!file) {
                    UI.toast('❌ No se seleccionó ningún archivo', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const datos = JSON.parse(e.target.result);
                        if (!datos || typeof datos !== 'object' || Array.isArray(datos)) {
                            throw new Error('Formato de backup no válido');
                        }
                        // Los backups antiguos no tienen fotosProgreso. En ese
                        // caso se conserva IndexedDB tal como estaba.
                        const fotosProgreso = Array.isArray(datos.fotosProgreso?.diasFotos)
                            ? datos.fotosProgreso.diasFotos : null;
                        const datosEstado = { ...datos };
                        delete datosEstado.fotosProgreso;
                        Object.assign(STATE, datosEstado);

                        // Compatibilidad con backups anteriores: conservar valores
                        // predeterminados si alguna sección no existe en el backup.
                        if (!STATE.recordatorios) STATE.recordatorios = {
                            freqMediciones: 2, freqFotos: 4,
                            ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES,
                            ultimasFotos: null, ultimoPeso: null
                        };
                        if (!STATE.records) STATE.records = [];
                        if (!STATE.evolution) STATE.evolution = {
                            initialWeight: 0, currentWeight: 0, initialWaist: 0,
                            currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0
                        };
                        if (!STATE.ajustes) STATE.ajustes = {};
                        if (!STATE.config) STATE.config = { temporizadorDescanso: false };
                        if (STATE.config.temporizadorDescanso === undefined) {
                            STATE.config.temporizadorDescanso = false;
                        }
                        if (!STATE.ultimoRegistroPeso) STATE.ultimoRegistroPeso = null;
                        if (!STATE.ultimasMediciones) STATE.ultimasMediciones = null;
                        if (!STATE.ultimasFotosGuardadas) STATE.ultimasFotosGuardadas = null;

                        CONFIG.TEMPORIZADOR_DESCANSO = STATE.config.temporizadorDescanso === true;
                        if (fotosProgreso !== null) {
                            await Fotos.restaurarBackup(fotosProgreso);
                        }
                        this._save();
                        UI.toast('✅ Datos importados correctamente', 'success');
                        APP.renderizarTodo();
                    } catch (err) {
                        UI.toast('❌ Error al importar: formato inválido', 'error');
                        console.error('Error al importar:', err);
                    }
                };
                reader.onerror = () => {
                    UI.toast('❌ Error al leer el archivo', 'error');
                };
                reader.readAsText(file);
            }
        };

            getHoy() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            formatFecha(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            formatearFecha(fecha) { return new Date(fecha).toLocaleDateString('es-ES', { day: 'numeric',
                    month: 'short' }); },
            getDiaNombre() {
                const mapa = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes',
                    6: 'sabado' };
                return mapa[new Date().getDay()] || 'lunes';

            getDiaSemanaNombre(d) { return CONFIG.DIAS_SEMANA[d.getDay()] || ''; },
            actualizarTopBar() {
                const p = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';

        // ==========================================
        // MODAL
        // ==========================================
        const Modal = {

                document.getElementById('modalGlobalContent').innerHTML = html;

                document.getElementById('modalGlobal').classList.add('hidden');
            }

        // ==========================================
        // RECORDS
        // ==========================================
        const Records = {
            getRecord(name) { return STATE.records.find(r => r.exerciseName === name); },
            actualizar(name, weight, reps, date) {
                const current = this.getRecord(name);
                if (!current || weight > current.weight || (weight === current.weight && reps > current.reps)) {
                    STATE.records = STATE.records.filter(r => r.exerciseName !== name);
                    STATE.records.push({ exerciseName: name, weight, reps, date });
                    Storage._save();
                    return true;
                }
                return false;
            },
            render() {
                const c = document.getElementById('recordsContainer');
                if (!c) return;
                if (STATE.records.length === 0) {
                    c.innerHTML =
                        `<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">
                            <i class="fa-solid fa-trophy" style="font-size:36px;display:block;margin-bottom:8px;color:var(--text-muted);"></i>
                            <p style="font-size:13px;">Aún no has batido ningún récord</p>
                        </div></div>`;
                    return;
                }
                const sorted = [...STATE.records].sort((a, b) => b.weight - a.weight);
                c.innerHTML = sorted.map(r => `
                    <div class="record-card">
                        <div class="record-name">${r.exerciseName}</div>
                        <div class="record-stats">
                            <div class="rs-item"><div class="rs-label">Peso</div><div class="rs-value">${r.weight} kg</div></div>
                            <div class="rs-item"><div class="rs-label">Reps</div><div class="rs-value">${r.reps}</div></div>
                            <div class="rs-item"><div class="rs-label">Volumen</div><div class="rs-value">${r.weight * r.reps} kg</div></div>
                        </div>
                        <div class="record-date">${r.date}</div>
                    </div>
                `).join('');
            }
        };

        // ==========================================
        // APP
        // ==========================================
        const APP = {
            init() {
                const loading = document.getElementById('loadingScreen');
                loading.style.display = 'flex';

                Storage.init();
                const reset = Storage.resetearSemana();
                if (reset) UI.toast('🔄 Nueva semana. ¡A marcar los ejercicios!', 'success');

                this._cargarAjustesBasicos();
                this._renderDashboardInicial();

                setTimeout(() => {
                    loading.classList.add('fade-out');
                    setTimeout(() => { loading.style.display = 'none'; }, 500);
                }, 300);

                setTimeout(() => {
                    this._cargarDatosCompletos();
                }, 100);

                document.addEventListener('click', (e) => {
                    const bell = document.getElementById('bellWrap');
                    const drop = document.getElementById('notifDropdown');
                    if (bell && drop && !bell.contains(e.target)) drop.classList.remove('open');
                });

                return this;
            },

            _cargarAjustesBasicos() {
                const a = STATE.ajustes || {};
                if (a.nombre) STATE.nombre = a.nombre;
                if (a.altura) STATE.altura = a.altura;
                if (a.objetivo) CONFIG.PESO_OBJETIVO = a.objetivo;
                // Cargar preferencia del temporizador: si no existe, false por defecto
                if (STATE.config && STATE.config.temporizadorDescanso !== undefined) {
                    CONFIG.TEMPORIZADOR_DESCANSO = STATE.config.temporizadorDescanso;
                } else {
                    CONFIG.TEMPORIZADOR_DESCANSO = false;
                    if (STATE.config) STATE.config.temporizadorDescanso = false;
                }
                const dia = UI.getDiaNombre();
                diaActivo = dia === 'domingo' ? 'lunes' : dia;
            },

            _renderDashboardInicial() {
                UI.actualizarTopBar();
                Dashboard.render();
                Notificaciones.render();
            },

            _cargarDatosCompletos() {
                if (STATE.mediciones.length > 0) {
                    STATE.evolution.initialWeight = STATE.mediciones[0].peso;
                    STATE.evolution.currentWeight = STATE.mediciones[STATE.mediciones.length - 1].peso;
                    STATE.evolution.initialWaist = STATE.mediciones[0].cintura;
                    STATE.evolution.currentWaist = STATE.mediciones[STATE.mediciones.length - 1].cintura;
                    STATE.evolution.totalWorkouts = STATE.diasEntrenados.length || 0;
                }
                Storage._save();
                Dashboard.render();
                STATE._cargado = true;
            },

            renderizarTodo() {
                UI.actualizarTopBar();
                Dashboard.render();
            },

            navegar(id) {
                if (modoEntrenoActivo) {
                    UI.toast('⚠️ Termina el entrenamiento primero', 'error');
                    return;
                }

                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const page = document.getElementById(`page-${id}`);
                if (page) page.classList.add('active');

                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                const map = { 'inicio': 0, 'rutinas': 1, 'semana': 2, 'peso': 3, 'estadisticas': 4 };
                const btns = document.querySelectorAll('.nav-btn');
                if (map[id] !== undefined && btns[map[id]]) btns[map[id]].classList.add('active');

                document.querySelectorAll('.side-menu .menu-item').forEach(m => m.classList.remove('active'));
                document.querySelectorAll('.side-menu .menu-item').forEach(m => {
                    const txt = m.textContent.trim().toLowerCase();
                    if (txt.includes(id) || (id === 'estadisticas' && txt.includes('estadísticas')) ||
                        (id === 'peso' && txt.includes('peso')) || (id === 'fotos' && txt.includes('fotos')) ||
                        (id === 'semana' && txt.includes('rutina'))) {
                        m.classList.add('active');
                    }
                });

                if (document.getElementById('sideMenu').classList.contains('open')) UI.toggleMenu();
                window.scrollTo(0, 0);

                switch (id) {
                    case 'rutinas':
                        Rutinas.render();
                        break;
                    case 'semana':
                        Semana.render();
                        break;
                    case 'peso':
                        Peso.render();
                        break;
                    case 'agenda':
                        Agenda.render();
                        break;
                    case 'records':
                        Records.render();
                        break;
                    case 'estadisticas':
                        Estadisticas.render();
                        break;
                    case 'fotos':
                        Fotos.render();
                        break;
                    case 'ajustes':
                        Ajustes.render();
                        break;
                    case 'inicio':
                    default:
                        Dashboard.render();
                        break;
                }
            },

            confirmarReset() { UI.confirmar('¿Borrar TODOS los datos? No se puede deshacer.', () => Storage
                    .resetAll()); },

            // ==========================================
            // CALENDARIO DE ACTUALIZACIONES
            // ==========================================
            obtenerTipoActualizacion() {
                const hoy = new Date();
                return getTipoActualizacion(hoy);
            },

            obtenerProximaActualizacion() {
                return getProximaActualizacion();
            },

            // ==========================================
            // MODO ENTRENO GUIADO
            // ==========================================
            iniciarEntreno(dia) {
                const ejercicios = getEjerciciosPorDia(dia);
                if (ejercicios.length === 0) {
                    UI.toast('No hay ejercicios para este día', 'error');
                    return;
                }
                if (STATE.diasEntrenados.includes(UI.getHoy())) {
                    UI.toast('✅ Este entrenamiento ya fue completado hoy', 'success');
                    return;
                }
                if (['miercoles', 'sabado', 'domingo'].includes(dia)) {
                    UI.toast('🚶 Este día no tiene entrenamiento guiado', 'info');
                    return;
                }

                modoEntrenoActivo = true;
                ejerciciosEntreno = ejercicios.map(e => ({ ...e }));
                idxEjercicioActual = 0;
                recordsConseguidos = [];
                startTimeEntreno = Date.now();
                totalPesoLevantadoEntreno = 0;
                totalVolumenEntreno = 0;
                totalSeriesEntreno = 0;
                totalRepsEntreno = 0;

                document.getElementById('modoEntreno').classList.add('open');

            },

            _mostrarEjercicio() {
                if (idxEjercicioActual >= ejerciciosEntreno.length) {

                }

                document.getElementById('meProgresoInfo').textContent = `${progreso}%`;

                const ultimo = this._getUltimoEntreno(ej.nombre);
                const record = Records.getRecord(ej.nombre);

                const body = document.getElementById('meBody');

                            </div>
                        ` : `
                            <div class="me-ej-img-fallback">💪</div>
                        `}
                        <div class="me-ej-descripcion">${ej.descripcion}</div>
                        <div class="me-ej-dificultad">
                            <span class="dif-label">Dificultad</span>
                            ${dificultadColor} ${dificultadTexto}
                        </div>
                        ${ej.material && ej.material.length > 0 ? `
                            <div class="me-ej-material">
                                ${ej.material.map(m => `<span class="mat-tag">✔ ${m}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${Object.keys(intensidad).length > 0 ? `
                            <div class="me-ej-musculos">
                                ${Object.entries(intensidad).map(([musculo, valor]) => `

                                        <span class="musc-name">${musculo}</span>
                                        <div class="musc-bar">
                                            <div class="musc-fill" style="width:${Math.min(valor, 100)}%;"></div>
                                        </div>
                                    </div>
                                `).join('')}

                        ` : ''}
                        ${ej.consejos ? `

                                <div class="me-ej-consejo-titulo">💡 Consejos</div>
                                <div class="me-ej-consejo-texto">${ej.consejos.split('\n').filter(c => c.trim()).map(c => '• ' + c.trim()).join('<br>')}</div>
                            </div>
                        ` : ''}
                        ${ej.errores ? `
                            <div class="me-ej-errores">
                                <div class="me-ej-error-titulo">❌ Evita</div>
                                <div class="me-ej-error-texto">${ej.errores.split('\n').filter(e => e.trim()).map(e => '• ' + e.trim()).join('<br>')}</div>
                            </div>
                        ` : ''}
                        <div class="me-ej-datos">
                            <span>🎯 ${ej.series} × ${ej.reps}</span>
                            <span>⏱ ${ej.descanso}s descanso</span>
                        </div>
                        ${ultimo ? `<div class="me-ej-ultimo">Último: <strong>${ultimo.peso} kg</strong> · ${ultimo.reps} (${UI.formatearFecha(ultimo.fecha)})</div>` : ''}
                        ${record ? `<div class="me-ej-record">🏆 Récord: <strong>${record.weight} kg × ${record.reps}</strong></div>` : ''}
                        <div class="me-ej-inputs">
                            <div class="me-input-group">
                                <label>Peso (kg)</label>
                                <input type="number" id="mePeso" step="0.5" value="${ultimo ? ultimo.peso : ''}" placeholder="0">
                            </div>
                            <div class="me-input-group">
                                <label>Repeticiones (ej: 10,10,9,8)</label>
                                <input type="text" id="meReps" placeholder="10,10,9,8" value="${ultimo ? ultimo.reps : ''}">
                            </div>
                            <div class="me-input-group">
                                <label>Notas</label>
                                <textarea id="meNotas" placeholder="Comentarios..." rows="2"></textarea>
                            </div>
                        </div>
                        <div class="me-ej-botones">
                            <button class="btn btn-success" onclick="APP._guardarEjercicio()"><i class="fa-solid fa-check"></i> Guardar ejercicio</button>

                `;

                body.innerHTML = html;
                document.getElementById('modoEntreno').scrollTop = 0;
            },

            _guardarEjercicio() {
                const ej = ejerciciosEntreno[idxEjercicioActual];
                const peso = parseFloat(document.getElementById('mePeso').value);
                const reps = document.getElementById('meReps').value.trim() || '-';
                const notas = document.getElementById('meNotas').value.trim() || '';

                if (!peso || peso === 0) {
                    UI.toast('Introduce un peso válido', 'error');
                    return;
                }

                const repsNum = reps.split(',').map(Number).reduce((a, b) => a + b, 0) || 0;
                const seriesNum = reps.split(',').length || 0;

                totalPesoLevantadoEntreno += peso;
                totalVolumenEntreno += peso * repsNum;
                totalSeriesEntreno += seriesNum;
                totalRepsEntreno += repsNum;

                const hoy = UI.getHoy();
                const dia = ej.dia;
                let entrenamientoExistente = STATE.historialEntrenos.find(e => e.fecha === hoy && e.dia === dia);

                const registroEjercicio = {
                    nombre: ej.nombre,
                    peso: peso,
                    reps: reps,
                    tipo: 'mancuerna',
                    discos: {},
                    notas: notas,
                    series: seriesNum,
                    repsTotales: repsNum
                };

                if (entrenamientoExistente) {
                    const ejExistente = entrenamientoExistente.ejercicios.find(e => e.nombre === ej.nombre);
                    if (ejExistente) Object.assign(ejExistente, registroEjercicio);
                    else entrenamientoExistente.ejercicios.push(registroEjercicio);
                } else {
                    STATE.historialEntrenos.push({
                        fecha: hoy,
                        dia: dia,
                        tipo: CONFIG.TIPOS_RUTINA[dia] || dia.toUpperCase(),
                        ejercicios: [registroEjercicio]
                    });
                }

                if (peso > 0 && repsNum > 0) {
                    const date = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit',
                        year: 'numeric' });
                    if (Records.actualizar(ej.nombre, peso, repsNum, date)) {
                        recordsConseguidos.push(ej.nombre);
                        UI.toast('🏆 ¡Nuevo récord!', 'success');
                    }
                }

                const ejerciciosDia = getEjerciciosPorDia(dia);
                const idxEjercicio = ejerciciosDia.findIndex(e => e.nombre === ej.nombre);
                if (idxEjercicio >= 0) {
                    const id = `${dia}-${idxEjercicio}`;
                    if (!STATE.checks[id]) STATE.checks[id] = true;
                }

                Storage._save();

                this._mostrarMensajeCompletado(ej.nombre);

                idxEjercicioActual++;
                if (idxEjercicioActual >= ejerciciosEntreno.length) {
                    setTimeout(() => this._finalizarEntreno(), CONFIG.TIEMPO_MSG_COMPLETADO + 300);
                } else if (CONFIG.TEMPORIZADOR_DESCANSO) {
                    setTimeout(() => this._mostrarDescanso(), CONFIG.TIEMPO_MSG_COMPLETADO);
                } else {
                    setTimeout(() => this._mostrarEjercicio(), CONFIG.TIEMPO_MSG_COMPLETADO);
                }
            },

            _mostrarMensajeCompletado(nombre) {
                const msg = document.getElementById('meCompletadoMsg');
                msg.textContent = `✔ ${nombre} completado`;
                msg.classList.remove('hidden');
                if (msgCompletadoTimeout) clearTimeout(msgCompletadoTimeout);
            },

            _mostrarDescanso() {
                const ej = ejerciciosEntreno[idxEjercicioActual];
                const descanso = ej.descanso || 60;
                tiempoDescanso = descanso;

                const body = document.getElementById('meBody');
                body.innerHTML = `
                    <div class="me-descanso">
                        <div style="font-size:22px;margin-bottom:6px;">⏱️</div>
                        <div class="me-timer" id="meTimer">${tiempoDescanso}</div>
                        <div class="me-timer-label">Descanso antes del siguiente ejercicio</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;">Próximo: ${ej.nombre}</div>
                        <button class="btn btn-primary me-siguiente" onclick="APP._saltarDescanso()">
                            <i class="fa-solid fa-forward"></i> Saltar descanso
                        </button>
                    </div>
                `;

                if (temporizadorDescanso) clearInterval(temporizadorDescanso);
                temporizadorDescanso = setInterval(() => {
                    tiempoDescanso--;
                    const el = document.getElementById('meTimer');
                    if (el) el.textContent = tiempoDescanso;
                    if (tiempoDescanso <= 0) {
                        clearInterval(temporizadorDescanso);
                        temporizadorDescanso = null;
                        document.getElementById('meCompletadoMsg').classList.add('hidden');
                        APP._mostrarEjercicio();
                    }
                }, 1000);
            },

            _saltarDescanso() {
                if (temporizadorDescanso) {
                    clearInterval(temporizadorDescanso);
                    temporizadorDescanso = null;
                }
                document.getElementById('meCompletadoMsg').classList.add('hidden');
                this._mostrarEjercicio();
            },

            _finalizarEntreno() {
                if (temporizadorDescanso) {
                    clearInterval(temporizadorDescanso);
                    temporizadorDescanso = null;
                }
                if (msgCompletadoTimeout) clearTimeout(msgCompletadoTimeout);

                const tiempoEmpleado = Math.round((Date.now() - startTimeEntreno) / 60000);
                const dia = ejerciciosEntreno[0]?.dia || '';

                const hoyStr = UI.getHoy();
                if (!STATE.diasEntrenados.includes(hoyStr)) {
                    STATE.diasEntrenados.push(hoyStr);
                    Storage._save();
                }

                const body = document.getElementById('meBody');
                body.innerHTML = `
                    <div class="me-completado-final">
                        <div class="me-feliz">🏆</div>
                        <div class="me-titulo">¡Entrenamiento completado!</div>
                        <div class="me-sub">${CONFIG.NOMBRES_DIAS[dia]} · ${tiempoEmpleado} minutos</div>
                        <div class="me-resumen-grid">
                            <div class="me-res-item">
                                <div class="me-res-valor">${ejerciciosEntreno.length}</div>
                                <div class="me-res-label">Ejercicios</div>
                            </div>
                            <div class="me-res-item">
                                <div class="me-res-valor">${totalSeriesEntreno}</div>
                                <div class="me-res-label">Series</div>
                            </div>
                            <div class="me-res-item">
                                <div class="me-res-valor">${totalRepsEntreno}</div>
                                <div class="me-res-label">Repeticiones</div>
                            </div>
                            <div class="me-res-item">
                                <div class="me-res-valor">${totalPesoLevantadoEntreno.toFixed(1)}</div>
                                <div class="me-res-label">Peso total</div>
                            </div>
                            <div class="me-res-item">
                                <div class="me-res-valor">${totalVolumenEntreno}</div>
                                <div class="me-res-label">Volumen (kg)</div>
                            </div>
                            <div class="me-res-item">
                                <div class="me-res-valor">${recordsConseguidos.length}</div>
                                <div class="me-res-label">Récords</div>
                            </div>
                        </div>
                        ${recordsConseguidos.length > 0 ? `
                            <div class="me-records">
                                <div class="me-rec-titulo">🏆 Nuevos récords</div>
                                <div class="me-rec-item">${recordsConseguidos.join(', ')}</div>
                            </div>
                        ` : ''}
                        <button class="btn btn-primary btn-block" onclick="APP._salirEntreno()" style="margin-top:10px;">
                            <i class="fa-solid fa-check"></i> Finalizar entrenamiento
                        </button>
                    </div>
                `;

                document.getElementById('meProgresoTexto').textContent = `¡Completado!`;
                document.getElementById('meProgresoFill').style.width = `100%`;
                document.getElementById('meProgresoInfo').textContent = `100%`;
                document.getElementById('meCompletadoMsg').classList.add('hidden');

                Storage._save();
                APP.renderizarTodo();
                confetti({ particleCount: 120, spread: 70 });
                UI.toast('🎉 ¡Entrenamiento completado!', 'success');
            },

            _salirEntreno() {
                modoEntrenoActivo = false;
                ejerciciosEntreno = [];
                idxEjercicioActual = 0;
                recordsConseguidos = [];
                totalPesoLevantadoEntreno = 0;
                totalVolumenEntreno = 0;
                totalSeriesEntreno = 0;
                totalRepsEntreno = 0;
                if (temporizadorDescanso) {
                    clearInterval(temporizadorDescanso);
                    temporizadorDescanso = null;
                }
                if (msgCompletadoTimeout) clearTimeout(msgCompletadoTimeout);
                document.getElementById('modoEntreno').classList.remove('open');
                APP.renderizarTodo();
                APP.navegar('inicio');
            },

            _getUltimoEntreno(nombre) {
                const ord = [...STATE.historialEntrenos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                for (const e of ord) {
                    const ej = e.ejercicios.find(x => x.nombre === nombre);
                    if (ej) return { fecha: e.fecha, peso: ej.peso, reps: ej.reps };
                }
                return null;
            }
        };

        // ==========================================
        // DASHBOARD
        // ==========================================
        const Dashboard = {
            render() {
                const c = document.getElementById('dashboardContainer');
                if (!c) return;

                const hoy = new Date();
                const horas = hoy.getHours();
                let saludo = 'Buenos días';
                if (horas >= 14 && horas < 21) saludo = 'Buenas tardes';
                if (horas >= 21 || horas < 6) saludo = 'Buenas noches';

                const dia = UI.getDiaNombre();
                const rutinaNombre = CONFIG.TIPOS_RUTINA[dia] || 'Descanso';
                const entrenadoHoy = STATE.diasEntrenados.includes(UI.getHoy());

                const peso = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                const obj = CONFIG.PESO_OBJETIVO;
                let pctObjetivo = 0;
                if (STATE.mediciones.length > 0) {
                    const primero = STATE.mediciones[0].peso;
                    const ultimo = STATE.mediciones[STATE.mediciones.length - 1].peso;
                    const total = primero - obj;
                    if (total > 0) pctObjetivo = Math.min(100, Math.round(((primero - ultimo) / total) * 100));
                }

                let racha = 0;
                let h = new Date();
                for (let i = 0; i < 100; i++) {
                    let f = new Date(h);
                    f.setDate(h.getDate() - i);
                    if (STATE.diasEntrenados.includes(UI.formatFecha(f))) racha++;
                    else break;
                }

                let ultimoEntreno = 'Nunca';
                if (STATE.diasEntrenados.length > 0) {
                    const ultimo = [...STATE.diasEntrenados].sort().reverse()[0];
                    const diff = Math.round((new Date() - new Date(ultimo)) / 86400000);
                    if (diff === 0) ultimoEntreno = 'Hoy';
                    else if (diff === 1) ultimoEntreno = 'Ayer';
                    else if (diff < 7) ultimoEntreno = `Hace ${diff} días`;
                    else ultimoEntreno = UI.formatearFecha(ultimo);
                }

                let ultimaMedicion = 'Nunca';
                if (STATE.mediciones.length > 0) {
                    const ultima = STATE.mediciones[STATE.mediciones.length - 1];
                    const diff = Math.round((new Date() - new Date(ultima.fecha)) / 86400000);
                    if (diff === 0) ultimaMedicion = 'Hoy';
                    else if (diff === 1) ultimaMedicion = 'Ayer';
                    else if (diff < 7) ultimaMedicion = `Hace ${diff} días`;
                    else ultimaMedicion = UI.formatearFecha(ultima.fecha);
                }

                const diasMap = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes',
                    6: 'sabado' };
                let proxDia = null;
                let proxNombre = '';
                let proxIcono = '';
                let proxEjercicios = 0;
                let proxDuracion = 0;
                let diasParaProx = 0;

                // Empezar por hoy. Si ya se completó, el recorrido continúa con
                // el siguiente día real de entrenamiento de la rutina semanal.
                for (let i = 0; i <= 7; i++) {
                    const d = new Date(hoy);
                    d.setDate(hoy.getDate() + i);
                    const diaKey = diasMap[d.getDay()];
                    const esDiaEntreno = diaKey !== 'miercoles' && diaKey !== 'sabado' && diaKey !== 'domingo';
                    const yaCompletado = i === 0 && STATE.diasEntrenados.includes(UI.formatFecha(d));
                    if (esDiaEntreno && !yaCompletado) {
                        const ejercicios = getEjerciciosPorDia(diaKey);
                        if (ejercicios.length > 0) {
                            proxDia = diaKey;
                            proxNombre = CONFIG.NOMBRES_DIAS[diaKey];
                            const iconos = ['🔵', '🟢', '🚶', '🟠', '🔵'];
                            const idx = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes'].indexOf(diaKey);
                            proxIcono = idx >= 0 ? iconos[idx] : '💪';
                            proxEjercicios = ejercicios.length;
                            proxDuracion = calcularDuracionEstimada(ejercicios);
                            diasParaProx = i;
                            break;
                        }
                    }
                }

                const notifs = Notificaciones.generar();

                // ===== BANNER DE ACTUALIZACIÓN =====
                const tipoActualizacion = APP.obtenerTipoActualizacion();
                let updateBanner = '';
                const hoyStr = UI.getHoy();

                if (tipoActualizacion === 'completa') {
                    updateBanner = `
                        <div class="update-banner">
                            <div class="ub-titulo">📊 Actualización completa — Peso + Mediciones + Fotos</div>
                            <div class="ub-descripcion">Hoy es domingo de actualización completa. Registra todos tus datos.</div>
                            <div class="ub-boton">
                                <button class="btn btn-primary btn-block btn-sm" onclick="APP.navegar('peso')">
                                    <i class="fa-solid fa-scale-balanced"></i> Ir a mediciones
                                </button>
                            </div>
                        </div>
                    `;
                } else if (tipoActualizacion === 'mediciones') {
                    updateBanner = `
                        <div class="update-banner mediciones">
                            <div class="ub-titulo">📊 Actualización de mediciones — Peso + Mediciones</div>
                            <div class="ub-descripcion">Hoy actualiza peso y mediciones. Las fotos se conservan.</div>
                            <div class="ub-boton">
                                <button class="btn btn-primary btn-block btn-sm" onclick="APP.navegar('peso')" style="background:var(--warning);border-color:var(--warning);color:#000;">
                                    <i class="fa-solid fa-scale-balanced"></i> Ir a mediciones
                                </button>
                            </div>
                        </div>
                    `;
                } else if (tipoActualizacion === 'solo-peso') {
                    updateBanner = `
                        <div class="update-banner peso">
                            <div class="ub-titulo">📊 Actualización semanal — Solo peso</div>
                            <div class="ub-descripcion">Hoy solo debes registrar tu peso. Mediciones y fotos se conservan.</div>
                            <div class="ub-boton">
                                <button class="btn btn-primary btn-block btn-sm" onclick="APP.navegar('peso')" style="background:var(--text-muted);border-color:var(--text-muted);">
                                    <i class="fa-solid fa-scale-balanced"></i> Registrar peso
                                </button>
                            </div>
                        </div>
                    `;
                }

                c.innerHTML = `
                    <div class="saludo">${saludo}, <span>${STATE.nombre}</span></div>
                    <div class="saludo-dia">${UI.getDiaSemanaNombre(hoy)} · ${hoy.toLocaleDateString('es-ES', {day:'numeric', month:'long'})}</div>

                    ${updateBanner}

                    <div class="card card-accent">
                        <div class="card-title">📊 Resumen</div>
                        <div class="dash-grid">
                            <div class="dash-stat">
                                <div class="num primary">${peso}</div>
                                <div class="label">Peso (kg)</div>
                            </div>
                            <div class="dash-stat">
                                <div class="num green">${pctObjetivo}%</div>
                                <div class="label">Objetivo</div>
                            </div>
                        </div>
                    </div>

                    ${proxDia && diasParaProx <= 3 ? `
                        <div class="proximo-entreno-card" onclick="APP.navegar('rutinas')">
                            <div class="pe-titulo">${diasParaProx === 0 ? '🔵 HOY' : diasParaProx === 1 ? '🔴 MAÑANA' : '📅 PRÓXIMO ENTRENO'}</div>
                            <div class="pe-nombre">${proxIcono} ${proxNombre}</div>
                            <div class="pe-datos">
                                <span>📋 ${CONFIG.TIPOS_RUTINA[proxDia]}</span>
                                <span>🏋️ ${proxEjercicios} ejercicios</span>
                                <span>⏱ ${proxDuracion} min</span>
                            </div>
                            <button class="pe-btn" onclick="event.stopPropagation();APP.iniciarEntreno('${proxDia}')">
                                <i class="fa-solid fa-play"></i> Comenzar
                            </button>
                        </div>
                    ` : `
                        <div class="card">
                            <div class="card-title">💪 Rutina de hoy</div>
                            ${dia === 'domingo' || dia === 'sabado' || dia === 'miercoles' ? `
                                <div style="text-align:center;padding:6px 0;color:var(--text-secondary);">
                                    <span style="font-size:28px;display:block;margin-bottom:2px;">${dia === 'miercoles' ? '🚶' : '😌'}</span>
                                    ${dia === 'miercoles' ? 'Caminata 30-45 min' : 'Día de descanso'}
                                </div>
                            ` : entrenadoHoy ? `
                                <div style="text-align:center;padding:6px 0;color:var(--success);">
                                    <span style="font-size:28px;display:block;margin-bottom:2px;">✅</span>
                                    Completado
                                    <div style="font-size:11px;color:var(--text-secondary);">${rutinaNombre}</div>
                                </div>
                            ` : `
                                <div style="display:flex;align-items:center;justify-content:space-between;">
                                    <div>
                                        <div style="font-size:14px;font-weight:600;">${rutinaNombre}</div>
                                        <div style="font-size:11px;color:var(--text-secondary);">${getEjerciciosPorDia(dia).length} ejercicios</div>
                                    </div>

                        panelContent = `

                const diaActual = UI.getDiaNombre();

                    const tabs = tc.querySelectorAll('.dtab');

            _seleccionarDia(dia) {
                document.querySelectorAll('.dia-panel').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));

                const panel = document.getElementById(`dp-${dia}`);
                if (panel) panel.classList.add('active');

                const tab = document.querySelector(`.dtab[data-dia="${dia}"]`);
                if (tab) tab.classList.add('active');

                diaActivo = dia;

            _actualizarProgreso() {
                const c = document.getElementById('progresoRutinaContainer');
                if (!c) return;

                if (diaActivo === 'miercoles') {
                    c.innerHTML = '';
                    return;
                }

                const ejercicios = getEjerciciosPorDia(diaActivo);
                if (ejercicios.length === 0) { c.innerHTML = ''; return; }

                let comp = 0;
                ejercicios.forEach((_, idx) => { if (STATE.checks[`${diaActivo}-${idx}`]) comp++; });
                const pct = Math.round((comp / ejercicios.length) * 100);

                const completado = STATE.diasEntrenados.includes(UI.getHoy()) && diaActivo === UI.getDiaNombre();

                if (completado) {
                    c.innerHTML =
                        `<div class="progreso-rutina-bar"><div class="progreso-rutina-completado"><i class="fa-solid fa-circle-check"></i> ¡${CONFIG.NOMBRES_DIAS[diaActivo]} completado!</div></div>`;

                    c.innerHTML = `
                        <div class="progreso-rutina-bar">

                                <span>${CONFIG.NOMBRES_DIAS[diaActivo]} - Progreso</span>
                                <span>${pct}%</span>

                    c.innerHTML = '';

            render() {

                const hoy = new Date();
                const hoyDia = hoy.getDay();

                const dias = [
                    { key: 'lunes', nombre: 'LUNES', icono: '🔵', grupo: 'Pecho + Hombros + Tríceps' },
                    { key: 'martes', nombre: 'MARTES', icono: '🟢', grupo: 'Espalda + Bíceps + Trapecio' },
                    { key: 'miercoles', nombre: 'MIÉRCOLES', icono: '🚶', grupo: 'Caminata' },
                    { key: 'jueves', nombre: 'JUEVES', icono: '🟠', grupo: 'Tren superior — prioridad brazos' },
                    { key: 'viernes', nombre: 'VIERNES', icono: '🔵', grupo: 'Tren superior completo' },
                    { key: 'sabado', nombre: 'SÁBADO', icono: '🚶', grupo: 'Caminata' },
                    { key: 'domingo', nombre: 'DOMINGO', icono: '😌', grupo: 'Descanso' }
                ];

                const diaMap = { 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes', 6: 'sabado', 0: 'domingo' };

                    let ejercicios = [];

                    if (!esDescanso) {
                        ejercicios = getEjerciciosPorDia(dia.key);
                    }

                    const claseDia = esHoy ? 'rutina-dia hoy' : 'rutina-dia';
                    const claseDescanso = esDescanso ? ' descanso' : '';

                    html += `<div class="rd-header">`;
                    html += `<div><span class="rd-dia">${dia.icono} ${dia.nombre}</span>`;
                    html += `<div class="rd-grupo">${dia.grupo}</div></div>`;
                    if (esHoy) {
                        html += `<span style="font-size:11px;color:var(--primary);font-weight:600;">HOY</span>`;

                    html += `</div>`;

                    if (esDescanso) {
                        html += `<div class="rd-ejercicios">`;

                            html += `Caminata de 30–45 minutos`;
                        } else if (dia.key === 'sabado') {
                            html += `Caminata de 45–60 minutos`;
                        } else {
                            html += `Descanso`;
                        }
                        html += `</div>`;
                    } else {
                        html += `<div class="rd-ejercicios">`;
                        ejercicios.forEach((ej, index) => {
                            const nombreEspanol = getNombreEspanol(ej.nombre);
                            html += `<div class="rd-ejercicio"><span class="rd-numero">${index + 1}.</span> ${nombreEspanol}</div>`;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                c.innerHTML = html;

        };

        // ==========================================

        const Peso = {
            render() {
                const c = document.getElementById('pesoContainer');
                if (!c) return;

                const ultimo = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1] : null;
                const primero = STATE.mediciones.length > 0 ? STATE.mediciones[0] : null;

                const tipo = APP.obtenerTipoActualizacion();
                const hoy = new Date();
                const esDomingo = hoy.getDay() === 0;
                const esFechaValida = tipo !== null;

                let titulo = 'Nueva medición';
                let descripcion = 'Registra todos tus datos corporales.';
                let mensajeAdicional = '';

                if (esDomingo && esFechaValida) {
                    if (tipo === 'completa') {
                        titulo = '📊 Actualización completa — Peso + Mediciones + Fotos';
                        descripcion = 'Registra peso, mediciones y fotos.';
                    } else if (tipo === 'mediciones') {
                        titulo = '📊 Actualización de mediciones — Peso + Mediciones';
                        descripcion = 'Hoy registra peso y mediciones. Las fotos se conservan.';
                        mensajeAdicional = `

                                <span style="font-size:13px;color:var(--text-secondary);">

                                </span>
                            </div>
