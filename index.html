<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NicoGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        /* ==========================================
           VARIABLES
           ========================================== */
        :root {
            --bg: #0b1120;
            --bg-card: #162033;
            --bg-card-hover: #1e2d4a;
            --primary: #3b82f6;
            --primary-dim: rgba(59, 130, 246, 0.12);
            --primary-glow: rgba(59, 130, 246, 0.30);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --transition: 0.25s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: var(--radius-full); }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-xs { gap: var(--space-xs); }
        .gap-sm { gap: var(--space-sm); }
        .mt-xs { margin-top: var(--space-xs); }
        .mt-sm { margin-top: var(--space-sm); }
        .mt-md { margin-top: var(--space-md); }
        .mt-lg { margin-top: var(--space-lg); }
        .mb-xs { margin-bottom: var(--space-xs); }
        .mb-sm { margin-bottom: var(--space-sm); }
        .mb-md { margin-bottom: var(--space-md); }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .text-primary { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .w-full { width: 100%; }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px;
            padding: 0 var(--space-sm); background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 30%, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo i { -webkit-text-fill-color: initial; color: var(--primary); margin-right: 4px; }
        .top-right { display: flex; align-items: center; gap: 12px; }
        .top-stats { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; background: var(--bg-card); padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid var(--border); color: var(--text-secondary); }
        .top-stats strong { color: var(--text); }

        .bell-wrap { position: relative; cursor: pointer; padding: 6px; border-radius: 50%; transition: var(--transition); background: transparent; border: none; color: var(--text-secondary); font-size: 18px; }
        .bell-wrap:hover { background: var(--bg-card); color: var(--text); }
        .bell-wrap .badge { position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; transform: translate(4px, -4px); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); }

        .notif-dropdown {
            position: absolute; top: calc(100% + 8px); right: -8px; width: 300px; max-height: 380px;
            overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 0; box-shadow: var(--shadow); display: none; z-index: 1100;
        }
        .notif-dropdown.open { display: block; }
        .notif-dropdown .notif-header { padding: 0 var(--space-sm) 10px var(--space-sm); font-weight: 600; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .notif-item { display: flex; align-items: center; gap: 10px; padding: 8px var(--space-sm); font-size: 13px; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: rgba(255,255,255,0.03); }
        .notif-item .ni-icon { font-size: 18px; flex-shrink: 0; }
        .notif-item .ni-text { flex: 1; }
        .notif-empty { padding: 20px var(--space-sm); text-align: center; color: var(--text-secondary); font-size: 13px; }

        .side-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .side-overlay.open { opacity: 1; pointer-events: auto; }
        .side-menu {
            position: fixed; top: 0; left: -300px; width: 290px; height: 100%;
            background: var(--bg-card); border-right: 1px solid var(--border); z-index: 1001;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 70px var(--space-sm) var(--space-md); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
        }
        .side-menu.open { left: 0; }
        .side-menu .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: var(--transition); border: none; background: transparent; width: 100%; text-align: left; }
        .side-menu .menu-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .side-menu .menu-item.active { background: var(--primary-dim); color: var(--primary); }
        .side-menu .menu-item i { width: 22px; font-size: 16px; text-align: center; flex-shrink: 0; }
        .side-menu .menu-divider { height: 1px; background: var(--border); margin: 8px 14px; }
        .side-menu .menu-footer { margin-top: auto; padding-top: 12px; font-size: 11px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; height: 62px;
            background: rgba(11, 17, 32, 0.94); backdrop-filter: blur(14px) saturate(1.4);
            border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 4px;
        }
        .bottom-nav .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: none; color: var(--text-secondary); font-size: 9px; font-weight: 500; padding: 4px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); position: relative; letter-spacing: 0.3px; text-transform: uppercase; }
        .bottom-nav .nav-btn i { font-size: 18px; transition: var(--transition); }
        .bottom-nav .nav-btn.active { color: var(--primary); }
        .bottom-nav .nav-btn.active i { transform: translateY(-1px); }
        .bottom-nav .nav-btn:active { transform: scale(0.96); }

        .page { display: none; padding: 72px var(--space-sm) 76px; max-width: 520px; margin: 0 auto; min-height: 100vh; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin-bottom: var(--space-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .card:hover { border-color: rgba(255,255,255,0.10); }
        .card-accent { border-left: 3px solid var(--primary); background: linear-gradient(135deg, var(--primary-dim), rgba(59,130,246,0.02)); }
        .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 14px; }
        .card-title i { margin-right: 6px; color: var(--primary); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
            border: none; cursor: pointer; transition: var(--transition); text-decoration: none;
            font-family: var(--font); background: var(--bg-card); color: var(--text);
            border: 1px solid var(--border); height: 40px; min-height: 40px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { box-shadow: 0 0 24px var(--primary-glow); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #000; border-color: var(--success); }
        .btn-success:hover { box-shadow: 0 0 24px rgba(34,197,94,0.25); transform: translateY(-1px); }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(239,68,68,0.08); }
        .btn-sm { padding: 4px 14px; font-size: 12px; height: 32px; min-height: 32px; }
        .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { border-color: var(--text-secondary); color: var(--text); }
        .btn-block { width: 100%; justify-content: center; }

        .input {
            width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: rgba(0,0,0,0.2);
            color: var(--text); font-size: 14px; font-family: var(--font);
            outline: none; transition: var(--transition);
        }
        .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
        .input-sm { padding: 6px 10px; font-size: 12px; }

        .saludo { font-size: 26px; font-weight: 700; margin-bottom: 2px; letter-spacing: -0.5px; }
        .saludo span { color: var(--primary); }
        .saludo-dia { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-md); }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
        .dash-stat { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center; }
        .dash-stat .num { font-size: 30px; font-weight: 700; }
        .dash-stat .num.green { color: var(--success); }
        .dash-stat .num.primary { color: var(--primary); }
        .dash-stat .num.orange { color: var(--warning); }
        .dash-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .pending-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .pending-item:last-child { border-bottom: none; }
        .pending-item .pi-icon { font-size: 18px; }

        .day-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
        .day-tabs::-webkit-scrollbar { display: none; }
        .day-tabs .dtab { flex-shrink: 0; padding: 6px 18px; border-radius: var(--radius-full); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .day-tabs .dtab:hover { border-color: var(--text-secondary); }
        .day-tabs .dtab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .ex-grid { display: flex; flex-direction: column; gap: 12px; }
        .ex-card { background: var(--bg-card); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; transition: var(--transition); }
        .ex-card.checked { opacity: 0.5; }
        .ex-card.checked .ex-name { text-decoration: line-through; }
        .ex-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(59,130,246,0.04); }
        .ex-name { font-weight: 600; font-size: 15px; }
        .ex-grupo { font-size: 10px; color: var(--text-secondary); margin-left: 8px; background: rgba(255,255,255,0.05); padding: 2px 10px; border-radius: var(--radius-full); }
        .ex-body { padding: 14px 16px; }
        .check-box { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; transition: var(--transition); }
        .check-box:hover { transform: scale(1.05); }

        .ex-tog { width: 100%; padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); }
        .ex-tog:hover { border-color: var(--text-secondary); }
        .ex-det { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .ex-det.open { display: block; }
        .ex-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); display: block; margin: 0 auto 10px; cursor: pointer; background: rgba(0,0,0,0.3); transition: var(--transition); }
        .ex-img:hover { transform: scale(1.01); }
        .ex-img-fallback { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); margin: 0 auto 10px; background: var(--primary-dim); color: var(--primary); font-size: 48px; border: 1px solid var(--border); }

        .ex-datos { display: none; }
        .ex-dato label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 2px; }
        .ex-dato input { width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); font-size: 16px; font-weight: 600; font-family: var(--font); outline: none; text-align: center; transition: var(--transition); }
        .ex-dato input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }

        .ex-ultimo { font-size: 12px; color: var(--text-secondary); margin-top: 8px; text-align: center; }
        .ultimo-entreno { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: var(--radius-sm); margin-top: 8px; font-size: 12px; background: rgba(255,255,255,0.03); }
        .mejor-marca { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: var(--radius-sm); margin-top: 4px; font-size: 12px; background: var(--primary-dim); border: 1px solid rgba(59,130,246,0.15); }
        .mejor-marca .mm-valor { font-weight: 700; color: var(--primary); }

        .btn-historial-ej { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-full); padding: 2px 14px; font-size: 10px; color: var(--text-secondary); cursor: pointer; margin-top: 6px; transition: var(--transition); }
        .btn-historial-ej:hover { border-color: var(--text-secondary); color: var(--text); }

        .btn-finalizar { display: none; width: 100%; margin-top: var(--space-sm); padding: 16px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm); }
        .btn-finalizar.visible { display: block; }

        .progreso-rutina-bar { background: var(--bg-card); border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 14px; border: 1px solid var(--border); }
        .progreso-rutina-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
        .progreso-rutina-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .progreso-rutina-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s ease; }
        .progreso-rutina-info { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-align: right; }
        .progreso-rutina-completado { text-align: center; color: var(--success); font-weight: 600; }

        .peso-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-xs); }
        .peso-stat { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
        .peso-stat .num { font-size: 28px; font-weight: 700; }
        .peso-stat .num.green { color: var(--success); }
        .peso-stat .num.primary { color: var(--primary); }
        .peso-stat .num.orange { color: var(--warning); }
        .peso-stat .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .historial-medicion-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .historial-medicion-card:hover { border-color: var(--primary); }
        .historial-medicion-card .med-fecha { font-weight: 600; font-size: 14px; }
        .historial-medicion-card .med-resumen { display: flex; gap: 14px; margin-top: 4px; font-size: 13px; flex-wrap: wrap; }
        .historial-medicion-card .med-resumen .med-item { display: flex; align-items: center; gap: 4px; }
        .historial-medicion-card .med-resumen .med-item .valor { font-weight: 600; color: var(--primary); }
        .historial-medicion-card .med-resumen .positive { color: var(--success); }
        .historial-medicion-card .med-resumen .negative { color: var(--danger); }

        .historial-medicion-detalle { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .historial-medicion-detalle.open { display: block; }
        .historial-medicion-detalle .detalle-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .historial-medicion-detalle .detalle-item:last-child { border-bottom: none; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-xs); }
        .stats-item { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
        .stats-item .num { font-size: 24px; font-weight: 700; }
        .stats-item .num.green { color: var(--success); }
        .stats-item .num.orange { color: var(--warning); }
        .stats-item .num.primary { color: var(--primary); }
        .stats-item .num.info { color: var(--secondary); }
        .stats-item .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .record-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--border); border-left: 3px solid var(--primary); }
        .record-card .record-name { font-weight: 600; font-size: 15px; }
        .record-card .record-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin: 6px 0; }
        .record-card .record-stats .rs-item { text-align: center; }
        .record-card .record-stats .rs-item .rs-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; }
        .record-card .record-stats .rs-item .rs-value { font-weight: 700; font-size: 16px; color: var(--primary); }
        .record-card .record-date { font-size: 11px; color: var(--text-secondary); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-panel {
            background: var(--bg-card); border-radius: var(--radius); padding: 24px;
            max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-panel .modal-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 4px; transition: var(--transition); }
        .modal-panel .modal-close:hover { color: var(--text); }
        .modal-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
        .modal-panel .modal-img { width: 100%; border-radius: var(--radius-sm); object-fit: cover; max-height: 200px; margin-bottom: 12px; background: rgba(0,0,0,0.2); }
        .modal-panel .modal-field { margin-bottom: 10px; }
        .modal-panel .modal-field .mf-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
        .modal-panel .modal-field .mf-value { font-weight: 500; }
        .modal-panel .modal-historial { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px; margin: 10px 0; }
        .modal-panel .modal-record { background: var(--primary-dim); border-radius: var(--radius-sm); padding: 12px; border: 1px solid rgba(59,130,246,0.15); text-align: center; margin: 10px 0; }
        .modal-panel .modal-record .mr-valor { font-size: 20px; font-weight: 700; color: var(--primary); }

        .ajustes-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .ajustes-item:last-child { border-bottom: none; }
        .ajustes-item .aj-label { font-size: 13px; }

        .foto-grid-upload { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); margin-bottom: 10px; }
        .equip-card { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
        .equip-card .label { font-size: 10px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .equip-card input[type="file"] { display: block; margin: 6px auto 0; font-size: 11px; color: var(--text-secondary); max-width: 100%; }

            z-index: 4000; animation: toastIn 0.3s ease, toastOut 0.4s 2.6s forwards;

        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(10px); visibility: hidden; } }

        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 3000; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }

                "Pullover con mancuerna": "https://fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Pullover.gif",

                "Extensión de tríceps tumbado": "https://gymvisual.com/img/p/2/0/8/4/3/20843.gif",
                "Extensión de tríceps tras nuca": "https://i.pinimg.com/originals/2c/62/ba/2c62ba80d37c94d06ad6d60f1e5445df.gif",
                "Fondos para tríceps": "https://i.pinimg.com/originals/2c/62/ba/2c62ba80d37c94d06ad6d60f1e5445df.gif",
                "Patada de tríceps": "https://i.pinimg.com/originals/96/a1/b6/96a1b68a9a9f4c853b695a3740e91326.gif",
                "Remo al mentón con mancuernas": "https://api.smartworkout.app/asset/image/80833bf7-99b5-4272-b3b2-629ccc137ce1",

                "Curl concentrado": "https://media.tenor.com/jaX3EUxaQGkAAAAM/rosca-concentrada-no-banco.gif",
                "Press inclinado con mancuernas": "https://fitnessprogramer.com/wp-content/uploads/2022/07/Dumbbell-Reverse-Grip-30-Degrees-Incline-Bench-Press.gif",
                "Aperturas en banco plano": "https://gymvisual.com/img/p/1/0/2/8/0/10280.gif",
                "Press plano con mancuernas": "https://gymvisual.com/img/p/1/8/6/4/5/18645.gif",
                "Pájaro invertido": "https://i.pinimg.com/originals/f8/37/b5/f837b5d4ef387c529f2ca61a97fbabdd.gif",
                "Sentadilla Goblet con mancuerna": "https://fitnessprogramer.com/wp-content/uploads/2023/01/Dumbbell-Goblet-Squat.gif",

            }

        // ==========================================
        // STATE
        // ==========================================
        const STATE = {
            nombre: 'Nico',
            altura: CONFIG.ALTURA,
            mediciones: [],
            historialEntrenos: [],
            diasNoFumar: [],
            diasEntrenados: [],
            checks: {},
            recordatorios: { freqMediciones: 2, freqFotos: 4, ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES, ultimasFotos: null },
            records: [],
            evolution: { initialWeight: 0, currentWeight: 0, initialWaist: 0, currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0 },
            ajustes: {}
        };

        let diaActivo = 'lunes';

        // ==========================================
        // STORAGE
        // ==========================================
        const Storage = {
            init() {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    Object.assign(STATE, d);
                    if (!STATE.recordatorios) STATE.recordatorios = { freqMediciones: 2, freqFotos: 4, ultimaMedicion: CONFIG.FECHA_REFERENCIA_MEDICIONES, ultimasFotos: null };
                    if (!STATE.records) STATE.records = [];
                    if (!STATE.evolution) STATE.evolution = { initialWeight: 0, currentWeight: 0, initialWaist: 0, currentWaist: 0, totalWorkouts: 0, daysWithoutSmoking: 0 };
                    if (!STATE.ajustes) STATE.ajustes = {};
                }
                this._calcularDiasSinFumar();
                this._save();
                return this;
            },
            _calcularDiasSinFumar() {
                let c = 0;
                const f = new Date(CONFIG.FECHA_INICIO_NO_FUMAR);
                const h = new Date();
                while (f <= h) {
                    if (!STATE.diasNoFumar.includes(UI.formatFecha(f))) c++;
                    f.setDate(f.getDate() + 1);
                }
                STATE.evolution.daysWithoutSmoking = c;
            },
            _save() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE)); },
            resetearSemana() {
                const hoy = new Date();
                const diaSemana = hoy.getDay();
                const semanaActual = this._getSemanaKey(hoy);
                const ultimaSemana = localStorage.getItem('ultimaSemana');
                if (diaSemana === 1 && ultimaSemana !== semanaActual) {
                    STATE.checks = {};
                    localStorage.setItem('ultimaSemana', semanaActual);
                    this._save();
                    return true;
                }
                return false;
            },
            _getSemanaKey(fecha) {
                const d = new Date(fecha);
                d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
                const year = d.getFullYear();
                const week = Math.ceil((((d - new Date(year, 0, 1)) / 86400000) + 1) / 7);
                return `${year}-W${String(week).padStart(2, '0')}`;
            },
            resetAll() { localStorage.removeItem(CONFIG.STORAGE_KEY);
                location.reload(); },
            exportar() {
                const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'nicogym_backup.json';
                a.click();
                UI.toast('✅ Datos exportados', 'success');
            },
            importar(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const datos = JSON.parse(e.target.result);
                        Object.assign(STATE, datos);
                        this._save();
                        UI.toast('✅ Datos importados', 'success');
                        APP.renderizarTodo();
                    } catch (err) { UI.toast('❌ Error al importar', 'error'); }
                };
                reader.readAsText(file);
            }
        };

        // ==========================================
        // UI
        // ==========================================
        const UI = {
            toast(msg, tipo = 'info') {
                const t = document.createElement('div');
                t.className = `toast-msg toast-${tipo}`;
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            },
            confirmar(msg, cb) {
                Modal.abrir(`
                    <h3>${msg}</h3>
                    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
                        <button class="btn btn-danger" onclick="Modal.cerrar(); (${cb.toString()})()">Confirmar</button>
                        <button class="btn btn-ghost" onclick="Modal.cerrar()">Cancelar</button>
                    </div>
                `);
            },
            toggleMenu() {
                document.getElementById('sideMenu').classList.toggle('open');
                document.getElementById('sideOverlay').classList.toggle('open');
            },
            toggleNotif() {
                document.getElementById('notifDropdown').classList.toggle('open');
            },
            cerrarLightbox() { document.getElementById('lightbox').classList.remove('active'); },
            abrirLightbox(src) { document.getElementById('lightboxImg').src = src;
                document.getElementById('lightbox').classList.add('active'); },
            getHoy() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            formatFecha(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            formatearFecha(fecha) { return new Date(fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); },
            getDiaNombre() {
                const mapa = { 0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes', 6: 'sabado' };
                return mapa[new Date().getDay()] || 'lunes';
            },
            getDiaSemanaNombre(d) { return CONFIG.DIAS_SEMANA[d.getDay()] || ''; },
            actualizarTopBar() {
                const p = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                document.getElementById('topPesoDisplay').textContent = p + ' kg';
                document.getElementById('topObjetivo').textContent = CONFIG.PESO_OBJETIVO;
            }
        };

        // ==========================================
        // MODAL
        // ==========================================
        const Modal = {
            abrir(html) {
                document.getElementById('modalGlobalContent').innerHTML = html;
                document.getElementById('modalGlobal').classList.remove('hidden');
            },
            cerrar() {
                document.getElementById('modalGlobal').classList.add('hidden');
            }
        };

        // ==========================================
        // FUNCIONES AUX
        // ==========================================
        function getProximoDomingo(desde, cadaSemanas) {
            const d = new Date(desde);
            const hoy = new Date();
            while (d <= hoy) d.setDate(d.getDate() + 7 * cadaSemanas);
            while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
            return d;
        }

        function getDiasHasta(fecha) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            fecha.setHours(0, 0, 0, 0);
            return Math.round((fecha - hoy) / 86400000);
        }

        function getImagenEjercicio(nombre) {
            return CONFIG.IMAGENES[nombre] || '';
        }

        function getInstruccion(nombre) {
            const map = {
                "Remo con barra": "Torso inclinado 45°, espalda recta. Tira la barra hacia el abdomen.",
                "Remo a una mano con mancuerna": "Apoya rodilla y mano en banco. Sube el codo hacia atrás.",
                "Curl de bíceps alterno": "Codos pegados al torso. Curva alternando brazos.",

        // ==========================================
        // APP
        // ==========================================
        const APP = {
            init() {
                Storage.init();
                const reset = Storage.resetearSemana();
                if (reset) {
                    UI.toast('🔄 Nueva semana. ¡A marcar los ejercicios!', 'success');
                }
                this._cargarAjustes();
                this._actualizarEvolution();
                this.renderizarTodo();
                this._eventos();
                document.addEventListener('click', (e) => {
                    const bell = document.getElementById('bellWrap');
                    const drop = document.getElementById('notifDropdown');
                    if (bell && drop && !bell.contains(e.target)) drop.classList.remove('open');
                });
                return this;
            },
            _eventos() {
                document.getElementById('importFile').addEventListener('change', function() { Storage.importar(this
                        .files[0]); });
                const dia = UI.getDiaNombre();
                diaActivo = dia === 'domingo' ? 'lunes' : dia;
            },
            _cargarAjustes() {
                const a = STATE.ajustes || {};
                if (a.nombre) STATE.nombre = a.nombre;
                if (a.altura) STATE.altura = a.altura;
                if (a.objetivo) CONFIG.PESO_OBJETIVO = a.objetivo;
            },
            _actualizarEvolution() {
                if (STATE.mediciones.length > 0) {
                    STATE.evolution.initialWeight = STATE.mediciones[0].peso;
                    STATE.evolution.currentWeight = STATE.mediciones[STATE.mediciones.length - 1].peso;
                    STATE.evolution.initialWaist = STATE.mediciones[0].cintura;
                    STATE.evolution.currentWaist = STATE.mediciones[STATE.mediciones.length - 1].cintura;
                    STATE.evolution.totalWorkouts = STATE.diasEntrenados.length || 0;
                }
                Storage._save();
            },
            renderizarTodo() {
                UI.actualizarTopBar();
                Dashboard.render();
                Rutinas.render();
                Peso.render();
                Agenda.render();
                Estadisticas.render();
                Records.render();
                Fotos.render();
                Ajustes.render();
                Notificaciones.render();
            },
            navegar(id) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const page = document.getElementById(`page-${id}`);
                if (page) page.classList.add('active');

                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                const map = { 'inicio': 0, 'rutinas': 1, 'peso': 2, 'agenda': 3, 'estadisticas': 4 };
                const btns = document.querySelectorAll('.nav-btn');
                if (map[id] !== undefined && btns[map[id]]) btns[map[id]].classList.add('active');

                document.querySelectorAll('.side-menu .menu-item').forEach(m => m.classList.remove('active'));
                document.querySelectorAll('.side-menu .menu-item').forEach(m => {
                    const txt = m.textContent.trim().toLowerCase();
                    if (txt.includes(id) || (id === 'estadisticas' && txt.includes('estadísticas')) ||
                        (id === 'peso' && txt.includes('peso')) || (id === 'fotos' && txt.includes('fotos'))) {
                        m.classList.add('active');
                    }
                });

                if (document.getElementById('sideMenu').classList.contains('open')) UI.toggleMenu();
                window.scrollTo(0, 0);

                if (id === 'rutinas') {
                    setTimeout(() => {
                        const dia = UI.getDiaNombre();
                        diaActivo = dia === 'domingo' ? 'lunes' : dia;
                        const tabs = document.querySelectorAll('.dtab');
                        const idx = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes'].indexOf(diaActivo);
                        if (tabs[idx]) tabs[idx].click();
                    }, 100);
                }
            },
            confirmarReset() { UI.confirmar('¿Borrar TODOS los datos? No se puede deshacer.', () => Storage
                    .resetAll()); }
        };

        // ==========================================
        // DASHBOARD
        // ==========================================
        const Dashboard = {
            render() {
                const c = document.getElementById('dashboardContainer');
                if (!c) return;

                const hoy = new Date();
                const horas = hoy.getHours();
                let saludo = 'Buenos días';
                if (horas >= 14 && horas < 21) saludo = 'Buenas tardes';
                if (horas >= 21 || horas < 6) saludo = 'Buenas noches';

                const dia = UI.getDiaNombre();
                const rutinaNombre = CONFIG.TIPOS_RUTINA[dia] || 'Descanso';
                const entrenadoHoy = STATE.diasEntrenados.includes(UI.getHoy());

                const peso = STATE.mediciones.length > 0 ? STATE.mediciones[STATE.mediciones.length - 1].peso : '--';
                const obj = CONFIG.PESO_OBJETIVO;
                let pctObjetivo = 0;
                if (STATE.mediciones.length > 0) {
                    const primero = STATE.mediciones[0].peso;
                    const ultimo = STATE.mediciones[STATE.mediciones.length - 1].peso;
                    const total = primero - obj;
                    if (total > 0) pctObjetivo = Math.min(100, Math.round(((primero - ultimo) / total) * 100));
                }

                let ultimoEntreno = 'Nunca';
                if (STATE.diasEntrenados.length > 0) {
                    const ultimo = [...STATE.diasEntrenados].sort().reverse()[0];
                    const diff = Math.round((new Date() - new Date(ultimo)) / 86400000);
                    if (diff === 0) ultimoEntreno = 'Hoy';
                    else if (diff === 1) ultimoEntreno = 'Ayer';
                    else if (diff < 7) ultimoEntreno = `Hace ${diff} días`;
                    else ultimoEntreno = UI.formatearFecha(ultimo);
                }

                const notifs = Notificaciones.generar();

                c.innerHTML = `
                        <div class="saludo">${saludo}, <span>${STATE.nombre}</span></div>
                        <div class="saludo-dia">${UI.getDiaSemanaNombre(hoy)} · ${hoy.toLocaleDateString('es-ES', {day:'numeric', month:'long'})}</div>

                        <div class="card card-accent">
                            <div class="card-title">📊 Resumen</div>
                            <div class="dash-grid">
                                <div class="dash-stat">
                                    <div class="num primary">${peso}</div>
                                    <div class="label">Peso (kg)</div>
                                </div>
                                <div class="dash-stat">
                                    <div class="num green">${pctObjetivo}%</div>
                                    <div class="label">Objetivo</div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-title">💪 Rutina de hoy</div>
                            ${dia === 'domingo' ? `
                                <div style="text-align:center;padding:8px 0;color:var(--text-secondary);">
                                    <span style="font-size:32px;display:block;margin-bottom:4px;">😌</span>
                                    Día de descanso
                                </div>
                            ` : entrenadoHoy ? `
                                <div style="text-align:center;padding:8px 0;color:var(--success);">
                                    <span style="font-size:32px;display:block;margin-bottom:4px;">✅</span>
                                    Completado
                                    <div style="font-size:12px;color:var(--text-secondary);">${rutinaNombre}</div>
                                </div>
                            ` : `
                                <div style="display:flex;align-items:center;justify-content:space-between;">
                                    <div>
                                        <div style="font-size:16px;font-weight:600;">${rutinaNombre}</div>
                                        <div style="font-size:12px;color:var(--text-secondary);">${CONFIG.EJERCICIOS[dia]?.length || 0} ejercicios</div>
                                    </div>
                                    <button class="btn btn-primary btn-sm" onclick="APP.navegar('rutinas')"><i class="fa-solid fa-play"></i> Entrenar</button>
                                </div>
                            `}
                        </div>

                        <div class="card">
                            <div class="card-title">📋 Último entrenamiento</div>
                            <div style="font-size:16px;font-weight:600;">${ultimoEntreno}</div>
                        </div>

                        ${notifs.length > 0 ? `
                            <div class="card" style="border-left:3px solid var(--warning);">
                                <div class="card-title">🔔 Pendientes (${notifs.length})</div>
                                ${notifs.map(n => `
                                    <div class="pending-item">
                                        <span class="pi-icon">${n.icono}</span>
                                        <span>${n.texto}</span>
                                    </div>
                                `).join('')}
                                <div style="text-align:center;margin-top:8px;font-size:11px;color:var(--text-secondary);cursor:pointer;" onclick="APP.navegar('agenda')">Ver todas →</div>
                            </div>
                        ` : ''}
                    `;
            }
        };

        // ==========================================
        // RUTINAS
        // ==========================================
        const Rutinas = {
            render() {
                const tc = document.getElementById('dayTabs');
                const pc = document.getElementById('dayPanelsContainer');
                if (!tc) return;

                const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes'];
                const nombres = ['L', 'M', 'X', 'J', 'V'];

                tc.innerHTML = '';
                pc.innerHTML = '';

                dias.forEach((dia, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'dtab';
                    btn.textContent = nombres[idx];
                    btn.dataset.dia = dia;
                    btn.onclick = () => { this._cambiarDia(dia); };
                    tc.appendChild(btn);
                });

                dias.forEach(dia => {
                    const panel = document.createElement('div');
                    panel.className = 'day-panel hidden';
                    panel.id = `dp-${dia}`;
                    panel.innerHTML = this._renderDia(dia);
                    pc.appendChild(panel);
                });

                const btn = document.createElement('button');
                btn.id = 'btnFinalizarRutina';
                btn.className = 'btn btn-success btn-finalizar';
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Finalizar entrenamiento';
                btn.onclick = () => this._mostrarFinalizar();
                pc.appendChild(btn);

                const diaActual = UI.getDiaNombre();
                diaActivo = diaActual === 'domingo' ? 'lunes' : diaActual;
                const idxActivo = dias.indexOf(diaActivo);
                if (idxActivo >= 0) {
                    const tabs = tc.querySelectorAll('.dtab');
                    const panel = document.getElementById(`dp-${diaActivo}`);
                    if (panel) panel.classList.remove('hidden');
                    if (tabs[idxActivo]) tabs[idxActivo].classList.add('active');
                }
                this._actualizarProgreso();
            },

            _renderDia(dia) {
                const ejercicios = CONFIG.EJERCICIOS[dia] || [];
                let html = `<div class="ex-grid" id="lista-${dia}">`;
                ejercicios.forEach((ej, idx) => {
                    const id = `${dia}-${idx}`;
                    const img = getImagenEjercicio(ej.nombre);
                    const inst = getInstruccion(ej.nombre);
                    const checked = !!STATE.checks[id];
                    const ultimo = this._getUltimoEntreno(ej.nombre);
                    const record = Records.getRecord(ej.nombre);
                    const esCardio = ej.nombre === 'Cardio en cinta';

                    const imgHtml = img ?
                        `<img src="${img}" class="ex-img" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'ex-img-fallback\\'>💪</div>'" onclick="UI.abrirLightbox(this.src)" alt="${ej.nombre}">` :
                        `<div class="ex-img-fallback">💪</div>`;

                    // QUITAMOS LOS INPUTS DE PESO Y REPS
                    const datosHtml = esCardio ? `
                            ${ultimo ? `<div class="ex-ultimo">Último: <strong>${ultimo.peso} min</strong> (${UI.formatearFecha(ultimo.fecha)})</div>` : ''}
                        ` : `
                            ${ultimo ? `<div class="ex-ultimo">Último: <strong>${ultimo.peso} kg</strong> · ${ultimo.reps} (${UI.formatearFecha(ultimo.fecha)})</div>` : ''}
                        `;

                    html += `
                            <div class="ex-card ${checked?'checked':''}">
                                <div class="ex-head">
                                    <span><span class="ex-name">${ej.nombre}</span><span class="ex-grupo">${ej.grupo}</span></span>
                                    <input type="checkbox" class="check-box" ${checked?'checked':''} onchange="Rutinas._marcar('${id}')">
                                </div>
                                <div class="ex-body">
                                    <button class="ex-tog" onclick="Rutinas._toggleDetalle(this,'${img}','${inst}')"><i class="fa-solid fa-circle-info"></i> Ver técnica</button>
                                    <div class="ex-det">
                                        ${imgHtml}
                                        <div style="white-space:pre-wrap;font-size:13px;line-height:1.7;">${inst}</div>
                                    </div>
                                    ${datosHtml}
                                    <div class="ultimo-entreno"><span>Último</span><span>${ultimo ? (esCardio ? ultimo.peso+' min' : ultimo.peso+' kg × '+ultimo.reps) : '--'}</span></div>
                                    <div class="mejor-marca"><span>🏆 Récord</span><span class="mm-valor">${record ? record.weight+' kg × '+record.reps : '--'}</span></div>
                                    <button class="btn-historial-ej" onclick="Rutinas._verHistorial('${ej.nombre}')"><i class="fa-solid fa-clock-rotate-left"></i> Historial</button>
                                </div>
                            </div>
                        `;
                });
                html += `</div>`;
                return html;
            },

            _cambiarDia(dia) {
                document.querySelectorAll('.day-panel').forEach(p => p.classList.add('hidden'));
                document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
                const panel = document.getElementById(`dp-${dia}`);
                if (panel) panel.classList.remove('hidden');
                document.querySelector(`.dtab[data-dia="${dia}"]`)?.classList.add('active');
                diaActivo = dia;
                this._actualizarProgreso();
            },

            _actualizarProgreso() {
                const c = document.getElementById('progresoRutinaContainer');
                if (!c) return;
                const ejercicios = CONFIG.EJERCICIOS[diaActivo] || [];
                if (ejercicios.length === 0) { c.innerHTML = ''; return; }

                let comp = 0;
                ejercicios.forEach((_, idx) => { if (STATE.checks[`${diaActivo}-${idx}`]) comp++; });
                const pct = Math.round((comp / ejercicios.length) * 100);
                const bf = document.getElementById('btnFinalizarRutina');

                if (comp === ejercicios.length) {
                    c.innerHTML =
                        `<div class="progreso-rutina-bar"><div class="progreso-rutina-completado"><i class="fa-solid fa-circle-check"></i> ¡${CONFIG.NOMBRES_DIAS[diaActivo]} completado!</div></div>`;
                    if (bf) bf.classList.add('visible');
                } else {
                    c.innerHTML = `
                            <div class="progreso-rutina-bar">
                                <div class="progreso-rutina-header">
                                    <span>${CONFIG.NOMBRES_DIAS[diaActivo]}</span>
                                    <span>${pct}%</span>
                                </div>
                                <div class="progreso-rutina-track"><div class="progreso-rutina-fill" style="width:${pct}%;"></div></div>
                                <div class="progreso-rutina-info">${comp}/${ejercicios.length} ejercicios</div>
                            </div>
                        `;
                    if (bf) bf.classList.remove('visible');
                }
            },

            _marcar(id) {
                const dia = id.split('-')[0];
                const idx = parseInt(id.split('-')[1]);
                const ejercicios = CONFIG.EJERCICIOS[dia] || [];
                const ejercicio = ejercicios[idx];

                if (!ejercicio) return;

                if (STATE.checks[id]) {
                    delete STATE.checks[id];
                    Storage._save();
                    this._actualizarProgreso();
                    const c = document.getElementById(`lista-${dia}`);
                    if (c) {
                        const cards = c.querySelectorAll('.ex-card');
                        if (cards[idx]) cards[idx].classList.remove('checked');
                        const checkbox = cards[idx]?.querySelector('.check-box');
                        if (checkbox) checkbox.checked = false;
                    }
                    return;
                }

                Calculadora.abrir(ejercicio.nombre, dia, idx);
            },

            _toggleDetalle(btn, imgUrl, inst) {
                const d = btn.nextElementSibling;
                if (d.classList.contains('open')) {
                    d.classList.remove('open');
                    btn.innerHTML = '<i class="fa-solid fa-circle-info"></i> Ver técnica';
                } else {
                    const imgHtml = imgUrl ?
                        `<img src="${imgUrl}" class="ex-img" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'ex-img-fallback\\'>💪</div>'" onclick="UI.abrirLightbox(this.src)" alt="Técnica">` :
                        `<div class="ex-img-fallback">💪</div>`;
                    d.innerHTML = `
                            ${imgHtml}
                            <div style="white-space:pre-wrap;font-size:13px;line-height:1.7;">${inst}</div>
                        `;
                    d.classList.add('open');
                    btn.innerHTML = '<i class="fa-solid fa-circle-chevron-up"></i> Ocultar';
                }
            },

            _getUltimoEntreno(nombre) {
                const ord = [...STATE.historialEntrenos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                for (const e of ord) {
                    const ej = e.ejercicios.find(x => x.nombre === nombre);
                    if (ej) return { fecha: e.fecha, peso: ej.peso, reps: ej.reps };
                }
                return null;
            },

            _verHistorial(nombre) {
                const hist = [];
                const ord = [...STATE.historialEntrenos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                for (const e of ord) {
                    const ej = e.ejercicios.find(x => x.nombre === nombre);
                    if (ej) hist.push({ fecha: e.fecha, peso: ej.peso, reps: ej.reps });
                }

                let html = `<h3><i class="fa-solid fa-clock-rotate-left"></i> ${nombre}</h3>`;
                if (hist.length === 0) {
                    html += '<div style="text-align:center;padding:12px;color:var(--text-secondary);">Sin historial</div>';
                } else {
                    const record = Records.getRecord(nombre);
                    if (record) {
                        html +=
                            `<div class="modal-record"><div class="mr-valor">🏆 ${record.weight} kg × ${record.reps}</div><div style="font-size:11px;color:var(--text-secondary);">${record.date}</div></div>`;
                    }
                    hist.forEach(x => {
                        const esCardio = nombre === 'Cardio en cinta';
                        html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                                <span>${UI.formatearFecha(x.fecha)}</span>
                                <span style="color:var(--primary);">${esCardio ? x.peso+' min' : x.peso+' kg · '+x.reps}</span>
                            </div>`;
                    });
                }
                html += `<button class="btn btn-ghost btn-block" onclick="Modal.cerrar()" style="margin-top:12px;">Cerrar</button>`;
                Modal.abrir(html);
            },

            _mostrarFinalizar() {
                const ejercicios = CONFIG.EJERCICIOS[diaActivo] || [];
                let html = `<h3><i class="fa-solid fa-clipboard-check"></i> Revisar entrenamiento</h3>`;
                ejercicios.forEach((ej, idx) => {
                    const id = `${diaActivo}-${idx}`;
                    const peso = document.getElementById(`peso-${id}`)?.value || '-';
                    const reps = ej.nombre === 'Cardio en cinta' ? '' : (document.getElementById(`reps-${id}`)
                        ?.value || '-');
                    const det = ej.nombre === 'Cardio en cinta' ? `${peso} min` : `${peso} kg · ${reps}`;
                    html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
                            <span>${ej.nombre}</span>
                            <span style="color:var(--primary);">${det}</span>
                        </div>`;
                });
                html += `
                        <button class="btn btn-success btn-block" onclick="Rutinas._guardarEntreno()" style="margin-top:14px;padding:14px;font-size:15px;">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                        <button class="btn btn-ghost btn-block" onclick="Modal.cerrar()" style="margin-top:6px;">Cancelar</button>
                    `;
                Modal.abrir(html);
            },

            _guardarEntreno() {
                const ejercicios = CONFIG.EJERCICIOS[diaActivo] || [];
                const datos = [];
                let hasRecord = false;

                ejercicios.forEach((ej, idx) => {
                    const id = `${diaActivo}-${idx}`;
                    const peso = parseFloat(document.getElementById(`peso-${id}`)?.value) || 0;
                    const reps = ej.nombre === 'Cardio en cinta' ? 'Cardio' : (document.getElementById(`reps-${id}`)
                        ?.value || '-');
                    datos.push({ nombre: ej.nombre, peso, reps });

                    if (peso > 0 && ej.nombre !== 'Cardio en cinta') {
                        const date = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit',
                            year: 'numeric' });
                        const repsNum = reps.split(',').map(Number).reduce((a, b) => a + b, 0);
                        if (Records.actualizar(ej.nombre, peso, repsNum, date)) hasRecord = true;
                    }
                });

                STATE.historialEntrenos.push({
                    fecha: UI.getHoy(),
                    dia: diaActivo,
                    tipo: CONFIG.TIPOS_RUTINA[diaActivo] || diaActivo.toUpperCase(),
                    ejercicios: datos
                });

                if (STATE.mediciones.length > 0) {
                    STATE.evolution.currentWeight = STATE.mediciones[STATE.mediciones.length - 1].peso;
                    STATE.evolution.currentWaist = STATE.mediciones[STATE.mediciones.length - 1].cintura;
                    STATE.evolution.totalWorkouts = STATE.diasEntrenados.length || 0;
                }
                Storage._save();
                Modal.cerrar();

                if (hasRecord) UI.toast('🏆 Nuevo récord!', 'success');
                UI.toast('✅ Entrenamiento guardado', 'success');
                APP.renderizarTodo();
            }
        };

        // ==========================================
        // RECORDS
        // ==========================================
        const Records = {
            getRecord(name) { return STATE.records.find(r => r.exerciseName === name); },
            actualizar(name, weight, reps, date) {
                const current = this.getRecord(name);
                if (!current || weight > current.weight || (weight === current.weight && reps > current.reps)) {
                    STATE.records = STATE.records.filter(r => r.exerciseName !== name);
                    STATE.records.push({ exerciseName: name, weight, reps, date });
                    Storage._save();
                    return true;
                }
                return false;
            },
            render() {
                const c = document.getElementById('recordsContainer');
                if (!c) return;
                if (STATE.records.length === 0) {
                    c.innerHTML =
                        `<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:20px;">

        // ==========================================
        // FOTOS
        // ==========================================
        const Fotos = {
            db: null,
            DB_NAME: 'FotosProgresoDB',
            STORE_NAME: 'diasFotos',

            _abrirDB() {
                return new Promise(r => {
                    const req = indexedDB.open(this.DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        if (!e.target.result.objectStoreNames.contains(this.STORE_NAME))
                            e.target.result.createObjectStore(this.STORE_NAME, { keyPath: 'fecha' });
                    };
                    req.onsuccess = e => { this.db = e.target.result;
                        r(); };
                    req.onerror = () => r();
                });
            },

            _leerArchivo(file) {
                if (!file) return Promise.resolve(null);
                return new Promise(r => { const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(file); });
            },

            async render() {
                const c = document.getElementById('fotosContainer');
                if (!c) return;

                const fechas = await this._obtenerFechas();

                c.innerHTML = `
                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-camera"></i> Subir fotos</div>
                            <div style="display:flex;gap:8px;margin-bottom:10px">
                                <input type="date" id="fechaFotos" class="input">
                            </div>
                            <div class="foto-grid-upload">
                                <div class="equip-card"><div class="label">Frente</div><input type="file" accept="image/*" onchange="Fotos._preview(this,'Frente')"><img id="previewFrente" class="foto-preview hidden"></div>
                                <div class="equip-card"><div class="label">Espalda</div><input type="file" accept="image/*" onchange="Fotos._preview(this,'Espalda')"><img id="previewEspalda" class="foto-preview hidden"></div>
                                <div class="equip-card"><div class="label">Izquierda</div><input type="file" accept="image/*" onchange="Fotos._preview(this,'Izquierda')"><img id="previewIzquierda" class="foto-preview hidden"></div>
                                <div class="equip-card"><div class="label">Derecha</div><input type="file" accept="image/*" onchange="Fotos._preview(this,'Derecha')"><img id="previewDerecha" class="foto-preview hidden"></div>
                            </div>
                            <button class="btn btn-primary btn-block" onclick="Fotos._guardar()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        </div>

                        <div class="card">
                            <div class="card-title"><i class="fa-solid fa-code-compare"></i> Comparar</div>
                            <div style="display:flex;gap:8px;margin-bottom:10px">
                                <select id="compararDia1" class="input" style="flex:1;">
                                    <option value="">Día 1</option>
                                    ${fechas.map(f => `<option value="${f}">${UI.formatearFecha(f)}</option>`).join('')}
                                </select>
                                <select id="compararDia2" class="input" style="flex:1;">
                                    <option value="">Día 2</option>
                                    ${fechas.map(f => `<option value="${f}">${UI.formatearFecha(f)}</option>`).join('')}
                                </select>
                            </div>
                            <button class="btn btn-primary btn-block" onclick="Fotos._comparar()"><i class="fa-solid fa-eye"></i> Comparar</button>
                            <div id="comparadorResultado" style="margin-top:10px"></div>
                        </div>
                    `;
                document.getElementById('fechaFotos').value = UI.getHoy();
            },

            _obtenerFechas() {
                return new Promise(r => {
                    if (!this.db) { this._abrirDB().then(() => this._obtenerFechas().then(r)); return; }
                    const req = this.db.transaction(this.STORE_NAME, 'readonly').objectStore(this.STORE_NAME)
                        .getAll();
                    req.onsuccess = e => r((e.target.result || []).sort((a, b) => b.timestamp - a.timestamp).map(i =>
                        i
                        .fecha));
                    req.onerror = () => r([]);
                });
            },

            async _guardar() {
                const f = document.getElementById('fechaFotos').value;
                if (!f) { UI.toast('Selecciona fecha', 'error'); return; }

                const inputs = document.querySelectorAll('.equip-card input[type="file"]');
                const files = {};
                for (const input of inputs) {
                    const label = input.parentElement.querySelector('.label').textContent;
                    files[label] = input.files[0];
                }

                const fr = await this._leerArchivo(files['Frente']);
                const es = await this._leerArchivo(files['Espalda']);
                const iz = await this._leerArchivo(files['Izquierda']);
                const de = await this._leerArchivo(files['Derecha']);

                if (!fr && !es && !iz && !de) { UI.toast('Selecciona al menos una foto', 'error'); return; }

                await this._abrirDB();
                await this.db.transaction(this.STORE_NAME, 'readwrite').objectStore(this.STORE_NAME).put({
                    fecha: f,
                    timestamp: Date.now(),
                    frente: fr,
                    espalda: es,
                    izquierda: iz,
                    derecha: de
                });
                STATE.recordatorios.ultimasFotos = f;
                Storage._save();
                UI.toast('✅ Fotos guardadas', 'success');
                this.render();
                APP.renderizarTodo();

                document.querySelectorAll('.equip-card input[type="file"]').forEach(input => input.value = '');
                document.querySelectorAll('.foto-preview').forEach(el => el.classList.add('hidden'));
            },

            _preview(input, tipo) {
                if (input.files[0]) {
                    const r = new FileReader();
                    r.onload = e => {
                        const img = document.getElementById('preview' + tipo);
                        img.src = e.target.result;
                        img.classList.remove('hidden');
                    };
                    r.readAsDataURL(input.files[0]);
                }
            },

            async _comparar() {
                const f1 = document.getElementById('compararDia1').value;
                const f2 = document.getElementById('compararDia2').value;
                if (!f1 || !f2) { UI.toast('Selecciona dos días', 'error'); return; }

                await this._abrirDB();
                const store = this.db.transaction(this.STORE_NAME, 'readonly').objectStore(this.STORE_NAME);
                const d1 = await new Promise(r => store.get(f1).onsuccess = e => r(e.target.result));
                const d2 = await new Promise(r => store.get(f2).onsuccess = e => r(e.target.result));

                const gen = (t, c) => {
                    if (!d1?.[c] && !d2?.[c]) return '';
                    return `
                            <div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:10px;margin-bottom:10px;border:1px solid var(--border);">
                                <h4 style="color:var(--primary);margin-bottom:6px;text-align:center;">${t}</h4>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                                    <img src="${d1?.[c]||''}" style="width:100%;border-radius:var(--radius-sm);object-fit:cover;cursor:pointer;" onclick="UI.abrirLightbox(this.src)" onerror="this.style.display='none'">
                                    <img src="${d2?.[c]||''}" style="width:100%;border-radius:var(--radius-sm);object-fit:cover;cursor:pointer;" onclick="UI.abrirLightbox(this.src)" onerror="this.style.display='none'">
                                </div>
                                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:4px;">
                                    <span>${UI.formatearFecha(f1)}</span>
                                    <span>${UI.formatearFecha(f2)}</span>
                                </div>
                            </div>
                        `;
                };

                let html = gen('FRENTE', 'frente') + gen('ESPALDA', 'espalda') + gen('IZQUIERDA', 'izquierda') + gen(
                    'DERECHA', 'derecha');
                if (!html) html =
                    '<div style="text-align:center;padding:20px;color:var(--text-secondary);">No hay fotos para comparar</div>';
                document.getElementById('comparadorResultado').innerHTML = html;
            }
        };

        // NOTIFICACIONES
        // ==========================================
        const Notificaciones = {
            generar() {

                if (getDiasHasta(pm) <= 1) notifs.push({ icono: '📏', texto: 'Mañana toca medición' });

                const freqFotos = STATE.recordatorios.freqFotos || 4;

                    freqFotos);

                if (dia !== 'domingo' && !entrenadoHoy) {

            render() {
